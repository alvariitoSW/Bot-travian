<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1016">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>AQVILA — El ascenso de Roma</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/maniobra.css">
  <link rel="stylesheet" href="css/batalla2.css">
</head>
<body>
  <div id="app">
    <div id="mapwrap"></div>
    <div id="citywrap" hidden></div>
    <header id="top">
      <div id="res"></div>
      <div id="bar2">
        <button id="citybtn" data-act="citymenu"></button>
        <div class="bar2r"><div id="datebox"><span id="date"></span><button id="speed" data-act="speed" data-v="next" title="Cambiar la velocidad"></button></div><button id="bmas" data-act="menumodo" aria-label="Más: general, crónica, ayuda y menú"></button></div>
      </div>
      <button id="turno" data-act="turno" hidden title="Avanzar hasta el final de la estación"></button>
      <div id="citymenu" hidden></div>
    </header>
    <div id="zoom"><button data-act="zoom" data-v="1.3" title="Acercar">＋</button><button data-act="zoom" data-v="0.77" title="Alejar">－</button><button data-act="home" title="Ir a mi general">🦅</button></div>
    <div id="sheet" hidden></div>
    <div id="ctop" hidden></div>
    <div id="linea" hidden><span id="l-cifra"></span><span id="l-nota" hidden></span><span id="l-texto"></span><button id="l-ok" data-act="entendido" hidden>Entendido</button></div>
    <div id="csheet" hidden><div id="fichab" hidden></div><div id="acciones"><button id="b-no" data-act="ccancel">Cancelar</button><button id="b-si" data-act="cbuild">Construir aquí</button></div><div id="bandeja"></div></div>
    <main id="view" hidden></main>
    <div id="hscrim" data-act="hojax" hidden></div>
    <div id="hoja" hidden></div>
    <div id="popsheet" hidden></div>
    <div id="cuentas" hidden></div>
    <nav id="tabs3" aria-label="Secciones"></nav>
    <div id="dock">
      <button id="bact" class="rd" data-act="accion"></button>
      <button id="bpill" data-act="pill"></button>
      <button id="bmodo" class="rd" data-act="menumodo"></button>
    </div>
  </div>

  <div id="battle" hidden>
    <div id="bfield"></div>
    <div id="bvig"></div>
    <div id="bhud"></div>
    <div id="bbottom">
      <div id="bcards"></div>
      <div id="bctl">
        <button data-act="bpause" id="bpause">II</button>
        <button data-act="bspeed" id="bspeed">x1</button>
        <button data-act="bauto" id="bauto" class="on">Auto</button>
        <button data-act="ball">Todas</button>
        <button data-act="bcam">Cámara</button>
        <button data-act="bskip">Fin</button>
      </div>
    </div>
    <div id="bhint">Arrastra para mover la cámara · pellizca para acercar y girar · toca un estandarte o tarjeta para seleccionar · toca el suelo o un enemigo para dar la orden</div>
  </div>

  <div id="modal" hidden><div id="mbox"></div></div>
  <div id="pausa" hidden><span id="p-txt"></span><button data-act="seguir">Continuar</button></div>
  <div id="toasts"></div>
  <div id="menu"></div>

  <script src="js/data.js"></script>
  <script src="js/asesor.js"></script>
  <script src="js/codice.js"></script>
  <script src="js/registro.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/game.js"></script>
  <script src="js/maniobra.js"></script>
  <script src="js/ui-maniobra.js"></script>
  <script src="js/batalla2.js"></script>
  <script src="js/ui-batalla2.js"></script>
  <script src="js/gfx/sonido-ciudad.js"></script>
  <script type="module" src="js/ui.js"></script>
</body>
</html>
