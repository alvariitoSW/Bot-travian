<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1016">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>AQVILA — El ascenso de Roma</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="mapwrap"></div>
    <div id="citywrap" hidden></div>
    <header id="top">
      <div id="res"></div>
      <div id="bar2">
        <span id="date"></span>
        <div id="speed">
          <button data-act="speed" data-v="0">II</button>
          <button data-act="speed" data-v="1">▶</button>
          <button data-act="speed" data-v="2">▶▶</button>
          <button data-act="speed" data-v="4">▶▶▶</button>
        </div>
      </div>
    </header>
    <div id="zoom"><button data-act="zoom" data-v="1.3">＋</button><button data-act="zoom" data-v="0.77">－</button><button data-act="home">🦅</button></div>
    <div id="sheet" hidden></div>
    <div id="ctop" hidden></div>
    <div id="csheet" hidden></div>
    <main id="view" hidden></main>
    <nav id="tabs">
      <button data-act="tab" data-v="map"><i><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg></i>Mapa</button>
      <button data-act="tab" data-v="city"><i><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M5 20V9h14v11M3 9h18M9 20v-6h6v6M12 4v5"/></svg></i>Ciudad</button>
      <button data-act="tab" data-v="army"><i><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19L17 7M14.5 5.5L18.5 9.5M3.5 17.5l3 3M7 17l-2.5 2.5"/><path d="M19 19L7 7M9.5 5.5L5.5 9.5M20.5 17.5l-3 3M17 17l2.5 2.5"/></svg></i>Ejército</button>
      <button data-act="tab" data-v="hero"><i><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5.5" r="2"/><path d="M12 7.5V17M12 10C9 9 5 9.5 2.5 12c2 .3 3.5.2 5 0-1.5 1.5-2.5 2.500-3 4 3-.5 5.500-2.500 7.500-6M12 10c3-1 7-.5 9.500 2-2 .3-3.500.2-5 0 1.500 1.500 2.500 2.500 3 4-3-.5-5.500-2.500-7.500-6"/><path d="M10 20.500l2-3.500 2 3.500"/></svg></i>General</button>
      <button data-act="tab" data-v="log"><i><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h11a2 2 0 012 2v12a2 2 0 01-2 2H8a2 2 0 01-2-2z"/><path d="M6 4a2 2 0 00-2 2v1h4M9 9h7M9 12.5h7M9 16h5"/></svg></i>Crónica</button>
    </nav>
  </div>

  <div id="battle" hidden>
    <div id="bfield"></div>
    <div id="bvig"></div>
    <div id="bhud"></div>
    <div id="bbottom">
      <div id="bcards"></div>
      <div id="bctl">
        <button data-act="bpause" id="bpause">II</button>
        <button data-act="bspeed" id="bspeed">x1</button>
        <button data-act="bauto" id="bauto" class="on">Auto</button>
        <button data-act="ball">Todas</button>
        <button data-act="bcam">Cámara</button>
        <button data-act="bskip">Fin</button>
      </div>
    </div>
    <div id="bhint">Arrastra para mover la cámara · pellizca para acercar y girar · toca un estandarte o tarjeta para seleccionar · toca el suelo o un enemigo para dar la orden</div>
  </div>

  <div id="modal" hidden><div id="mbox"></div></div>
  <div id="toasts"></div>
  <div id="menu"></div>

  <script src="js/data.js"></script>
  <script src="js/codice.js"></script>
  <script src="js/registro.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/game.js"></script>
  <script type="module" src="js/ui.js"></script>
</body>
</html>
