<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ganador: maqueta con suelo pintado</title>
<link rel="stylesheet" href="../comun/ui.css">
<style>
/* Tinte del estilo: piedra gris cálida y bronce (el de maqueta/) */
:root{--ui-fondo:rgba(62,56,50,.9);--ui-fondo2:rgba(92,84,74,.92);--ui-texto:#f2ece0;--ui-acento:#d3a063;--ui-acento2:#9a672f;--ui-borde:rgba(211,160,99,.6);--ui-linea:rgba(255,246,228,.16);
--ui-tinta-acento:#22150a;--ui-papel:#dcd4c4;--ui-papel2:#c2b8a3;--ui-tinta:#33281b;--ui-fuente:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
/* ---- pantallas nuevas ---- */
.gotas{position:absolute;left:0;top:0;width:390px;height:844px;pointer-events:none}
.etq.bar.banner{z-index:4;background:rgba(62,56,50,.8);font-size:11.5px;font-weight:600;letter-spacing:.2px;border-color:rgba(255,246,228,.35)}
.tarj,.aviso{position:absolute;left:8px;right:8px;top:44px;z-index:6;background:var(--ui-fondo);border:1px solid var(--ui-borde);border-radius:16px;padding:8px 11px;box-shadow:0 3px 12px #0006}
.tarj .t1{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px;line-height:1.25}
.tarj .t1 b{color:var(--ui-acento);font-size:16px}.tarj .pre{color:#e8dcc4}.tarj .sep{opacity:.5}.tarj .b2{font-weight:700;width:100%;font-size:14.5px;color:#cfe9fb}
.tarj .t2{margin-top:5px;padding-top:5px;border-top:1px solid var(--ui-linea);font-size:13px;line-height:1.3;display:flex;gap:7px;align-items:flex-start}
.tarj .t2 i{flex:none;width:9px;height:9px;border-radius:50%;background:#fff;margin-top:5px;box-shadow:0 0 6px 2px rgba(255,250,225,.9)}.tarj .t2 em{color:#f3c76b;font-style:normal}
.ico{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;flex:none}.ico svg{width:16px;height:16px;color:#fff}
.ico.azul{background:#3a92dc}.ico.verde{background:#5cb042;color:#fff;font-size:12px;font-weight:800}
.acc{position:absolute;left:8px;right:8px;bottom:14px;z-index:6;display:grid;grid-template-columns:1fr 1.6fr;gap:8px}
.acc button{border-radius:16px;padding:15px 8px;font-size:16px;font-weight:800;border:1px solid var(--ui-linea);background:var(--ui-fondo);box-shadow:0 3px 10px #0007}
.acc .si{background:linear-gradient(var(--ui-acento),var(--ui-acento2));color:var(--ui-tinta-acento);border-color:var(--ui-acento)}
.chips{position:absolute;left:8px;right:8px;top:42px;z-index:6;display:grid;grid-template-columns:repeat(8,1fr);gap:3px;background:var(--ui-fondo);border:1px solid var(--ui-borde);border-radius:14px;padding:4px}
.chip{height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--ui-fondo2);border:1px solid var(--ui-linea)}.chip svg{width:21px;height:21px;color:#e8dcc4}
.chip.on{background:#3a92dc;border-color:#bfe3ff;box-shadow:0 0 10px rgba(80,170,240,.7)}.chip.on svg{color:#fff}
.selnom{position:absolute;left:50%;transform:translateX(-50%);top:92px;z-index:6;background:var(--ui-fondo);border:1px solid var(--ui-borde);border-radius:99px;padding:3px 12px;font-size:12.5px;white-space:nowrap}.selnom b{color:#9fd3f7}
.leyz{position:absolute;left:8px;right:8px;bottom:78px;z-index:5;display:flex;justify-content:center;align-items:center;gap:6px;background:var(--ui-fondo);border:1px solid var(--ui-borde);border-radius:99px;padding:5px 8px;font-size:12.5px;white-space:nowrap}
.leyz span{display:flex;align-items:center;gap:5px}.leyz i{display:block}.leyz .az{width:16px;height:11px;border-radius:5px;background:rgba(58,146,220,.6);border:1.5px solid #1e5f99}
.leyz .gt{width:9px;height:12px;background:#d4402e;border:1.3px solid #fff;border-radius:50% 50% 50% 50%/62% 62% 38% 38%}
.pin{position:absolute;transform:translate(-50%,-50%);width:20px;height:20px;border-radius:50%;background:#3a92dc;border:2px solid #fff;display:flex;align-items:center;justify-content:center;z-index:2;box-shadow:0 1px 4px #0008}.pin svg{width:12px;height:12px;color:#fff}
.aviso{background:linear-gradient(#4a6a39,#3b5530);border-color:#a8d48c}.aviso .a1{display:flex;align-items:center;gap:7px;font-size:15px}.aviso .a1 b{font-size:15.5px}.aviso .a2{margin-top:3px;font-size:14px;color:#e9f5da;padding-left:31px}
.aqui{position:absolute;transform:translateX(-50%);z-index:3;background:#fff;color:#14588f;font-weight:800;font-size:12px;padding:1px 9px;border-radius:99px;border:2px solid #3a92dc;white-space:nowrap;box-shadow:0 2px 5px #0007}.aqui::after{content:'';position:absolute;left:50%;bottom:-7px;margin-left:-5px;border:5px solid transparent;border-top-color:#3a92dc;border-bottom:0}
.obra{position:absolute;transform:translateX(-50%);background:#a8793f;color:#fff;font-size:10.5px;font-weight:700;padding:0 6px;border-radius:99px;border:1px solid #f0d9a4;z-index:2;white-space:nowrap;line-height:1.35}
.cara{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;z-index:3;filter:drop-shadow(0 2px 3px #0008)}.cara svg{width:34px;height:34px;display:block}
/* ficha del barrio: hoja inferior */
.hoja{position:absolute;left:0;right:0;bottom:0;top:344px;z-index:7;background:linear-gradient(var(--ui-papel),var(--ui-papel2));color:var(--ui-tinta);border-radius:22px 22px 0 0;border-top:3px solid var(--ui-acento2);padding:5px 12px 12px;box-shadow:0 -6px 18px #0008;overflow:clip;display:flex;flex-direction:column}
.hoja .asa{width:38px;height:4px;border-radius:9px;background:#7a6a50;opacity:.5;margin:0 auto 4px}
.hoja .cab{display:flex;justify-content:space-between;align-items:flex-start}.hoja h3{margin:0;font-size:16px;color:#5a3a10}.hoja .vec{font-size:12.5px}.hoja .x{font-size:15px;color:#5a3a10;padding:0 4px}
.hoja .animo{margin:5px 0 4px;background:rgba(255,255,255,.35);border:1px solid rgba(90,58,16,.25);border-radius:12px;padding:5px 9px 4px}
.hoja .al{display:flex;align-items:baseline;gap:6px;font-size:12.5px;flex-wrap:wrap}.hoja .al b{font-size:13px}.hoja .tend{color:#2f7a1c;font-weight:800;font-size:14px}.hoja .est{margin-left:auto;font-weight:800;font-size:13.5px;text-align:right}.hoja .est small{font-weight:600;font-size:11.5px;color:#5a3a10}
.hoja .med{position:relative;height:11px;margin:5px 0 2px;border-radius:99px;background:linear-gradient(90deg,#c93a28,#e0a52e 50%,#5cb042);border:1px solid #5a3a10}
.hoja .mk{position:absolute;top:-4px;width:6px;height:17px;margin-left:-3px;border-radius:3px;background:#fff;border:1.5px solid #33281b}.hoja .mk.fut{background:transparent;border-style:dashed;opacity:.8}
.hoja .ex{display:flex;justify-content:space-between;font-size:10.5px;color:#5a3a10;font-weight:600}
.hoja .fila{display:grid;grid-template-columns:20px 84px 1fr 34px 42px;gap:6px;align-items:center;height:26px;font-size:12.5px;border-bottom:1px solid rgba(90,58,16,.14)}
.hoja .fila .ic{width:20px;height:20px}.hoja .fila .ic svg{width:14px;height:14px}.hoja .fila .nm{font-weight:600;white-space:nowrap}
.hoja .bar{height:9px;border-radius:9px;background:rgba(60,40,15,.22);overflow:clip;display:block}.hoja .bar i{display:block;height:100%;border-radius:9px}
.hoja i.bien{background:var(--ui-bien)}.hoja i.falta{background:var(--ui-falta)}.hoja i.mal{background:var(--ui-mal)}
.hoja .pc{text-align:right;font-weight:700}.hoja .es{font-weight:800;font-size:12px}.es.bien{color:#2f7a1c}.es.falta{color:#a86d00}.es.mal{color:#b22a18}
.hoja .pesan{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:6px;font-size:12.5px}.hoja .pesan small{width:100%;font-size:11px;color:#5a3a10;margin-top:-1px}
.pq{display:inline-flex;align-items:center;gap:3px;border-radius:99px;padding:1px 8px 1px 4px;font-weight:700;font-size:12.5px;border:1.5px solid}.pq svg{width:14px;height:14px}
.pq.bien{border-color:#5cb042;background:rgba(92,176,66,.18)}.pq.falta{border-color:#e0a52e;background:rgba(224,165,46,.2)}.pq.mal{border-color:#d4402e;background:rgba(212,64,46,.16)}
.hoja .rem{margin-top:auto}.hoja .rt{font-size:13px;line-height:1.3;margin-bottom:4px}.hoja .rt em{font-style:normal;font-weight:800;color:#2f7a1c}
.hoja .btn{display:block;width:100%;border-radius:14px;padding:11px 8px;font-size:15px;font-weight:800;text-align:center;border:1px solid var(--ui-acento);background:linear-gradient(var(--ui-rojo),var(--ui-rojo2));color:#fff}
</style></head>
<body><div id="app"><div id="lienzo"></div><div id="ui"></div></div>
<script src="../comun/escena.js"></script>
<script src="../comun/ui.js"></script>
<script src="zonas.js"></script>
<script src="ui-zonas.js"></script>
<script type="module">
import { dibujarCiudad } from './render.js';
const q = new URLSearchParams(location.search), modo = q.get('p') || 'ciudad', E = window.ESCENA;
const t0 = performance.now(), Z = window.Zonas.calcularZonas(E), msZ = performance.now() - t0;
const CAPAS = { ciudad: null, construir: null, necesidades: { barrios: {}, barrioAlfa: .26 },
  colocar: { nec: 'agua', nueva: true, barrios: {}, brillo: 'rio', barrioAlfa: .26 }, zonas: { nec: q.get('n') || 'agua', barrios: {}, barrioAlfa: .24 },
  subir: { barrios: { rio: 'falta' }, barrioAlfa: .34 }, barrio: { barrios: {}, brillo: 'rio', barrioAlfa: .3 } };
const api = dibujarCiudad(E, document.getElementById('lienzo'), { modo, Z, capas: CAPAS[modo] });
const proy2 = (x, y) => api.proyectar(x, y);
if (['colocar', 'zonas', 'subir', 'barrio'].includes(modo)) window.montarZonas({ modo, Z, proyectar: proy2, proyectar3: api.proyectar, nec: q.get('n') });
else window.montarUI({ modo, proyectar: proy2 });
if (modo === 'necesidades') document.querySelectorAll('.halo').forEach(h => h.remove());
window.zonasMs = { bfs_ms: +Z.msBfs.toFixed(1), zonas_ms: +msZ.toFixed(1), ...window.medidasGanador };
console.log('ZONAS ' + JSON.stringify(window.zonasMs));
window.listo = true;
</script>
</body></html>
