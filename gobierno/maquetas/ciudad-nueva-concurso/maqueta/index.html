<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maqueta de museo</title>
<link rel="stylesheet" href="../comun/ui.css">
<style>
/* Tinte del estilo: piedra gris cálida y bronce */
:root{--ui-fondo:rgba(62,56,50,.9);--ui-fondo2:rgba(92,84,74,.92);--ui-texto:#f2ece0;--ui-acento:#d3a063;--ui-acento2:#9a672f;--ui-borde:rgba(211,160,99,.6);--ui-linea:rgba(255,246,228,.16);
--ui-tinta-acento:#22150a;--ui-papel:#dcd4c4;--ui-papel2:#c2b8a3;--ui-tinta:#33281b;--ui-fuente:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
/* tilt-shift barato: franjas con desenfoque que se funden con la imagen, arriba y abajo (bajo la interfaz) */
.ts{position:absolute;left:0;right:0;pointer-events:none;z-index:1}
.ts.a1{top:0;height:230px;backdrop-filter:blur(2.5px);-webkit-backdrop-filter:blur(2.5px);-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.ts.a2{top:0;height:110px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.ts.b1{bottom:0;height:250px;backdrop-filter:blur(2.5px);-webkit-backdrop-filter:blur(2.5px);-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}
.ts.b2{bottom:0;height:120px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}
</style></head>
<body><div id="app"><div id="lienzo"></div><div id="ui"></div></div>
<script src="../comun/escena.js"></script>
<script src="../comun/ui.js"></script>
<script type="module">
import { dibujarCiudad } from './render.js';
const l = document.getElementById('lienzo');
const api = dibujarCiudad(window.ESCENA, l);
for (const c of ['a1', 'a2', 'b1', 'b2']) { const d = document.createElement('div'); d.className = 'ts ' + c; l.appendChild(d); }
montarUI({ proyectar: api.proyectar });
window.listo = true;
</script>
</body></html>
