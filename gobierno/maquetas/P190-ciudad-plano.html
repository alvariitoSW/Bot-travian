const c=document.getElementById('c'),g=c.getContext('2d'),W=390,H=844;
let sd=7;const R=()=>(sd=(sd*16807)%2147483647)/2147483647,rr=(a,b)=>a+R()*(b-a),pick=a=>a[Math.floor(R()*a.length)];

 const P=(a,f)=>{const p=wp(a);return[CX+(p[0]-CX)*f,CY+(p[1]-CY)*f]};
 const q=[P(a0,r0),P(a1,r0),P(a1,r1),P(a0,r1)];const mx=(q[0][0]+q[2][0])/2,my=(q[0][1]+q[2][1])/2;
 const norte=my<rioY(mx)+10;if(Math.abs(my-rioY(mx))>30&&!(norte&&R()<.6)&&R()>.1&&q.every(p=>Math.abs(p[1]-rioY(p[0]))>12))campos.push({q,col:pick(cols),dir:R()<.5});r0=r1+.025}}

 for(let i=0;i<=n;i++){const t=i/n;g.beginPath();if(f.dir){g.moveTo(a[0]+(d[0]-a[0])*t,a[1]+(d[1]-a[1])*t);g.lineTo(b[0]+(cc[0]-b[0])*t,b[1]+(cc[1]-b[1])*t)}else{g.moveTo(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t);g.lineTo(d[0]+(cc[0]-d[0])*t,d[1]+(cc[1]-d[1])*t)}g.stroke()}

{const p=gates[0];g.strokeStyle='#6b5a3c';g.lineWidth=7;g.beginPath();g.moveTo(p[0],p[1]-2);g.lineTo(p[0]+3,p[1]-36);g.stroke();g.strokeStyle='#d8c9a0';g.lineWidth=4;g.stroke()}
