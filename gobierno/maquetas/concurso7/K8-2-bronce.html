<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=844, initial-scale=1">
<title>Bronce y pátina</title>
<style>
@font-face{font-family:Cinzel;src:url(../../../assets/fuentes/cinzel-700.woff2) format("woff2");font-weight:700}
:root{--ink:#071a18;--bg:#0d2623;--p:#143733;--p2:#1c4a44;--pat:#6fb8a3;--br:#c8923e;--br2:#ecc772;--tx:#e8e2c9;--rom:#c4452f;--ene:#8a6bc2}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:844px;height:390px;overflow:hidden;background:var(--ink);color:var(--tx);font:12px/1.25 system-ui,sans-serif}
#app{display:grid;grid-template-columns:420px 4px 420px;width:844px;height:390px}
.half{display:grid;min-width:0;overflow:hidden;background:var(--bg)}
#L{grid-template-rows:28px 300px 62px}
#R{grid-template-rows:28px 190px 172px}
header{display:flex;align-items:center;justify-content:space-between;padding:0 8px;background:linear-gradient(#1f524b,#143733);border-bottom:1.5px solid var(--br);font:700 12px Cinzel,serif;color:var(--br2);letter-spacing:.06em;text-shadow:0 1px 0 #000}
#div{position:relative;background:linear-gradient(90deg,#8a5d1f,#ecc772 45%,#8a5d1f);z-index:2}
#div i{position:absolute;left:-7px;top:171px;width:18px;height:48px;border-radius:9px;background:linear-gradient(90deg,#8a5d1f,#ecc772,#8a5d1f);border:1px solid #3a2608}
#div i::before,#div i::after{content:"";position:absolute;left:6px;width:6px;height:6px;border-radius:50%;background:#3a2608;box-shadow:inset 0 1px 0 #ecc77288}
#div i::before{top:12px}#div i::after{top:30px}
#div::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,#3a2608 1.3px,transparent 2px) 50% 14px/4px 46px repeat-y}
.step{display:flex;gap:3px}
.step b{font:700 10px Cinzel,serif;padding:4px 6px;border:1px solid #6b4a1a;color:var(--pat);background:#0d2623;border-radius:3px;letter-spacing:.02em;cursor:pointer}
.step b.on{background:var(--br2);color:#1a1205;border-color:var(--br2)}
.chips{display:flex;gap:5px;font:700 10px Cinzel,serif}
.chips span{padding:3px 6px;border:1px solid var(--br);border-radius:3px;background:#0d2623;color:var(--tx)}
#map svg,#scene svg{display:block}
#scene{position:relative;border-bottom:1.5px solid var(--br)}
.cap,.cam{position:absolute;background:rgba(7,26,24,.86);border:1px solid var(--br);padding:3px 7px;font-size:11px;color:var(--tx)}
.cap{left:6px;bottom:6px;max-width:300px}
.cam{right:6px;top:6px;font:700 10px Cinzel,serif;color:var(--br2)}
#tools{display:flex;gap:5px;padding:9px 6px;background:linear-gradient(#143733,#0d2623);border-top:1.5px solid var(--br)}
.btn{flex:1;height:44px;min-width:0;border:1.5px solid var(--br);border-radius:4px;background:linear-gradient(#1f524b,#143733);color:var(--br2);font:700 11px Cinzel,serif;letter-spacing:.03em;text-shadow:0 1px 0 #000;box-shadow:inset 0 0 0 1px #07161488}
.btn.on,.btn.p{background:linear-gradient(#ecc772,#b9822f);color:#1a1205;text-shadow:none;border-color:#f6dfa0}
#pan{display:grid;grid-template-rows:14px 1fr 44px;gap:4px;padding:5px 6px;background:linear-gradient(#143733,#0d2623)}
#pan h4{font:700 10px Cinzel,serif;color:var(--pat);letter-spacing:.1em}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;min-height:0}
.card{display:flex;flex-direction:column;gap:3px;text-align:left;padding:6px;border:1.5px solid #6b4a1a;border-radius:4px;background:#0d2623;color:var(--tx);font:inherit;overflow:hidden}
.card.sel{border-color:var(--br2);background:#1c4a44;box-shadow:0 0 0 1px var(--br) inset}
.card svg{width:22px;height:22px;color:var(--br2);flex:none}
.card b{font:700 11px/1.15 Cinzel,serif;color:var(--br2)}
.card span{font-size:10.5px;line-height:1.2;color:#cfd8c4}
.card em{margin-top:auto;font:normal 10px system-ui;color:var(--pat)}
.regs{display:grid;gap:3px;align-content:start;min-height:0}
.reg{display:grid;grid-template-columns:118px 1fr 1fr;gap:6px;align-items:center;font-size:11px}
.bar{height:7px;background:#07161a;border:1px solid #6b4a1a;position:relative}
.bar u{position:absolute;inset:0 auto 0 0;background:var(--pat)}
.bar.e u{background:var(--ene)}.bar.f u{background:var(--br)}
.log{font-size:11px;color:#cfd8c4;border-left:2px solid var(--br);padding-left:6px;margin-top:2px}
.row{display:flex;gap:5px}
@keyframes bob{to{transform:translateY(-2.5px)}}
@keyframes dm{to{stroke-dashoffset:-20}}
.b{animation:bob .45s ease-in-out infinite alternate}
.dash{stroke-dasharray:6 4;animation:dm 1s linear infinite}
</style></head><body>
<div id="app">
<section class="half" id="L"><header id="Lh"></header><div id="map"></div><div id="tools"></div></section>
<div id="div"><i></i></div>
<section class="half" id="R"><header id="Rh"></header><div id="scene"></div><div id="pan"></div></section>
</div>
<svg width="0" height="0" style="position:absolute"><defs>
<g id="leg"><rect x="-2.5" y="-9" width="5" height="9" fill="#c4452f"/><circle cx="0" cy="-12" r="3" fill="#ecc772"/><rect x="-1.5" y="-15.5" width="3" height="2" fill="#c4452f"/><rect x="-7" y="-12" width="5" height="10" rx="1.5" fill="#a8321f" stroke="#ecc772" stroke-width=".7"/><line x1="4" y1="-1" x2="4" y2="-18" stroke="#e8e2c9" stroke-width="1"/></g>
<g id="pha"><rect x="-2.5" y="-9" width="5" height="9" fill="#8a6bc2"/><circle cx="0" cy="-12" r="3" fill="#d8c08a"/><circle cx="3.5" cy="-8" r="4.5" fill="#5a418a" stroke="#d8c08a" stroke-width=".7"/><line x1="-2" y1="-6" x2="-26" y2="-13" stroke="#e8e2c9" stroke-width="1"/></g>
<g id="cav"><ellipse cx="0" cy="-9" rx="11" ry="5" fill="#6b4a2a"/><path d="M8 -11l6 -7 3 2 -5 9z" fill="#6b4a2a"/><path d="M-8 -5v7M-3 -5v7M3 -5v7M8 -5v7" stroke="#4a3219" stroke-width="1.6"/><rect x="-2" y="-19" width="5" height="9" fill="#c4452f"/><circle cx="0.5" cy="-22" r="3" fill="#ecc772"/><line x1="4" y1="-16" x2="22" y2="-24" stroke="#e8e2c9" stroke-width="1.2"/></g>
<g id="ele"><ellipse cx="0" cy="-20" rx="20" ry="13" fill="#7d8a86"/><circle cx="-19" cy="-24" r="8" fill="#7d8a86"/><path d="M-26 -20q-6 10 -2 20" fill="none" stroke="#7d8a86" stroke-width="4" stroke-linecap="round"/><rect x="-14" y="-10" width="6" height="10" fill="#6a7873"/><rect x="8" y="-10" width="6" height="10" fill="#6a7873"/><rect x="-8" y="-40" width="18" height="9" rx="2" fill="#8a6bc2" stroke="#ecc772" stroke-width=".8"/><circle cx="-1" cy="-44" r="3" fill="#ecc772"/><circle cx="6" cy="-44" r="3" fill="#ecc772"/><path d="M-12 -24l-8 6" stroke="#e8e2c9" stroke-width="2"/></g>
</defs></svg>
<script>
const $=id=>document.getElementById(id);
let S=+(location.hash.slice(1))||1;
const IC={
 flank:'<path d="M3 20C3 10 9 5 18 6" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M14 2l6 4-5 5z" fill="currentColor"/>',
 shield:'<path d="M4 4h16v8c0 5-4 8-8 10C8 20 4 17 4 12z" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 7v11M7 11h10" stroke="currentColor" stroke-width="1.6"/>',
 tree:'<path d="M12 2l7 9h-4l5 7H4l5-7H5z" fill="currentColor"/><rect x="11" y="18" width="2" height="4" fill="currentColor"/>',
 back:'<path d="M20 20C20 10 14 5 6 6" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M10 2L4 6l5 5z" fill="currentColor"/>',
 tower:'<path d="M5 22V8h3V5h3v3h2V5h3v3h3v14z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 22v-6h4v6" fill="currentColor"/>',
 wall:'<path d="M2 20V9h4v3h4V9h4v3h4V9h4v11z" fill="none" stroke="currentColor" stroke-width="2"/>'};
const D=[
 {st:'Planear',day:'Día 1',gr:360,mo:80,cam:'Cámara: general',cap:'Vista general. Tu línea frente a la falange.',
  tools:['Mover','Flanquear','Emboscar','Formación'],on:1,h:'Consejo. Elige una opción',
  cards:[['flank','Flanco de caballería','El ala izquierda rodea y carga por detrás.','Riesgo medio'],['shield','Muro de escudos','Aguanta a los elefantes de frente.','Riesgo bajo'],['tree','Emboscada en el bosque','Velites ocultos atacan al elefante.','Riesgo alto']],
  btn:[['Quitar orden',0],['Ver el campo',0],['Empezar turno',1,1]]},
 {st:'Directo',day:'Día 1',gr:360,mo:84,cam:'Cámara: caballería',cap:'Ala izquierda. Carga al flanco, quedan 12 s.',
  tools:['Cargar','Frenar','Girar ala','Retirar'],on:0,h:'Consejo. Turno 2 de 5',
  cards:[['flank','Cargar ahora','Jinetes al flanco antes de que giren.','Riesgo medio'],['shield','Esperar al elefante','Que rompa contra el muro.','Riesgo bajo'],['back','Retirar el ala','Salvar jinetes y rehacer.','Riesgo bajo']],
  btn:[['Pausa',0],['Velocidad x2',0],['Dar orden',-1],['Ver choque',1,1]]},
 {st:'Choque',day:'Día 1',gr:350,mo:78,cam:'Cámara: línea',cap:'Cuerpo a cuerpo. Los velites salen del bosque.',
  tools:['Reforzar','Reagrupar','Retirar','Cámara libre'],on:-1,h:'Regimientos en el choque',
  regs:[['Hastati II · línea',70,82,0],['Equites · ala izq.',90,64,0],['Falange epirota 3',38,55,1]],
  log:['Los jinetes tocan el flanco de la falange.','Un elefante se asusta y rompe su propia fila.'],
  btn:[['Dar orden',-2],['Seguir regimiento',0],['Ver resultado',1,1]]},
 {st:'Posición',day:'Día 3',gr:300,mo:71,cam:'Cámara: muralla',cap:'Asculum es tuya. Guarnición de 3 regimientos.',
  tools:['Guarnición','Muros','Patrulla','Suministro'],on:0,h:'Mantener la posición. Elige una',
  cards:[['tower','Mantener el pueblo','3 días. Grano -40 al día.','Cuesta grano'],['wall','Reforzar muros','Madera -30. Más defensa.','Cuesta madera'],['flank','Perseguir al rey','Sale la caballería. El pueblo queda flojo.','Riesgo alto']],
  btn:[['Ver bajas',0],['Nuevo plan',-3],['Mantener 1 día',0,1]]}];

function U(x,y,side,n,t){
 const c=side?'#c4452f':'#8a6bc2';
 if(t=='e')return `<g><circle cx="${x}" cy="${y}" r="7" fill="#7d8a86" stroke="#8a6bc2" stroke-width="1.5"/><text x="${x}" y="${y+3.5}" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">E</text></g>`;
 if(t=='x')return `<path d="M${x-6} ${y-6}l12 12M${x+6} ${y-6}l-12 12" stroke="#ecc772" stroke-width="1.5"/>`;
 return `<g><rect x="${x-11}" y="${y-5}" width="22" height="10" rx="1.5" fill="${c}" stroke="#ecc772" stroke-width=".8" ${t=='h'?'stroke-dasharray="3 2" opacity=".7"':''}/>${t=='c'?`<path d="M${x-11} ${y+5}L${x+11} ${y-5}" stroke="#ecc772" stroke-width="1"/>`:''}<text x="${x}" y="${y+3.5}" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">${n}</text></g>`}

function map(s){
 const i=s-1,yi=[236,205,140,100][i];
 let o=`<svg viewBox="0 0 420 300" width="420" height="300"><defs><pattern id="ht" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0H7" stroke="#2a6a60" stroke-width=".8"/></pattern><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#ecc772"/></marker><marker id="ae" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#b79cf0"/></marker></defs>
 <rect width="420" height="300" fill="#164540"/><rect width="420" height="300" fill="url(#ht)" opacity=".55"/>
 <path d="M-5 160C70 120 150 190 230 150S360 110 425 130" fill="none" stroke="#0d2623" stroke-width="18"/><path d="M-5 160C70 120 150 190 230 150S360 110 425 130" fill="none" stroke="#4aa5a5" stroke-width="12"/><path d="M-5 160C70 120 150 190 230 150S360 110 425 130" fill="none" stroke="#9fe0d4" stroke-width="2" opacity=".6"/>
 <text x="360" y="124" font-size="9" fill="#9fe0d4">río Carapelle</text>`;
 for(let k=0;k<4;k++)o+=`<ellipse cx="70" cy="92" rx="${16+k*12}" ry="${9+k*7}" fill="none" stroke="#6fb8a3" stroke-width=".8" opacity="${.9-k*.15}"/>`;
 o+=`<text x="58" y="95" font-size="9" fill="#6fb8a3">loma</text>`;
 for(let k=0;k<14;k++){const x=300+(k%5)*14+(k>>2)*3,y=195+(k%3)*13;o+=`<path d="M${x} ${y}l-6 -13 12 0z" fill="#2f7a64" stroke="#0d2623" stroke-width=".6"/>`}
 o+=`<path d="M0 285C120 270 240 150 330 62" fill="none" stroke="#c8923e" stroke-width="2" stroke-dasharray="5 4" opacity=".8"/>
 <g transform="translate(335 52)"><rect x="-20" y="-10" width="40" height="22" fill="#2e6a60" stroke="#c8923e" stroke-width="1.5"/>${[-20,-8,4,14].map(x=>`<rect x="${x}" y="-15" width="6" height="5" fill="#c8923e"/>`).join('')}<path d="M-5 12V2a5 5 0 0 1 10 0v10z" fill="#0d2623"/></g>
 <text x="335" y="76" text-anchor="middle" font-size="10" font-weight="700" fill="#ecc772">Asculum</text>
 <path d="M12 288H64M12 284v8M64 284v8M38 284v8" stroke="#ecc772" stroke-width="1"/><text x="68" y="291" font-size="9" fill="#ecc772">190 m · mapa de 1.500 m</text>`;
 // overlays
 if(s==1)o+=`<ellipse cx="50" cy="262" rx="19" ry="12" fill="none" stroke="#ecc772" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M50 262C30 200 60 140 138 120" fill="none" stroke="#ecc772" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ar)"/><path d="M135 232V188" stroke="#ecc772" stroke-width="2" marker-end="url(#ar)"/><circle cx="332" cy="208" r="30" fill="none" stroke="#ecc772" stroke-width="1.3" stroke-dasharray="3 3"/><text x="332" y="248" text-anchor="middle" font-size="9" fill="#ecc772">emboscada</text><text x="60" y="244" font-size="9" fill="#ecc772">flanco</text>`;
 if(s==2)o+=`<path d="M40 190C40 150 90 122 134 112" fill="none" stroke="#ecc772" stroke-width="2.6" class="dash" marker-end="url(#ar)"/><path d="M190 62V100M260 74V108" stroke="#b79cf0" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ae)"/><text x="200" y="52" font-size="9" fill="#b79cf0">elefantes avanzan</text>`;
 if(s==3){[150,185,220,255,290].forEach((x,k)=>o+=`<path d="M${x} ${112-k%2*4}l3 -6 3 6 -6 -3 6 0z" fill="#ecc772"/>`);o+=`<path d="M330 160L292 126" stroke="#ecc772" stroke-width="2" marker-end="url(#ar)"/><circle cx="138" cy="112" r="17" fill="none" stroke="#ecc772" stroke-width="1.5" stroke-dasharray="3 3"/><text x="60" y="30" font-size="9" fill="#b79cf0">Un elefante huye al norte</text>`}
 if(s==4)o+=`<circle cx="335" cy="55" r="48" fill="#c4452f" fill-opacity=".12" stroke="#ecc772" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M335 42V22l14 5-14 5" fill="#c4452f" stroke="#ecc772" stroke-width=".8"/><path d="M10 210V150" stroke="#b79cf0" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ae)"/><text x="16" y="214" font-size="9" fill="#b79cf0">el rey huye</text>`;
 // unidades
 for(let k=0;k<6;k++)o+=U(s<4?70+k*30:262+(k%3)*28,s<4?yi:82+(k>2)*14,1,k+1);
 for(let k=0;k<2;k++)o+=U(s<4?100+k*60:250+k*30,s<4?yi+28:125,1,7+k);
 const cl=[[50,262],[40,190],[138,112],[385,95]][i],cr=[[255,272],[300,235],[300,172],[385,60]][i];
 o+=U(cl[0],cl[1],1,9,'c')+U(cr[0],cr[1],1,10,'c');
 o+=U(...[[332,208],[332,208],[330,165],[352,100]][i],1,11,s<3?'h':'v').replace(/^/,'');
 const ey=[64,80,120,0][i];
 for(let k=0;k<5;k++){ if(s<4)o+=U(150+k*34,ey,0,k+1); else o+=k<3?U(40+k*20,150+k*14,0,k+1):U(150+k*34,120,0,0,'x') }
 if(s<4){for(let k=0;k<2;k++)o+=U(195+k*70,[40,58,92][i],0,0,'e');o+=U(390,90,0,6,'c')}
 return o+'</svg>'}

function F(id,x,y,k,d,c){return `<g transform="translate(${x} ${y}) scale(${k})"><g class="${c||''}" style="animation-delay:${d}s"><use href="#${id}"/></g></g>`}
function scene(s){
 let o=`<svg viewBox="0 0 420 190" width="420" height="190"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#15393a"/><stop offset="1" stop-color="#d0a85c"/></linearGradient></defs><rect width="420" height="190" fill="url(#sk)"/><circle cx="340" cy="58" r="15" fill="#ecc772" opacity=".85"/><path d="M0 100Q60 66 120 90T250 84T420 76V190H0z" fill="#245a52"/><path d="M0 112Q100 96 200 108T420 100V190H0z" fill="#1a4640"/>`;
 for(let k=0;k<7;k++)o+=`<path d="M0 ${118+k*11}H420" stroke="#2c6a5f" stroke-width=".6" opacity=".6"/>`;
 if(s==1){
  for(let k=0;k<5;k++){const x=195+k*11,y=124+k%2*6;o+=`<path d="M${x} ${y}l-8 -26 16 0z" fill="#2f7a64"/>`}
  o+=`<ellipse cx="217" cy="112" rx="36" ry="24" fill="none" stroke="#ecc772" stroke-width="1.2" stroke-dasharray="3 3"/><text x="217" y="82" text-anchor="middle" font-size="9" fill="#ecc772">velites ocultos</text>`;
  for(let r=0;r<3;r++)for(let c=0;c<6;c++)o+=F('leg',24+c*19+r*6,134+r*16,.9+r*.1,0);
  o+=F('ele',330,128,1.2,0)+F('ele',380,148,1.3,0);
  for(let r=0;r<3;r++)for(let c=0;c<5;c++)o+=F('pha',290+c*20-r*4,138+r*16,.9+r*.1,0)}
 if(s==2){
  for(let c=0;c<5;c++)o+=F('pha',300+c*22,126+c%2*8,1,c*.1,'b');
  o+=F('ele',390,120,1.1,0);
  for(let k=0;k<5;k++)o+=`<path d="M${20+k*8} ${120+k*14}H${80+k*8}" stroke="#e8e2c9" stroke-width="1" opacity=".5"/>`;
  for(let c=0;c<4;c++)o+=F('cav',70+c*52,146+c%2*16,1.4,c*.08,'b');
  for(let k=0;k<6;k++)o+=`<circle cx="${30+k*16}" cy="${172+k%2*6}" r="${4+k%3*2}" fill="#d0a85c" opacity=".35"/>`}
 if(s==3){
  o+=F('ele',372,112,1.2,0);
  for(let k=0;k<7;k++)o+=`<path d="M${60+k*50} 20l${40} ${36}" stroke="#e8e2c9" stroke-width=".8" opacity=".5"/>`;
  for(let r=0;r<2;r++)for(let c=0;c<5;c++){const x=70+c*38+r*10,y=130+r*24;o+=F('leg',x,y,1.25,(c+r)*.09,'b')+F('pha',x+30,y,1.25,(c+r)*.09+.2,'b')+`<path d="M${x+14} ${y-18}l3 -6 3 6 -6 -3 6 0z" fill="#ecc772"/>`}
  for(let k=0;k<5;k++)o+=`<circle cx="${60+k*60}" cy="${176}" r="${8+k%2*4}" fill="#d0a85c" opacity=".3"/>`}
 if(s==4){
  o+=`<rect x="236" y="70" width="184" height="82" fill="#2e6a60" stroke="#c8923e" stroke-width="1.5"/>`;
  for(let k=0;k<9;k++)o+=`<rect x="${238+k*20}" y="61" width="13" height="9" fill="#2e6a60" stroke="#c8923e"/>`;
  o+=`<path d="M312 152v-34a17 17 0 0 1 34 0v34z" fill="#0d2623" stroke="#c8923e" stroke-width="1.5"/><path d="M396 61V22" stroke="#ecc772" stroke-width="2"/><path d="M396 22h-24v16h24z" fill="#c4452f" stroke="#ecc772"/>`;
  for(let k=0;k<5;k++)o+=F('leg',256+k*30,72,.8,k*.1);
  for(let r=0;r<2;r++)for(let c=0;c<7;c++)o+=F('leg',60+c*22+r*8,150+r*18,1,0);
  for(let k=0;k<3;k++)o+=F('pha',30+k*22,112+k*6,.55,k*.1,'b')}
 return o+'</svg>'}

function render(){
 const d=D[S-1],i=S-1;
 $('Lh').innerHTML=`<span>Asculum 279 a.C.</span><div class="step">${D.map((x,k)=>`<b class="${k==i?'on':''}" onclick="go(${k+1})">${k+1} ${x.st}</b>`).join('')}</div>`;
 $('map').innerHTML=map(S);
