<style>

<script>
const $=s=>document.querySelector(s),ease=t=>t*t*(3-2*t),cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),lerp=(a,b,t)=>a+(b-a)*t;
const ROUTE='M310 335 C360 335 400 318 445 314 S600 340 650 255 L660 190',RIVER='M385 28 C420 100 360 170 410 230 S450 340 420 392';

function trees(cx,cy,n,seed){let o='',s=seed;for(let i=0;i<n;i++){s=(s*9301+49297)%233280;const a=s/233280;s=(s*9301+49297)%233280;const b=s/233280;o+=`<g transform="translate(${(cx+(a-.5)*72).toFixed(1)} ${(cy+(b-.5)*34).toFixed(1)})"><ellipse cx="3" cy="9" rx="8" ry="3" fill="#000" opacity=".3"/><rect x="-1" y="2" width="2.4" height="7" fill="#3a2410"/><path d="M0-17C9-8 8 2 0 4C-8 2-9-8 0-17Z" fill="#2f4a28" stroke="#16260f" stroke-width=".8"/><path d="M0-17C5-9 4 0 0 3C-2-4-1-11 0-17Z" fill="#4f7038" opacity=".8"/></g>`}return o}

const terrain=()=>`<rect width="844" height="390" fill="url(#gr)"/>
<g fill="#f0cf8a" opacity=".22"><ellipse cx="250" cy="120" rx="110" ry="30"/><ellipse cx="560" cy="250" rx="120" ry="34"/><ellipse cx="260" cy="270" rx="90" ry="24"/></g>
<g stroke="#7a5230" stroke-width="1" fill="none" opacity=".45"><path d="M150 40l14 30-6 22 18 26"/><path d="M700 330l-22-18 8-20-20-22"/><path d="M520 384l10-24-8-14"/></g>
<path d="${RIVER}" fill="none" stroke="#24484f" stroke-width="36" transform="translate(3 4)" opacity=".5"/><path d="${RIVER}" fill="none" stroke="#2f5d66" stroke-width="34"/><path d="${RIVER}" fill="none" stroke="#6ea3a5" stroke-width="24" opacity=".9"/><path d="${RIVER}" fill="none" stroke="#cfe8de" stroke-width="2" stroke-dasharray="10 14" opacity=".6"/>
<ellipse cx="390" cy="183" rx="26" ry="12" fill="#dcb976" stroke="#8a6234"/><ellipse cx="445" cy="314" rx="26" ry="12" fill="#dcb976" stroke="#8a6234"/>
<ellipse cx="636" cy="112" rx="74" ry="44" fill="#4a2a10" opacity=".4" filter="url(#sh)"/><ellipse cx="630" cy="102" rx="70" ry="40" fill="url(#co)" stroke="#7a5428" stroke-width="1.5"/><ellipse cx="630" cy="100" rx="50" ry="27" fill="none" stroke="#9c7036" opacity=".7"/><ellipse cx="630" cy="98" rx="28" ry="14" fill="none" stroke="#9c7036" opacity=".7"/>
${trees(455,62,9,11)}${trees(250,92,5,5)}
<g><ellipse cx="205" cy="335" rx="48" ry="20" fill="#57775f" stroke="#2f4a3a" opacity=".9"/><ellipse cx="228" cy="330" rx="26" ry="10" fill="#6d9078" opacity=".8"/><path d="M175 332v-10M185 338v-12M200 340v-9M215 330v-11M232 336v-10M248 332v-9" stroke="#2f4a28" stroke-width="1.8"/></g>
${lab(630,150,'COLINA')}${lab(432,205,'VADO')}${lab(480,100,'BOSQUE')}${lab(205,364,'PANTANO')}
<rect width="844" height="390" fill="none"/>`;
const frame=`<rect x="3" y="31" width="838" height="356" fill="none" stroke="#8e241a" stroke-width="5"/><rect x="9" y="37" width="826" height="344" fill="none" stroke="#16100c" stroke-width="1.5"/><rect x="12" y="40" width="820" height="338" fill="none" stroke="#e0b04a" stroke-width=".8" opacity=".7"/>`;
/* ---- tropas ---- */
const R=[['L1','M',345,110,420],['L2','M',345,150,400],['L3','M',345,190,420],['L4','M',345,230,400],['L5','M',345,270,420],['P1','P',300,130,300],['P2','P',300,190,300],['P3','P',300,250,300],['TR','P',255,190,200],['TI','T',375,150,160],['CV','C',310,335,120],['CA','C',310,62,100],['AM','L',455,66,80]];
const E=[['e1','M',500,100,450],['e2','M',500,140,450],['e3','M',500,180,450],['e4','M',500,220,450],['e5','M',500,260,450],['e6','M',500,300,450],['f1','P',545,140,320],['f2','P',545,200,320],['f3','P',545,260,320],['h1','T',620,92,150],['h2','T',655,120,150],['ec','C',560,60,100],['ed','C',520,350,100]];
const NOM={M:'Hastati',P:'Príncipes',L:'Velites',T:'Honderos',C:'Caballería'};
const GL={M:'<path d="M-8-2V3M-4-2V3M0-2V3M4-2V3M8-2V3"/>',P:'<path d="M-8-1H8M-8 3H8"/>',L:'<circle cx="-6" cy="1" r="1.3"/><circle cx="0" cy="1" r="1.3"/><circle cx="6" cy="1" r="1.3"/>',T:'<path d="M-8 3Q0-6 8 3"/>',C:'<path d="M-7 3L0-3L7 3"/>'};
function unit(u,side,x,y,o={}){const r=side==='r',c=r?'#a3281d':'#17110f',e=r?'#e0b04a':'#c49a58';
return `<g data-id="${u[0]}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})" opacity="${o.ghost?.6:1}" style="cursor:pointer"><ellipse cx="3" cy="10" rx="19" ry="5" fill="#000" opacity=".38" filter="url(#sh)"/><path d="M-13-6V-18" stroke="#3a2410" stroke-width="1.5"/><path d="M-13-18h9l-2 3 2 3h-9Z" fill="${c}" stroke="${e}" stroke-width=".7"/><rect x="-15" y="-6.5" width="30" height="13" rx="2.5" fill="${c}" stroke="${e}" stroke-width="1.3" ${o.ghost?'stroke-dasharray="3 2"':''}/><g stroke="${e}" fill="${e}" stroke-width="1.6" stroke-linecap="round">${GL[u[1]]}</g><text y="19" text-anchor="middle" font-family="Cinzel,Georgia,serif" font-size="8.5" fill="#fff3d6" stroke="#1a0d08" stroke-width="2.4" style="paint-order:stroke">${u[4]}</text>${o.sel?'<rect x="-19" y="-10" width="38" height="20" rx="4" fill="none" stroke="#ffe08a" stroke-width="2" stroke-dasharray="5 3" class="march"/>':''}</g>`}
const bd=(x,y,n)=>`<g transform="translate(${x} ${y})"><circle r="8" fill="#f0c860" stroke="#1a0d08" stroke-width="1.2"/><text y="3.5" text-anchor="middle" font-family="Cinzel,Georgia,serif" font-size="10" fill="#1a0d08">${n}</text></g>`;
const arrow=(d,st,mk,w=3,da='')=>`<path d="${d}" fill="none" stroke="#1a0d08" stroke-width="${w+3}" opacity=".5" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${st}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${da}" marker-end="url(#${mk})"/>`;
const AMB='M455 78C480 92 500 102 510 124',ADV='M352 190L470 190';
const GEN=g=>`<g transform="translate(${292+g} 190)"><circle r="101" fill="#f0c860" fill-opacity=".07" stroke="#f0c860" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M0-9L7 0L0 9L-7 0Z" fill="#e0b04a" stroke="#1a0d08"/><text x="76" y="-80" font-family="Cinzel,Georgia,serif" font-size="9" fill="#fff3d6" stroke="#1a0d08" stroke-width="2.4" style="paint-order:stroke">200 m</text></g>`;
const burst=(x,y,l)=>`<g transform="translate(${x} ${y})" onclick="show(3)" style="cursor:pointer"><g class="pulse"><path d="M0-17L4-6L16-9L8 0L16 9L4 6L0 17L-4 6L-16 9L-8 0L-16-9L-4-6Z" fill="#f0c860" stroke="#7d1f17" stroke-width="2"/></g><path d="M-8-8L8 8M8-8L-8 8" stroke="#7d1f17" stroke-width="3"/><text y="32" text-anchor="middle" font-family="Cinzel,Georgia,serif" font-size="9.5" fill="#fff3d6" stroke="#1a0d08" stroke-width="2.6" style="paint-order:stroke">${l}</text></g>`;
let RL=0,sel='CV',T=.7,paused=false,spd=1,cur=1;
function pos(u,t){const id=u[0],e=ease(cl(t/.6));
if(id==='CV'){const q=$('#rt').getPointAtLength(RL*ease(cl(t/.85)));return[q.x,q.y]}
if(id==='AM'){const a=ease(cl((t-.45)/.35));return[lerp(455,512,a),lerp(66,118,a)]}
if(id==='ec'){const a=ease(cl((t-.4)/.4));return[lerp(560,545,a),lerp(60,100,a)]}
if(id==='ed'){const a=ease(cl(t/.7));return[lerp(520,562,a),lerp(350,338,a)]}
if(id[0]==='L')return[u[2]+40*e,u[3]];if(id[0]==='P')return[u[2]+35*e,u[3]];if(id==='TR')return[u[2]+25*e,u[3]];if(id==='TI')return[u[2]+30*e,u[3]];
if(id[0]==='e')return[u[2]-30*e,u[3]];if(id[0]==='f')return[u[2]-20*e,u[3]];return[u[2],u[3]]}
function draw(m,t){let h='';const st=m==1;
if(st)h+=arrow(ROUTE,'#f0c860','ar',3,'9 6')+arrow(ADV,'#fff3d6','ar2',3)+arrow(AMB,'#17110f','ar3',3,'5 4');
else{const L=RL*ease(cl(t/.85));h+=`<path d="${ROUTE}" fill="none" stroke="#1a0d08" stroke-width="6" opacity=".4" stroke-dasharray="${L} ${RL*2}"/><path d="${ROUTE}" fill="none" stroke="#f0c860" stroke-width="3" stroke-dasharray="${L} ${RL*2}" stroke-linecap="round"/>`+arrow(ADV,'#fff3d6','ar2',2).replace('<path','<path opacity=".5"')+(t>.45?arrow(AMB,'#17110f','ar3',3):'')}
h+=GEN(st?0:30*ease(cl(t/.6)));
E.forEach(u=>{const[x,y]=st?[u[2],u[3]]:pos(u,t);h+=unit(u,'e',x,y)});
R.forEach(u=>{const[x,y]=st?[u[2],u[3]]:pos(u,t);h+=unit(u,'r',x,y,{ghost:u[0]==='AM'&&(st||t<.45),sel:st&&u[0]===sel})});
if(st)h+=bd(292,321,1)+bd(333,176,2)+bd(441,52,3)+bd(255,172,4)+`<path d="M247 205l8-4 8 4v8l-8 6-8-6z" fill="#e0b04a" stroke="#1a0d08"/>`;
