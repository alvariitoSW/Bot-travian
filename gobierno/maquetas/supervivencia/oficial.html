<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
svg.esc{position:absolute;inset:0;width:844px;height:390px}
.rueda{position:absolute;right:14px;bottom:12px;width:250px;height:250px}
.sect{position:absolute;padding:6px 10px;border-radius:12px;font-weight:800;font-size:13px;background:var(--vidrio);border:1.5px solid var(--fil)}
.sect.on{border-color:var(--oro);color:var(--oro);background:rgba(60,40,15,.92)}
.op{position:absolute;min-width:76px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;background:linear-gradient(#5e2118,#3b140f);border:1.5px solid var(--oro);font-weight:800;font-size:13px}
.op small{font-size:10px;color:#e4d3ab;font-weight:600}
.op.on{background:linear-gradient(#8a6a22,#5a4212)}
.palanca{position:absolute;left:24px;bottom:22px;width:110px;height:110px;border-radius:50%;border:2px solid var(--fil);background:rgba(18,15,11,.45)}
.palanca i{position:absolute;left:34px;top:22px;width:42px;height:42px;border-radius:50%;background:rgba(233,192,99,.5);border:2px solid var(--oro)}
</style></head><body class="h">
<svg class="esc" viewBox="0 0 844 390">
  <defs>
    <linearGradient id="cielo" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#3a3a6a"/><stop offset=".55" stop-color="#c0704a"/><stop offset="1" stop-color="#f0b070"/></linearGradient>
    <linearGradient id="tierra" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#6a6236"/><stop offset="1" stop-color="#3a3218"/></linearGradient>
    <radialGradient id="fg"><stop offset="0" stop-color="#fff3b0"/><stop offset=".4" stop-color="#ffb43c" stop-opacity=".8"/><stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/></radialGradient>
    <filter id="bl"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect width="844" height="190" fill="url(#cielo)"/>
  <!-- bosque al fondo -->
  <path d="M0 175 Q40 120 80 160 Q110 110 150 158 Q190 116 230 160 Q260 128 300 165 L300 190 L0 190Z" fill="#26301c"/>
  <path d="M520 168 Q560 118 600 160 Q640 112 690 158 Q730 120 770 160 Q810 126 844 150 L844 190 L520 190Z" fill="#26301c"/>
  <rect y="185" width="844" height="205" fill="url(#tierra)"/>
  <!-- empalizada en perspectiva hacia la puerta -->
  <g id="estacas"></g>
  <!-- puerta y torres al fondo -->
  <rect x="384" y="118" width="22" height="72" fill="#4a3018"/><rect x="438" y="118" width="22" height="72" fill="#4a3018"/>
  <rect x="380" y="112" width="30" height="8" fill="#2b1c0a"/><rect x="434" y="112" width="30" height="8" fill="#2b1c0a"/>
  <circle cx="395" cy="108" r="9" fill="url(#fg)"/><circle cx="449" cy="108" r="9" fill="url(#fg)"/>
  <!-- humo del fuego del campamento -->
  <path d="M520 150 q-14 -40 6 -80 q14 -30 -4 -60" stroke="#d8d2c4" stroke-width="14" fill="none" opacity=".25" filter="url(#bl)"/>
  <!-- tu grupo, en línea delante de ti -->
  <g id="grupo"></g>
  <!-- el perro -->
  <g transform="translate(500 352) scale(.9)"><ellipse cx="0" cy="0" rx="30" ry="12" fill="#6b4a2a"/><circle cx="28" cy="-10" r="10" fill="#6b4a2a"/><path d="M32 -18 l6 -10 l2 12Z" fill="#4a3018"/><rect x="-22" y="6" width="6" height="22" fill="#5a3c20"/><rect x="14" y="6" width="6" height="22" fill="#5a3c20"/><path d="M-30 -2 q-14 -10 -10 -22" stroke="#6b4a2a" stroke-width="5" fill="none"/></g>
  <!-- tu oficial, de espaldas -->
  <g transform="translate(330 395)">
    <path d="M-60 0 L-50 -150 Q0 -175 50 -150 L60 0Z" fill="#7a2a1c"/>
    <path d="M-50 -150 Q0 -175 50 -150 L44 -110 Q0 -124 -44 -110Z" fill="#b8862b"/>
    <path d="M-62 -40 Q0 -20 62 -40 L60 0 L-60 0Z" fill="#5a1a12"/>
    <ellipse cx="0" cy="-200" rx="34" ry="40" fill="#a8792a"/>
    <path d="M-34 -205 Q0 -250 34 -205" fill="#8a6222"/>
    <path d="M-6 -240 Q0 -300 60 -262 Q20 -250 6 -238Z" fill="#c23a2e"/>
    <path d="M-8 -240 Q-60 -290 -70 -250 Q-30 -250 -6 -236Z" fill="#a52a20"/>
    <circle cx="-92" cy="-120" r="78" fill="#b8862b" stroke="#6a4a12" stroke-width="7"/>
    <circle cx="-92" cy="-120" r="58" fill="none" stroke="#d8a64a" stroke-width="3"/>
    <path d="M-120 -150 q28 -20 56 0 q-10 30 -28 36 q-18 -6 -28 -36Z" fill="#2b1c0a"/>
    <rect x="62" y="-330" width="6" height="330" fill="#3a2a12" transform="rotate(6)"/>
    <path d="M82 -340 l10 -36 l10 36Z" fill="#c9c2b0" transform="rotate(6)"/>
  </g>
</svg>
<div class="barra" style="left:12px;right:12px">
  <div class="vidrio reloj" style="max-width:420px"><b>Verano · Año 1</b> <span class="chip" style="margin-left:4px">Tarde</span>
    <div class="dia"><i class="m" style="width:37%"></i><i class="t" style="width:25%"></i><i class="n" style="width:38%"></i></div>
    <div class="aguja" style="--x:55%"></div>
    <div style="font-size:11.5px;color:#cdbf9d;margin-top:4px">Los espartanos llegan al anochecer · <b style="color:var(--marmol)">1:40</b></div></div>
  <div style="flex:1"></div>
  <div class="vidrio" style="display:flex;align-items:center;gap:6px;padding:0 14px;color:var(--oro);font-weight:800">⤒ Arriba</div>
</div>
<div class="palanca"><i></i></div>
<div class="rueda">
  <div class="sect" style="left:4px;top:6px">Tú</div>
  <div class="sect on" style="left:92px;top:-2px">Tu grupo</div>
  <div class="sect" style="right:-2px;top:6px">Perro</div>
  <div class="op on" style="left:0;top:58px">Línea<small>12 de frente</small></div>
  <div class="op" style="left:86px;top:50px">Columna<small>de dos</small></div>
  <div class="op" style="right:0;top:58px">Sígueme</div>
  <div class="op" style="left:20px;top:116px">Defender<small>aquí</small></div>
  <div class="op" style="right:20px;top:116px">Trabajar<small>conmigo</small></div>
  <div style="position:absolute;left:94px;top:174px;width:64px;height:64px;border-radius:50%;background:radial-gradient(#6a4a1a,#3b2a10);border:2px solid var(--oro);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--oro)">✕</div>
</div>
<span class="nota" data-n="1" style="left:180px;top:70px">Tu oficial, de espaldas</span>
<span class="nota" data-n="2" style="left:400px;top:296px">Su grupo, en línea</span>
<span class="nota" data-n="3" style="left:640px;top:110px">Rueda: 2 toques</span>
<span class="sello" style="left:150px;right:auto">SUP1 · maqueta · el oficial a pie, en horizontal</span>
<script>
const NS='http://www.w3.org/2000/svg';
const g=document.getElementById('estacas');
// empalizada a izquierda y derecha, que se aleja hacia la puerta
for(const lado of[-1,1]) for(let i=0;i<26;i++){const t=i/25, x=lado<0? 380-(1-t)*380 : 464+(1-t)*380, y=118+ (1-t)*30, h=72+(1-t)*150, w=6+(1-t)*14;
 const r=document.createElementNS(NS,'path');r.setAttribute('d',`M${x-w/2} ${y+h} L${x-w/2} ${y+6} L${x} ${y} L${x+w/2} ${y+6} L${x+w/2} ${y+h}Z`);r.setAttribute('fill',i%2?'#5a3c1c':'#6b4a26');r.setAttribute('stroke','#2b1c0a');g.appendChild(r);}
// el grupo: 11 hoplitas de espaldas en línea, delante
const gr=document.getElementById('grupo');
for(let i=0;i<11;i++){const x=250+ i*40, y=292, s=.27;
 const G=document.createElementNS(NS,'g');G.setAttribute('transform',`translate(${x} ${y}) scale(${s})`);
 G.innerHTML=`<path d="M-50 0 L-42 -150 Q0 -170 42 -150 L50 0Z" fill="#7a2a1c"/><ellipse cx="0" cy="-190" rx="30" ry="36" fill="#a8792a"/><path d="M-4 -222 Q0 -270 46 -244 Q14 -236 4 -220Z" fill="#8a6222"/><circle cx="-70" cy="-110" r="72" fill="#b8862b" stroke="#6a4a12" stroke-width="7"/><rect x="50" y="-320" width="6" height="320" fill="#3a2a12"/>`;
 gr.appendChild(G);}
</script>
</body></html>
