<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1016">
<title>AQVILA · Testudo a pie</title>
<base href="../../../">
<script>
/* FU1/FU6: «Testudo a pie» es la escena del bloque con ?formacion=testudo. Esta página solo lleva allí (Escaramuzas y los jueces
   entran por aquí). Se conservan los otros parámetros. La escena vieja se quitó en FU6; aquí quedan campo.js y sonido.js, que usa el bloque. */
(function () {
  var q = new URLSearchParams(location.search); q.delete('antiguo');
  if (!q.get('formacion')) q.set('formacion', 'testudo');
  location.replace(new URL('gobierno/maquetas/bloque/', document.baseURI).href + '?' + q.toString());
})();
</script>
</head>
<body style="margin:0;background:#15130f"></body>
</html>
