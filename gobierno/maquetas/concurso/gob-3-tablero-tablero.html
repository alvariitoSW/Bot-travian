<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>AQVILA · Tablero vivo</title>
<style>
:root{--noche:#0b1016;--rojo:#c0281f;--oro:#e9c063;--bronce:#b8862b;--marmol:#f1ead9;--piedra:#9aa6b4;--oliva:#8fae5a;--terra:#d9764a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none}
html,body{margin:0;height:100%;background:#05080c;font-family:Georgia,'Times New Roman',serif;color:var(--marmol);overflow:hidden}
#app{position:relative;width:390px;height:844px;margin:0 auto;overflow:hidden;background:#6f8a45}
#city{position:absolute;inset:0;width:390px;height:844px}
/* HUD */
#hud{position:absolute;left:8px;right:8px;top:8px;height:48px;display:flex;gap:6px;align-items:center;padding:0 10px;border-radius:14px;background:rgba(11,16,22,.82);border:1px solid rgba(233,192,99,.45);font-size:14px;z-index:20}
#hud .r{display:flex;align-items:center;gap:4px;font-weight:bold;white-space:nowrap}
#hud .r svg{width:18px;height:18px}
#pueblo{flex:1;min-width:0;flex-direction:column;align-items:stretch;gap:0}
#pueblo small{display:block;font-size:13px;color:var(--piedra);line-height:1}
#barra{width:100%;min-height:7px;height:7px;border-radius:4px;background:#26303b;margin-top:3px;overflow:hidden}
#barra i{display:block;height:100%;width:62%;background:linear-gradient(90deg,var(--terra),var(--oliva));transition:width .5s}
#dia{border:0;border-radius:11px;background:linear-gradient(#e9c063,#b8862b);color:#1a1205;font:bold 14px Georgia,serif;height:36px;padding:0 10px;touch-action:manipulation}
#aviso{position:absolute;left:14px;right:14px;top:64px;padding:7px 12px;border-radius:12px;background:rgba(192,40,31,.92);font-size:14px;text-align:center;z-index:20;display:none}
#fecha{position:absolute;left:14px;top:64px;font-size:13px;color:#2a2108;background:rgba(241,234,217,.8);padding:2px 9px;border-radius:9px;z-index:19}
/* avisos */
.av{position:absolute;width:64px;margin-left:-32px;margin-top:-64px;text-align:center;z-index:12;font-size:13px;line-height:1.1;transition:transform .3s,opacity .5s}
.av .b{position:relative;width:54px;height:54px;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3,#0000 60%),var(--c);border:2px solid #fff8;box-shadow:0 3px 10px #0008;animation:lat 1.6s ease-in-out infinite;display:grid;place-items:center}
.av .b:after{content:'';position:absolute;left:50%;bottom:-9px;margin-left:-7px;border:7px solid transparent;border-top:9px solid var(--c);border-bottom:0}
.av svg.ic{width:30px;height:30px}
.av .t{display:inline-block;margin-top:11px;background:rgba(11,16,22,.85);padding:2px 7px;border-radius:8px;white-space:nowrap;position:relative;left:50%;transform:translateX(-50%)}
.av .anillo{position:absolute;inset:-6px;width:66px;height:66px;transform:rotate(-90deg)}
.av .anillo circle{fill:none;stroke-width:4}
.av.listo .b{box-shadow:0 0 0 5px #e9c06399,0 0 22px #e9c063;animation:none}
.av.ok{transform:scale(1.4);opacity:0;pointer-events:none}
.av.mal{animation:sac .4s}
@keyframes lat{50%{transform:scale(1.09)}}
@keyframes sac{20%{transform:translateX(-8px)}60%{transform:translateX(8px)}}
/* bandeja */
#bandeja{position:absolute;left:0;right:0;bottom:0;height:108px;padding:10px 6px 8px;background:linear-gradient(#0b101600,#0b1016e6 38%);display:flex;justify-content:space-around;align-items:flex-end;z-index:30}
.chip{position:relative;width:56px;text-align:center;font-size:13px}
.chip .c{width:56px;height:56px;border-radius:50%;margin-bottom:3px;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff4,#0000 55%),var(--c);border:2px solid var(--oro);box-shadow:0 4px 10px #000a}
.chip svg{width:32px;height:32px}
.chip .n{position:absolute;right:-2px;top:-4px;background:var(--noche);border:1px solid var(--oro);border-radius:10px;min-width:22px;padding:0 4px;font-size:13px;line-height:18px}
#fantasma{position:fixed;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:3px solid var(--oro);display:none;place-items:center;z-index:99;pointer-events:none;box-shadow:0 8px 20px #000b;transform:scale(1.15)}
#fantasma svg{width:36px;height:36px}
/* sellos */
.sello{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;z-index:11;background:radial-gradient(circle at 35% 30%,#e85a4a,var(--rojo) 55%,#7a130d);border:2px solid #7a130d;display:grid;place-items:center;box-shadow:0 3px 8px #0009}
.sello svg{width:24px;height:24px}
.sello.urg{animation:lat 1.2s infinite}
/* hoja */
#hoja{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#1a2330,#0b1016);border-top:2px solid var(--oro);border-radius:22px 22px 0 0;padding:16px 16px 22px;z-index:40;transform:translateY(105%);transition:transform .35s}
#hoja.v{transform:none}
#hoja h2{margin:0 0 2px;font-size:19px;color:var(--oro)}
#hoja .q{font-size:14px;color:var(--piedra);margin-bottom:8px}
#hoja p{margin:0 0 12px;font-size:15px;line-height:1.35}
.op{display:flex;align-items:center;gap:10px;width:100%;margin-bottom:8px;padding:10px 12px;border-radius:13px;border:1px solid #fff3;background:#ffffff10;color:var(--marmol);font:15px Georgia,serif;text-align:left;touch-action:manipulation}
.op b{display:block;font-size:15px}.op span{font-size:13px;color:var(--piedra)}
.op svg{flex:none;width:30px;height:30px}
#toast{position:absolute;left:16px;right:16px;bottom:124px;padding:10px 14px;border-radius:13px;background:rgba(241,234,217,.96);color:#1a1205;font-size:14px;z-index:60;opacity:0;transition:opacity .3s;text-align:center;pointer-events:none}
#toast.v{opacity:1}
.humo{animation:humo 3s infinite ease-out;transform-box:fill-box;transform-origin:center}
@keyframes humo{0%{opacity:.8;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-34px) scale(1.5)}}
.llama{animation:fl .5s infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{to{transform:scaleY(1.2) scaleX(.9)}}
.hilo{stroke-dasharray:7 5;animation:fluir 1.2s linear infinite}
@keyframes fluir{to{stroke-dashoffset:-24}}
.onda{animation:onda 3s ease-in-out infinite alternate}
@keyframes onda{to{transform:translateX(-14px)}}
</style>
</head>
<body>
<div id="app">
<svg id="city" viewBox="0 0 390 844"></svg>
<div id="hud">
 <div class="r"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="#e9c063" stroke="#b8862b" stroke-width="2"/><text x="10" y="14" font-size="10" text-anchor="middle" fill="#5a3f08" font-weight="bold">X</text></svg><span id="vDen">450</span></div>
 <div class="r"><svg viewBox="0 0 20 20"><path d="M10 2v16M10 6c-3 0-4-2-4-3 3 0 4 1 4 3zm0 0c3 0 4-2 4-3-3 0-4 1-4 3zm0 4c-3 0-4-2-4-3 3 0 4 1 4 3zm0 0c3 0 4-2 4-3-3 0-4 1-4 3z" stroke="#e9c063" fill="#e9c063" stroke-width="1.3"/></svg><span id="vGra">438</span></div>
 <div class="r" id="pueblo"><small>Pueblo <b id="vPue">62</b>%</small><div id="barra"><i></i></div></div>
 <button id="dia">Pasar el día</button>
</div>
<div id="fecha">Roma · Ianuarius, 280 a.C.</div>
<div id="aviso"></div>
<div id="bandeja"></div>
<div id="hoja"></div>
<div id="toast"></div>
<div id="fantasma"></div>
</div>
<script>
const $=s=>document.querySelector(s), SV='http://www.w3.org/2000/svg';
/* ---------- iconos dibujados a mano ---------- */
const IC={
 agua:'<path d="M16 3C11 11 7 15 7 20a9 9 0 0018 0c0-5-4-9-9-17z" fill="#fff" stroke="#173c6b" stroke-width="2"/><path d="M12 21a4 4 0 004 4" stroke="#4a90d9" stroke-width="2" fill="none"/>',
 grano:'<path d="M16 29V6" stroke="#4a3208" stroke-width="2.4"/><g fill="#f3d36b" stroke="#4a3208" stroke-width="1.4"><ellipse cx="11" cy="10" rx="3" ry="5" transform="rotate(-30 11 10)"/><ellipse cx="21" cy="10" rx="3" ry="5" transform="rotate(30 21 10)"/><ellipse cx="11" cy="18" rx="3" ry="5" transform="rotate(-30 11 18)"/><ellipse cx="21" cy="18" rx="3" ry="5" transform="rotate(30 21 18)"/><ellipse cx="16" cy="6" rx="2.6" ry="4.5"/></g>',
 soldado:'<path d="M5 20c0-8 5-14 11-14s11 6 11 14z" fill="#d6dde6" stroke="#2b3441" stroke-width="2"/><rect x="4" y="19" width="24" height="5" rx="2" fill="#9aa6b4" stroke="#2b3441" stroke-width="2"/><path d="M16 4c-3 0-3 4 0 4s3-4 0-4z" fill="#c0281f"/><path d="M8 24v4h16v-4" fill="#c0281f" stroke="#2b3441" stroke-width="2"/>',
 oro:'<circle cx="16" cy="16" r="12" fill="#e9c063" stroke="#6b4a0a" stroke-width="2.4"/><circle cx="16" cy="16" r="8" fill="none" stroke="#b8862b" stroke-width="1.5"/><text x="16" y="21" font-size="13" text-anchor="middle" fill="#6b4a0a" font-weight="bold" font-family="Georgia">X</text>',
 obrero:'<path d="M6 26L22 10" stroke="#5a3b17" stroke-width="3.4" stroke-linecap="round"/><path d="M17 5l10 4-4 5-3-1-5 4-3-3 4-5z" fill="#cfd6df" stroke="#2b3441" stroke-width="2"/>',
 sacerdote:'<path d="M16 4c4 4 7 8 7 13a7 7 0 01-14 0c0-3 1-5 3-7 0 3 2 4 3 3 0-3-1-6 1-9z" fill="#f08a2c" stroke="#7a2c0b" stroke-width="2"/><path d="M16 14c2 2 3 4 3 6a3 3 0 01-6 0c0-2 2-3 3-6z" fill="#ffd869"/><rect x="9" y="26" width="14" height="3" fill="#f1ead9" stroke="#7a2c0b" stroke-width="1.4"/>',
 fuego:'<path d="M16 2c5 6 10 10 10 17a10 10 0 01-20 0c0-4 2-7 5-10 0 4 2 6 4 5-1-4-1-8 1-12z" fill="#f06a1d" stroke="#6b1708" stroke-width="2"/><path d="M16 14c3 3 5 6 5 9a5 5 0 01-10 0c0-3 3-5 5-9z" fill="#ffd869"/>',
 rata:'<ellipse cx="14" cy="19" rx="10" ry="6" fill="#8a7c6c" stroke="#2b2118" stroke-width="2"/><circle cx="24" cy="17" r="4.2" fill="#8a7c6c" stroke="#2b2118" stroke-width="2"/><circle cx="21" cy="12.5" r="3" fill="#d8a0a0" stroke="#2b2118" stroke-width="1.6"/><circle cx="25.5" cy="16.2" r="1" fill="#c0281f"/><path d="M4 19C0 20 0 25 5 26" fill="none" stroke="#2b2118" stroke-width="2"/>',
 multitud:'<g fill="#f1ead9" stroke="#2b2118" stroke-width="1.6"><circle cx="9" cy="10" r="3.6"/><circle cx="16" cy="8" r="3.6"/><circle cx="23" cy="10" r="3.6"/><path d="M3 24c0-6 3-9 6-9s6 3 6 9zM10 22c0-6 3-9 6-9s6 3 6 9zM17 24c0-6 3-9 6-9s6 3 6 9z"/></g>',
 revuelta:'<path d="M8 28V5" stroke="#3a2a14" stroke-width="3"/><path d="M8 5h17l-4 5 4 5H8z" fill="#c0281f" stroke="#3a0805" stroke-width="2"/><circle cx="22" cy="23" r="3.6" fill="#f1ead9" stroke="#2b2118" stroke-width="1.6"/><path d="M16 30c0-6 3-8 6-8s6 2 6 8z" fill="#f1ead9" stroke="#2b2118" stroke-width="1.6"/>',
 inunda:'<path d="M2 12c4-4 6 4 10 0s6 4 10 0 6 4 8 0M2 20c4-4 6 4 10 0s6 4 10 0 6 4 8 0M2 28c4-4 6 4 10 0s6 4 10 0 6 4 8 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>',
 hambre:'<path d="M5 14h22l-2 12a3 3 0 01-3 2H10a3 3 0 01-3-2z" fill="#d9764a" stroke="#4a1f0b" stroke-width="2"/><path d="M9 14l3-5M16 14V7M23 14l-3-5" stroke="#4a1f0b" stroke-width="2" fill="none"/><path d="M12 20l8 5M20 20l-8 5" stroke="#4a1f0b" stroke-width="2"/>',
 carta:'<rect x="4" y="8" width="24" height="17" rx="2" fill="#f1ead9" stroke="#3a2a14" stroke-width="2"/><path d="M4 9l12 9 12-9" fill="none" stroke="#3a2a14" stroke-width="2"/>',
 lupa:'<circle cx="14" cy="14" r="8" fill="#cfe3f5" stroke="#f1ead9" stroke-width="2.6"/><path d="M20 20l8 8" stroke="#f1ead9" stroke-width="4" stroke-linecap="round"/>',
 sello:'<circle cx="16" cy="16" r="10" fill="none" stroke="#f6c9c3" stroke-width="2.4"/><path d="M16 8l2.4 5 5.4.6-4 3.8 1.2 5.4-5-2.8-5 2.8 1.2-5.4-4-3.8 5.4-.6z" fill="#f6c9c3"/>',
 balanza:'<path d="M16 5v20M8 26h16M5 11h22" stroke="#e9c063" stroke-width="2.4" fill="none"/><path d="M5 11l-3 8h8zM27 11l-3 8h8z" fill="#e9c063"/>'
};
const ic=(k,c='ic')=>`<svg class="${c}" viewBox="0 0 32 32">${IC[k]}</svg>`;
/* ---------- ciudad dibujada a mano (vista 3/4) ---------- */
const P={mar:['#f1ead9','#cfc6ae','#fbf7ea'],piedra:['#b9c0c8','#8f98a3','#d6dbe0'],casa:['#ead9b4','#c9b68c','#d9764a'],casa2:['#e4c9a0','#bfa27a','#c0553a'],ladr:['#c98a63','#a06a48','#d9764a'],horreo:['#c9a66a','#a08150','#8a5a30']};
function caja(cx,by,w,h,d,p,extra=''){const x=cx-w/2,y=by-h,dy=d*.6;
 return `<polygon points="${x+w},${by} ${x+w+d},${by-dy} ${x+w+d},${y-dy} ${x+w},${y}" fill="${p[1]}"/>`+
 `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${p[0]}"/>`+
 `<polygon points="${x},${y} ${x+w},${y} ${x+w+d},${y-dy} ${x+d},${y-dy}" fill="${p[2]}" stroke="#0002"/>`+extra;}
const ventanas=(cx,by,w,h,n)=>{let s='';for(let i=0;i<n;i++){s+=`<rect x="${cx-w/2+8+i*((w-16-8)/Math.max(1,n-1||1))}" y="${by-h+10}" width="8" height="10" fill="#3a2a1c" rx="3"/>`}return s};
const columnas=(cx,by,w,h,n)=>{let s='';for(let i=0;i<n;i++){const x=cx-w/2+6+i*((w-12)/(n-1));s+=`<rect x="${x-2.5}" y="${by-h+6}" width="5" height="${h-8}" fill="#fff" stroke="#b6ac92" stroke-width=".8"/>`}return s};
const frontón=(cx,by,w,h,d)=>`<polygon points="${cx-w/2-4},${by-h} ${cx+w/2+4},${by-h} ${cx},${by-h-18}" fill="#e6dcc2" stroke="#b6ac92"/>`;
const sombra=(cx,by,w,d)=>`<polygon points="${cx-w/2},${by} ${cx+w/2+d+16},${by} ${cx+w/2+d+34},${by+9} ${cx-w/2+18},${by+9}" fill="#1a1205" opacity=".18"/>`;
function casa(cx,by,w,h,p,ven=2){const d=14,x=cx-w/2;
 return sombra(cx,by,w,d)+caja(cx,by,w,h,d,[p[0],p[1],p[2]],ventanas(cx,by,w,h,ven)+`<rect x="${cx-5}" y="${by-18}" width="10" height="18" fill="#4a3322" rx="4"/>`)+
 `<g stroke="#0003" stroke-width="1" fill="none"><path d="M${x+d},${by-h-8}h${w}M${x+d+6},${by-h-4}h${w-4}"/></g>`;}
function fabricar(){
 let s=`<defs><linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9d3e8"/><stop offset="1" stop-color="#e6ddb8"/></linearGradient>
 <pattern id="hierba" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#7a9448"/><path d="M2 12l2-5M8 7l1-4M11 13l2-4" stroke="#6a8439" stroke-width="1.4"/></pattern>
 <pattern id="adoq" width="12" height="9" patternUnits="userSpaceOnUse"><rect width="12" height="9" fill="#d8c9a3"/><path d="M0 4.5h12M6 0v4.5M3 4.5V9M9 4.5V9" stroke="#bfae84" stroke-width=".8"/></pattern></defs>`;
 s+=`<rect width="390" height="844" fill="url(#hierba)"/><rect width="390" height="100" fill="url(#cielo)"/>`;
 /* colinas fondo */
 s+=`<path d="M0 96C50 60 110 70 170 92S300 62 390 90V110H0z" fill="#8aa355"/><path d="M0 108C80 84 160 96 240 104S340 88 390 100V120H0z" fill="#9fb766"/>`;
 /* murallas */
 s+=`<rect x="0" y="108" width="390" height="22" fill="#bfa27a"/><rect x="0" y="108" width="390" height="5" fill="#d9c29a"/>`;
 for(let i=0;i<13;i++)s+=`<rect x="${i*32}" y="100" width="18" height="10" fill="#c9b08a"/>`;
 [[34],[356]].forEach(([x])=>s+=caja(x,134,36,52,10,P.piedra));
 /* calles */
 s+=`<rect x="0" y="236" width="390" height="40" fill="url(#adoq)"/><rect x="0" y="372" width="390" height="30" fill="url(#adoq)"/><rect x="0" y="492" width="390" height="30" fill="url(#adoq)"/><rect x="164" y="130" width="62" height="530" fill="url(#adoq)"/>`;
 s+=`<rect x="164" y="130" width="62" height="530" fill="none" stroke="#bfae84" stroke-width="2"/>`;
 /* foro: plaza con estatua */
 s+=`<rect x="132" y="236" width="126" height="40" fill="#e4d8b7" stroke="#bfae84" stroke-width="2"/>`+sombra(195,262,14,6)+caja(195,262,14,20,5,P.mar)+`<rect x="190" y="222" width="10" height="10" fill="#e9c063"/><text x="195" y="288" font-size="13" text-anchor="middle" fill="#3a2a14" font-family="Georgia" font-weight="bold">FORO</text>`;
 /* hileras traseras */
 s+=sombra(95,214,86,22)+caja(95,214,86,64,22,P.mar,columnas(95,214,86,64,5))+frontón(95,214,86,64)+`<text x="95" y="232" font-size="13" text-anchor="middle" fill="#3a2a14" font-family="Georgia" font-weight="bold">CURIA</text>`;
 s+=sombra(305,214,74,20)+caja(305,214,74,54,20,P.mar,columnas(305,214,74,54,4))+`<polygon points="${305-41},160 ${305+41},160 305,138" fill="#d9764a" stroke="#8a3d1e" stroke-width="1.5"/><text x="305" y="232" font-size="13" text-anchor="middle" fill="#3a2a14" font-family="Georgia" font-weight="bold">TEMPLO</text>`;
 s+=casa(195,214,60,46,P.casa2,3);
 /* fila 2 */
 s+=casa(56,340,70,52,P.casa,3)+casa(330,340,64,50,P.ladr,2);
 s+=`<text x="56" y="356" font-size="13" text-anchor="middle" fill="#3a2a14" font-family="Georgia">ESCIPIÓN</text>`.replace('356','360');
 s+=`<text x="330" y="360" font-size="13" text-anchor="middle" fill="#3a2a14" font-family="Georgia">CUARTEL</text>`;
 /* fila 3: insulas y horreo */
 s+=casa(40,462,54,56,P.casa2,2)+casa(104,462,54,70,P.casa,3)+`<text x="76" y="480" font-size="13" text-anchor="middle" fill="#3a2a14" font-family="Georgia">ÍNSULAS</text>`;
 s+=sombra(300,464,84,16)+caja(300,464,84,52,16,P.horreo,`<rect x="${300-12}" y="${464-30}" width="24" height="30" fill="#5b3a1d" rx="3"/>`)+`<polygon points="${300-46},412 ${300+58},412 ${300+44},392 ${300-30},392" fill="#8a5a30" stroke="#5b3a1d"/><text x="300" y="482" font-size="13" text-anchor="middle" fill="#3a2a14" font-family="Georgia" font-weight="bold">HORREO</text>`;
 /* fila 4 */
 s+=sombra(92,586,100,24)+caja(92,586,100,50,24,P.mar,`<rect x="22" y="${586-34}" width="36" height="20" fill="#7bb6d6" rx="8"/><rect x="${92-4}" y="${586-30}" width="40" height="22" fill="#7bb6d6" rx="9"/>`)+`<text x="92" y="604" font-size="13" text-anchor="middle" fill="#3a2a14" font-family="Georgia" font-weight="bold">TERMAS</text>`;
 s+=casa(250,586,64,54,P.ladr,3)+casa(332,586,56,44,P.casa2,2);
 /* mercado: toldos */
 [[250,636],[300,636]].forEach(([x,y],i)=>{})
 s+=`<g transform="translate(240,640)"><polygon points="0,0 40,0 46,-14 6,-14" fill="${'#c0281f'}"/><rect x="2" y="0" width="3" height="14" fill="#5b3a1d"/><rect x="36" y="0" width="3" height="14" fill="#5b3a1d"/></g><g transform="translate(300,640)"><polygon points="0,0 40,0 46,-14 6,-14" fill="#e9c063"/><rect x="2" y="0" width="3" height="14" fill="#5b3a1d"/><rect x="36" y="0" width="3" height="14" fill="#5b3a1d"/></g>`;
 /* río y puente abajo */
 s+=`<path id="rio" d="M0 664C60 650 110 690 190 676S330 650 390 668V760H0z" fill="#4f9dc4"/><g class="onda" stroke="#cfe8f3" stroke-width="2" fill="none" opacity=".75"><path d="M14 690q10-6 20 0t20 0M110 706q10-6 20 0t20 0M250 692q10-6 20 0t20 0M300 716q10-6 20 0t20 0M40 726q10-6 20 0t20 0"/></g>`;
 s+=`<rect x="160" y="648" width="70" height="46" fill="#bfa27a" stroke="#8f7650" stroke-width="2"/><path d="M160 660h70M160 672h70M160 684h70" stroke="#8f7650" stroke-width="1.5"/>`;
 s+=`<g id="inund" opacity="0" style="transition:opacity 1.5s"><path d="M0 600C80 590 160 612 240 596S340 590 390 604V700H0z" fill="#3f8ec0" opacity=".72"/><g stroke="#cfe8f3" stroke-width="2" fill="none"><path d="M20 630q10-6 20 0t20 0M150 640q10-6 20 0t20 0M270 622q10-6 20 0t20 0"/></g></g>`;
 /* arboles */
 [[14,640],[372,624],[16,300],[372,500],[200,520]].forEach(([x,y])=>s+=`<rect x="${x-2}" y="${y}" width="4" height="12" fill="#5b3a1d"/><circle cx="${x}" cy="${y-4}" r="12" fill="#4f7a2f"/><circle cx="${x-4}" cy="${y-8}" r="7" fill="#6a9440"/>`);
 /* ciudadanos */
 s+=`<g id="gente" fill="#f1ead9" stroke="#3a2a14" stroke-width="1">`;
 [[180,300],[210,330],[200,420],[176,560],[212,610]].forEach(([x,y],i)=>s+=`<g><circle cx="${x}" cy="${y-7}" r="3"/><rect x="${x-3}" y="${y-4}" width="6" height="8" rx="2" fill="${['#c0281f','#e9c063','#8fae5a','#f1ead9','#d9764a'][i]}"><animate attributeName="x" values="${x-3};${x+5};${x-3}" dur="${5+i}s" repeatCount="indefinite"/></rect></g>`);
 s+=`</g>`;
 /* chimeneas */
 [[110,392],[330,326],[44,436]].forEach(([x,y],i)=>s+=`<circle class="humo" cx="${x}" cy="${y}" r="5" fill="#fff" style="animation-delay:${i*.9}s"/>`);
 s+=`<g id="capaCrisis"></g><g id="hilos"></g>`;
 return s;}
$('#city').innerHTML=fabricar();
/* ---------- hilos rojos (intrigas) ---------- */
const HILOS=[
 {id:'a',de:[95,160],a:[56,300],c:[30,230],sello:[34,262],urg:true},
 {id:'b',de:[195,182],a:[330,300],c:[300,270],sello:[285,262]},
 {id:'c',de:[305,150],a:[195,176],c:[250,128],sello:[250,128]}];
function pintarHilos(){let s='';HILOS.forEach(h=>{if(h.cortado)return;s+=`<path class="hilo" d="M${h.de} Q${h.c} ${h.a}" fill="none" stroke="#e23a2c" stroke-width="3.2" stroke-linecap="round" opacity=".95"/><circle cx="${h.de[0]}" cy="${h.de[1]}" r="4" fill="#e23a2c"/><circle cx="${h.a[0]}" cy="${h.a[1]}" r="4" fill="#e23a2c"/>`});
 $('#hilos').innerHTML=s;document.querySelectorAll('.sello').forEach(e=>e.remove());
 HILOS.forEach(h=>{if(h.cortado)return;const d=document.createElement('div');d.className='sello'+(h.urg?' urg':'');d.style.left=h.sello[0]+'px';d.style.top=h.sello[1]+'px';d.innerHTML=ic('sello');d.onclick=()=>abrirHilo(h);$('#app').appendChild(d)});}
/* ---------- estado ---------- */
const E={den:450,gra:438,pue:62,dia:1,crisis:false,cuenta:{agua:6,grano:120,soldado:3,oro:450,obrero:40,sacerdote:2}};
const CH=[['agua','Agua','#2f7fc1'],['grano','Grano','#b8862b'],['obrero','Obreros','#6b7480'],['soldado','Cohorte','#a82a22'],['oro','Denarios','#8a6a1c'],['sacerdote','Augur','#d9764a']];
function pintarBandeja(){$('#bandeja').innerHTML=CH.map(([k,t,c])=>`<div class="chip" data-k="${k}"><div class="c" style="--c:${c}">${ic(k)}</div>${t}<span class="n">${E.cuenta[k]}</span></div>`).join('');}
function hud(){$('#vDen').textContent=E.den;$('#vGra').textContent=E.gra;$('#vPue').textContent=Math.round(E.pue);$('#barra i').style.width=Math.max(4,E.pue)+'%';}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('v');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('v'),2600);}
/* ---------- avisos sobre los edificios ---------- */
const AV=[];
const TIPOS={
 rata:{ic:'rata',c:'#7a6a4f',t:'Ratas',need:['obrero'],ok:'Los obreros limpian el horreo. El grano se salva.',d:{gra:+20,pue:+2}},
 hambre:{ic:'hambre',c:'#d9764a',t:'Hambre',need:['grano'],ok:'Reparto de grano. El barrio se calma.',d:{gra:-30,pue:+6},cuesta:40},
 incendio:{ic:'fuego',c:'#d8431a',t:'Incendio',need:['agua'],ok:'Cadena de cubos. El fuego se apaga.',d:{pue:+4}},
 revuelta:{ic:'revuelta',c:'#a82a22',t:'Revuelta',need:['oro','soldado','grano'],ok:'La plebe vuelve a casa.',d:{pue:+3}},
 inunda:{ic:'inunda',c:'#2f7fc1',t:'Crecida',need:['obrero'],ok:'Diques de sacos. El Tíber vuelve a su cauce.',d:{pue:+2}}};
function aviso(tipo,x,y,seg){const T=TIPOS[tipo],el=document.createElement('div');el.className='av';el.style.left=x+'px';el.style.top=y+'px';el.style.setProperty('--c',T.c);
 const anillo=seg?`<svg class="anillo" viewBox="0 0 66 66"><circle cx="33" cy="33" r="30" stroke="#0007"/><circle class="cd" cx="33" cy="33" r="30" stroke="#ffd869" stroke-dasharray="188.5" stroke-dashoffset="0" style="transition:stroke-dashoffset ${seg}s linear"/></svg>`:'';
 el.innerHTML=`<div class="b">${anillo}${ic(T.ic)}</div><span class="t">${T.t}</span>`;$('#app').appendChild(el);
 const a={tipo,el,x,y,T,vivo:true};AV.push(a);
 if(seg){requestAnimationFrame(()=>requestAnimationFrame(()=>{const c=el.querySelector('.cd');if(c)c.style.strokeDashoffset=188.5}));a.timer=setTimeout(()=>fallar(a),seg*1000)}
 return a;}
function fallar(a){if(!a.vivo)return;a.vivo=false;E.pue=Math.max(0,E.pue-12);hud();a.el.classList.add('ok');setTimeout(()=>a.el.remove(),500);toast('Tarde: '+a.T.t.toLowerCase()+' causó daños. El pueblo sufre.');if(a.tipo==='incendio'){document.querySelector('#capaCrisis').innerHTML+=''}revisarFin();}
function resolver(a,k){a.vivo=false;clearTimeout(a.timer);const T=a.T;E.cuenta[k]=Math.max(0,E.cuenta[k]-(k==='grano'?30:1));
 if(T.d.gra)E.gra+=T.d.gra;if(T.d.pue)E.pue=Math.min(100,E.pue+T.d.pue);if(k==='oro')E.den-=60;
 if(k==='soldado')E.pue=Math.max(0,E.pue-2);
 a.el.classList.add('ok');setTimeout(()=>a.el.remove(),500);pintarBandeja();hud();toast(T.ok);pintarCrisis();revisarFin();}
function revisarFin(){if(!E.crisis)return;if(AV.every(a=>!a.vivo)){E.crisis=false;setTimeout(()=>{$('#aviso').style.display='none';$('#fecha').style.display='';$('#inund').setAttribute('opacity',0);toast('Ciudad a salvo. El Senado te lo agradece.');pintarCrisis()},700)}}
/* ---------- arrastrar desde la bandeja ---------- */
let arr=null;
function centro(a){const r=a.el.querySelector('.b').getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]}
document.addEventListener('pointerdown',e=>{const c=e.target.closest('.chip');if(!c)return;const k=c.dataset.k;if(E.cuenta[k]<=0){toast('No te queda nada de eso.');return}
 const f=$('#fantasma');f.style.display='grid';f.style.background=getComputedStyle(c.querySelector('.c')).getPropertyValue('--c');f.style.setProperty('--c',c.querySelector('.c').style.getPropertyValue('--c'));f.style.background=c.querySelector('.c').style.getPropertyValue('--c');f.innerHTML=ic(k);arr={k};mover(e);});
function mover(e){if(!arr)return;const f=$('#fantasma');const x=e.clientX,y=e.clientY-70;f.style.left=x+'px';f.style.top=y+'px';
 AV.forEach(a=>{if(!a.vivo)return;const[cx,cy]=centro(a);const d=Math.hypot(cx-x,cy-y);a.el.classList.toggle('listo',d<62&&a.T.need.includes(arr.k))});}
document.addEventListener('pointermove',mover);
document.addEventListener('pointerup',e=>{if(!arr)return;const x=e.clientX,y=e.clientY-70,k=arr.k;$('#fantasma').style.display='none';
 let t=null,m=1e9;AV.forEach(a=>{if(!a.vivo)return;a.el.classList.remove('listo');const[cx,cy]=centro(a),d=Math.hypot(cx-x,cy-y);if(d<m){m=d;t=a}});
 if(t&&m<62){if(t.T.need.includes(k))resolver(t,k);else{t.el.classList.add('mal');setTimeout(()=>t.el.classList.remove('mal'),420);toast('Eso no sirve contra '+t.T.t.toLowerCase()+'. Prueba: '+t.T.need.map(n=>CH.find(c=>c[0]===n)[1]).join(' o ')+'.')}}
 arr=null;});
/* ---------- escenas ---------- */
function limpiar(){AV.splice(0).forEach(a=>{clearTimeout(a.timer);a.el.remove()});}
function escenaPrincipal(){limpiar();E.crisis=false;$('#aviso').style.display='none';$('#fecha').style.display='';$('#inund').setAttribute('opacity',0);
 aviso('rata',300,440);aviso('hambre',70,458);pintarHilos();pintarBandeja();hud();pintarCrisis();}
function pintarCrisis(){let s='';const inc=AV.find(a=>a.tipo==='incendio'&&a.vivo),rev=AV.find(a=>a.tipo==='revuelta'&&a.vivo);
 if(inc)s+=`<g transform="translate(300,396)"><path class="llama" d="M-26 20C-30 4 -16 -4 -14 -22 -8 -12 -4 -6 -4 4 2 -4 4 -14 2 -26 18 -14 28 4 22 20z" fill="#f06a1d"/><path class="llama" d="M-12 20C-14 8 -6 4 -4 -8 4 2 8 8 4 20z" fill="#ffd869"/></g><g fill="#2b2b2b"><circle class="humo" cx="300" cy="380" r="9"/><circle class="humo" cx="312" cy="376" r="11" style="animation-delay:1s"/><circle class="humo" cx="290" cy="374" r="8" style="animation-delay:2s"/></g>`;
 if(rev)s+=`<g stroke="#2b2118" stroke-width="1">`+[[160,250],[176,268],[196,258],[214,270],[232,252],[246,266],[188,244],[222,242]].map(([x,y],i)=>`<circle cx="${x}" cy="${y-8}" r="4" fill="#f1ead9"/><rect x="${x-4}" y="${y-4}" width="8" height="11" rx="3" fill="#a82a22"/><path d="M${x+5} ${y-2}v-14" stroke="#5b3a1d" stroke-width="2"/><circle cx="${x+5}" cy="${y-18}" r="3.4" fill="#ff9a2c"/>`).join('')+`</g>`;
 $('#capaCrisis').innerHTML=s;}
function escenaCrisis(){limpiar();E.crisis=true;$('#aviso').style.display='block';$('#fecha').style.display='none';$('#aviso').textContent='Tres crisis a la vez. Arrastra la ayuda sobre cada aviso.';
 $('#inund').setAttribute('opacity',1);aviso('incendio',300,392,50);aviso('revuelta',195,236,70);aviso('inunda',195,640,60);pintarHilos();pintarBandeja();hud();pintarCrisis();}
$('#dia').onclick=()=>{E.dia++;$('#fecha').textContent='Roma · Ianuarius, 280 a.C.';if(!E.crisis)escenaCrisis();};
/* ---------- intriga ---------- */
function abrirHilo(h){const H=$('#hoja');
 if(!h.urg){toast(h.id==='b'?'Rumor: Fabio Máximo envía vino al cuartel. Nada probado.':'Rumor: el augur y Fabio cenan juntos. Vigila.');return}
 H.innerHTML=`<h2>Hilo rojo: conjura contra Escipión</h2><div class="q">Una carta sellada llegó al amanecer.</div><p>Apio Claudio paga al augur de la Curia para declarar «malos auspicios» el día que Escipión pida tropas contra Cartago. Tu cliente Marco lo oyó en las termas.</p>
 <button class="op" data-o="1">${ic('balanza')}<div><b>Denunciar en el Senado</b><span>Pueblo +8 · Senado enfadado · el hilo se corta</span></div></button>
 <button class="op" data-o="2">${ic('oro')}<div><b>Comprar al augur: 80 denarios</b><span>Tesoro −80 · Escipión te debe un favor</span></div></button>
 <button class="op" data-o="3">${ic('lupa')}<div><b>Vigilar en secreto</b><span>Sin coste · el hilo sigue vivo tres días</span></div></button>`;
 H.classList.add('v');H.querySelectorAll('.op').forEach(b=>b.onclick=()=>{const o=b.dataset.o;H.classList.remove('v');
  if(o==='1'){E.pue=Math.min(100,E.pue+8);h.cortado=true;toast('Denuncia presentada. Apio calla, el pueblo aplaude.')}
  if(o==='2'){E.den-=80;h.cortado=true;toast('El augur cambia su informe. Escipión te debe un favor.')}
  if(o==='3'){toast('Tus clientes vigilan la Curia. Sabrás más mañana.')}
  hud();pintarHilos();});}
document.addEventListener('pointerdown',e=>{const H=$('#hoja');if(H.classList.contains('v')&&!e.target.closest('#hoja')&&!e.target.closest('.sello'))H.classList.remove('v')});
/* ---------- arranque (hash para las capturas) ---------- */
escenaPrincipal();
if(location.hash==='#2'){abrirHilo(HILOS[0])}
if(location.hash==='#3'){escenaCrisis()}
</script>
