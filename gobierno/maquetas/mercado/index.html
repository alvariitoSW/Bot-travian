<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mercado (maqueta)</title>
<link rel="stylesheet" href="../../../css/style.css">
<style>
html,body{margin:0;height:100%;background:#1a130a url(../fondo-ciudad.jpg) center/cover no-repeat}
.hoja{box-sizing:border-box;position:absolute;left:0;right:0;bottom:0;top:0;max-width:560px;margin:0 auto;padding:12px 16px;overflow-y:auto;overflow-x:clip;color:#2b1c0a;font-family:Georgia,serif;
background-color:var(--papiro,#e8d4a2);background-image:radial-gradient(ellipse at 20% 0%,rgba(255,246,214,.7),transparent 55%),radial-gradient(ellipse at 100% 100%,rgba(140,92,36,.38),transparent 60%)}
</style></head><body>
<div class="hoja"><div id="caja"></div></div>
<script src="../../../js/data.js"></script>
<script src="../../../js/ministros.js"></script><script src="../../../js/plan-senado.js"></script><script src="../../../js/asesor.js"></script><script src="../../../js/diplomacia.js"></script><script src="../../../js/codice.js"></script><script src="../../../js/registro.js"></script><script src="../../../js/carga.js"></script><script src="../../../js/battle.js"></script>
<script src="../../../js/game.js"></script>
<script src="../../../js/mercado.js"></script>
<script src="../../../js/mercado-ui.js"></script>
<script>
(async function () {
  var q = new URLSearchParams(location.search), MER = window.MERCADO, G = window.Game;
  var s = G.newGame('Prueba', 'mediterraneo', {}); G.onEvent = null;
  s.t = 3; s.cities.roma.b.mercado = 3; s.cities.roma.b.puerto = 3;
  if (s.cities.capua) { s.cities.capua.b.mercado = 2; }
  MER.migrar(s);
  var stock = { denarios: 800, grano: 40, aceite: 12, vino: 25, hierro: 30, lana: 8, sal: 6, materiales: 8 };
  var ay = { tiene: function (p) { return stock[p] || 0; }, cabe: function () { return 999; }, enGuerra: function (f) { return f === 'cartago'; },
    bloqueada: function () { return false; }, cosecha: function () { return null; } };
  function suma(d) { for (var k in (d || {})) stock[k] = Math.max(0, (stock[k] || 0) + d[k]); }
  MER.rutaCrear(s, { a: 'roma', b: 'syracusae', prod: 'hierro', cargas: 3 }, ay);
  MER.rutaCrear(s, { a: 'roma', b: 'carthago', prod: 'vino', cargas: 4 }, ay);
  if (s.cities.capua) MER.rutaCrear(s, { a: 'capua', b: 'tarentum', prod: 'grano', cargas: 2 }, ay);
  MER.viajeLanzar(s, { a: 'roma', b: 'massalia', prod: 'lana', cargas: 4 }, ay);
  for (var i = 0; i < 4; i++) { s.t += 1; suma(MER.mes(s, ay).delta); }
  for (var j = 0; j < 14 && MER.publicanosVer && MER.publicanosVer(s, ay).ofertas.length < 2; j++) { s.t += 1; suma(MER.mes(s, ay).delta); }
  var ya = MER.publicanosVer ? MER.publicanosVer(s, ay) : null;
  if (ya && ya.ofertas.length && MER.publicanoAceptar) suma((MER.publicanoAceptar(s, ya.ofertas[0].id, ay) || {}).delta);
  try { if (MER.portoriumFijar) MER.portoriumFijar(s, 'roma', 0.03); } catch (e) { /* nada */ }
  if (location.protocol !== 'file:') { try { var A = await import('../../../js/agricultura.js'); if (MER.ayudaAgro) ay = MER.ayudaAgro(A, s, ay) || ay; } catch (e) { /* sin agricultura */ } }
  window.S = s; window.STOCK = stock; window.MER = MER;
  MERCADO_UI.abrir(document.getElementById('caja'), s, { ay: ay, ciudad: 'roma', raiz: '../../../', pestana: q.get('pestana') || 'precios',
    aplicar: function (d) { suma(d); }, cerrar: function () { document.getElementById('caja').innerHTML = '<p>Cerrado.</p>'; } });
})();
</script></body></html>
