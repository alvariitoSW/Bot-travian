/* FU4/FU6: «Falange a pie» es la escena del bloque con ?formacion=falange&rival=… (todos los rivales). Esta página solo lleva allí
   (Escaramuzas y los jueces entran por aquí). Se conservan los otros parámetros. La escena vieja se quitó en FU6; aquí quedan las
   piezas que usa el bloque (reglas, paso, mando, sarisas, campo y el dibujo de los rivales) y el banco de rivales (banco-rivales.html). */
(function () {
  var q = new URLSearchParams(location.search); q.delete('antiguo');
  q.set('formacion', 'falange');
  location.replace(new URL('gobierno/maquetas/bloque/', document.baseURI).href + '?' + q.toString());
})();
