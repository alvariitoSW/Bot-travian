<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AQVILA · Hojas</title>
<style>
@font-face{font-family:Cinzel;font-weight:400;src:url(../../../assets/fuentes/cinzel-400.woff2) format("woff2")}
@font-face{font-family:Cinzel;font-weight:700;src:url(../../../assets/fuentes/cinzel-700.woff2) format("woff2")}
:root{--n:#0b1016;--rojo:#c0281f;--oro:#e9c063;--bronce:#b8862b;--m:#f1ead9;--piedra:#9aa6b4;--oliva:#8fae5a;--terra:#d9764a;
 --cristal:rgba(18,26,36,.66);--linea:rgba(241,234,217,.13);--hoja:#131c27}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#05080c}
body{font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--m)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
h1,h2,h3,p{margin:0}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{position:relative;width:100%;max-width:390px;height:100vh;max-height:844px;margin:0 auto;overflow:hidden;background:var(--n)}
#fondo,#velo{position:absolute;inset:0;width:100%;height:100%}
#velo{background:linear-gradient(180deg,rgba(11,16,22,.78) 0%,rgba(11,16,22,.3) 45%,rgba(11,16,22,.55) 100%)}
/* HUD */
#hud{position:absolute;left:0;right:0;top:0;padding:10px 16px 0;display:grid;gap:8px}
.fila1{display:flex;align-items:center;gap:8px;height:44px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:22px;background:var(--cristal);border:1px solid var(--linea);backdrop-filter:blur(10px)}
.pill b{font-family:Cinzel,serif;font-weight:700;font-size:16px;letter-spacing:.03em}
.fecha{white-space:nowrap;flex:1;text-align:center;font-size:13px;color:var(--piedra);line-height:1.2}
.fecha b{display:block;color:var(--m);font-size:14px;font-weight:600}
.cir{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--cristal);border:1px solid var(--linea);position:relative}
.cir .pt{position:absolute;top:8px;right:9px;width:10px;height:10px;border-radius:50%;background:var(--rojo);border:2px solid #141c27}
.recs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rec{display:flex;align-items:center;justify-content:center;gap:4px;height:36px;border-radius:18px;background:var(--cristal);border:1px solid var(--linea);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.rec .i{width:16px;height:16px;color:var(--oro)}
#pantalla{position:absolute;left:0;right:0;top:112px;bottom:72px;padding:0 16px;display:flex;flex-direction:column}
body.sinhud #pantalla{top:0;bottom:0}
/* tabs */
#tabs{position:absolute;left:12px;right:12px;bottom:10px;height:56px;border-radius:28px;background:rgba(14,21,30,.88);border:1px solid var(--linea);backdrop-filter:blur(14px);display:grid;grid-template-columns:repeat(3,1fr);padding:4px}
#tabs button{display:flex;align-items:center;justify-content:center;gap:6px;border-radius:24px;font-size:13px;font-weight:600;color:var(--piedra)}
#tabs button.on{background:rgba(233,192,99,.16);color:var(--oro)}
body.sinhud #tabs,body.sinhud #hud{display:none}
/* gobierno */
.heroe{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.heroe h1{font-family:Cinzel,serif;font-size:30px;letter-spacing:.06em;font-weight:700}
.heroe .sub{color:var(--piedra);font-size:14px}
.anillo{position:relative;width:176px;height:176px}
.anillo svg{width:100%;height:100%;transform:rotate(-90deg)}
.anillo .c{position:absolute;inset:0;display:grid;place-content:center;gap:0}
.anillo .c span{font-size:34px;line-height:1}
.anillo .c b{font-family:Cinzel,serif;font-size:26px}
.anillo .c small{font-size:13px;color:var(--piedra)}
.faltas{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.faltas>span{font-size:13px;color:var(--piedra)}
.chip{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px;border-radius:16px;font-size:13px;font-weight:600;background:rgba(217,118,74,.16);color:#f0a07a;border:1px solid rgba(217,118,74,.4)}
.chip .i{width:15px;height:15px}
.chip.ro{background:rgba(192,40,31,.2);color:#ff8f86;border-color:rgba(192,40,31,.55)}
.chip.ok{background:rgba(143,174,90,.16);color:var(--oliva);border-color:rgba(143,174,90,.45)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.tile{height:80px;border-radius:20px;background:var(--cristal);border:1px solid var(--linea);backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:600}
.tile .i{color:var(--oro);width:24px;height:24px}
.tile small{font-size:13px;color:var(--piedra);font-weight:400;line-height:1}
.tile:active,.btn:active,.fcard:active{transform:scale(.97)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:56px;border-radius:28px;font-weight:700;font-size:16px;background:var(--oro);color:#241a05;box-shadow:0 6px 20px rgba(233,192,99,.25);width:100%}
.btn.sec{background:rgba(241,234,217,.1);color:var(--m);box-shadow:none;border:1px solid var(--linea)}
.btn.ch{height:48px;font-size:15px}
.btn[disabled]{opacity:.4}
.btn .i{width:20px;height:20px}
/* imperio */
.resu{display:grid;grid-template-columns:1fr 1fr 1fr;border-radius:20px;background:var(--cristal);border:1px solid var(--linea);height:60px;margin-bottom:8px}
.resu div{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.resu b{font-family:Cinzel,serif;font-size:17px}
.resu small{font-size:13px;color:var(--piedra)}
.filtros{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 8px;padding:0 16px;flex:none;scroll-snap-type:x proximity}
.filtros::-webkit-scrollbar{display:none}
.fil{flex:none;height:44px;padding:0 16px;border-radius:22px;background:var(--cristal);border:1px solid var(--linea);font-size:14px;font-weight:600;color:var(--piedra);display:flex;align-items:center;gap:6px;scroll-snap-align:start}
.fil.on{background:var(--oro);color:#241a05;border-color:var(--oro)}
.fil em{font-style:normal;font-size:13px;opacity:.8}
.lista{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0}
.fcard{display:grid;gap:6px;padding:10px 14px;border-radius:20px;background:var(--cristal);border:1px solid var(--linea);backdrop-filter:blur(10px);text-align:left;width:100%}
.fcard .t{display:flex;align-items:center;justify-content:space-between}
.fcard h3{font-family:Cinzel,serif;font-size:18px;letter-spacing:.04em}
.fcard .pob{font-size:13px;color:var(--piedra)}
.fcard .pob b{color:var(--m);font-size:15px}
.fcard .mood{font-size:24px;line-height:1}
.obra{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--piedra)}
.obra .barra{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.obra .barra i{display:block;height:100%;background:var(--oliva);border-radius:3px}
.avs{display:flex;gap:6px;min-height:28px;align-items:center}
.avs .chip{height:28px}
.vacio{margin:auto;color:var(--piedra);text-align:center}
.accesos{margin-top:8px}
.accesos .tile{height:68px}
/* menu */
.menu{flex:1;display:flex;flex-direction:column;padding-top:18px}
.cab{text-align:center;padding-top:34px}
.cab h1{font-family:Cinzel,serif;font-size:50px;letter-spacing:.12em;font-weight:700;color:var(--oro);text-shadow:0 4px 24px rgba(0,0,0,.6);line-height:1.1}
.cab p{font-family:Cinzel,serif;letter-spacing:.3em;font-size:13px;color:var(--piedra);margin-top:4px}
.cab svg{width:70px;height:70px;margin:0 auto 6px;display:block;color:var(--oro)}
.menu .abajo{margin-top:auto;display:grid;gap:10px}
.btn.cont{height:72px;flex-direction:column;gap:1px;font-size:18px}
.btn.cont small{font-size:13px;font-weight:500;opacity:.75}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio .tile{height:76px}
.cred{text-align:center;font-size:13px;color:var(--piedra);line-height:1.45;padding:6px 4px 12px}
.cerrar{position:absolute;top:12px;right:16px}
/* hoja */
#scrim{position:absolute;inset:0;background:rgba(4,7,11,.58);opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;height:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#18232f,var(--hoja) 40%);border-radius:28px 28px 0 0;border-top:1px solid rgba(233,192,99,.4);box-shadow:0 -12px 40px rgba(0,0,0,.5);transition:height .28s cubic-bezier(.2,.8,.2,1);overflow:hidden}
#sheet.arr{transition:none}
.top{flex:none;touch-action:none;cursor:grab}
#grab{height:24px;display:grid;place-items:center}
#grab i{width:44px;height:5px;border-radius:3px;background:rgba(241,234,217,.3)}
.cabh{display:flex;align-items:center;justify-content:space-between;padding:0 16px 6px 20px;min-height:48px}
.cabh h2{font-family:Cinzel,serif;font-size:21px;letter-spacing:.04em}
.cabh p{font-size:13px;color:var(--piedra)}
.x{width:44px;height:44px;border-radius:50%;background:rgba(241,234,217,.08);display:grid;place-items:center}
.cuerpo{flex:1;min-height:0;overflow-y:auto;padding:4px 20px 16px;display:flex;flex-direction:column;gap:12px}
.pie{flex:none;padding:8px 20px 20px;display:flex;gap:10px}
.pie .btn{flex:1}
.et{font-size:13px;color:var(--piedra);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:24px;background:rgba(255,255,255,.07)}
.seg button{height:44px;border-radius:20px;font-size:14px;font-weight:600;color:var(--piedra)}
.seg button.on{background:var(--oro);color:#241a05}
.fila{display:flex;align-items:center;justify-content:space-between;min-height:48px;gap:12px;font-size:16px}
.fila small{display:block;font-size:13px;color:var(--piedra)}
.int{flex:none;width:52px;height:32px;border-radius:16px;background:rgba(255,255,255,.14);position:relative;transition:.2s}
.int::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--m);transition:.2s}
.int.on{background:var(--oliva)}.int.on::after{left:23px}
.tg{display:flex;align-items:center;min-width:44px;min-height:44px;justify-content:flex-end}
.sep{height:1px;background:var(--linea);flex:none}
/* mercado */
.mon{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mon button{height:64px;border-radius:18px;background:rgba(255,255,255,.07);border:1.5px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px}
.mon button .i{color:var(--oro)}
.mon button.on{border-color:var(--oro);background:rgba(233,192,99,.16)}
.cants{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cants button{height:56px;border-radius:18px;background:rgba(255,255,255,.07);border:1.5px solid transparent;font-weight:700;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cants button.on{border-color:var(--oro);background:rgba(233,192,99,.16)}
.cants button[disabled]{opacity:.35}
.resm{background:rgba(255,255,255,.06);border-radius:18px;padding:12px 14px;text-align:center;font-size:16px}
.resm b{color:var(--oro)}
.resm small{display:block;color:var(--piedra);font-size:13px}
/* rutas */
.huecos{display:flex;align-items:center;gap:8px}
.huecos i{width:34px;height:10px;border-radius:5px;background:rgba(255,255,255,.14)}
.huecos i.on{background:var(--oro)}
.ruta{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;background:rgba(255,255,255,.06);min-height:68px}
.ruta .ic{width:40px;height:40px;border-radius:50%;background:rgba(233,192,99,.14);display:grid;place-items:center;color:var(--oro);flex:none}
.ruta .tx{flex:1;min-width:0}
.ruta h3{font-size:16px;font-weight:600}
.ruta p{font-size:13px;color:var(--piedra)}
.ruta .gan{font-weight:700;color:var(--oliva);font-size:15px;white-space:nowrap}
.ruta .mini{height:44px;padding:0 14px;border-radius:22px;background:rgba(233,192,99,.18);color:var(--oro);font-weight:700;font-size:14px}
.ruta.off{opacity:.9;border:1px dashed var(--linea);background:transparent}
/* cronica */
.lt{position:relative;display:flex;flex-direction:column;gap:6px;padding-left:22px}
.lt::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--linea)}
.hecho{position:relative;padding:6px 0}
.hecho::before{content:"";position:absolute;left:-21px;top:12px;width:12px;height:12px;border-radius:50%;background:var(--hoja);border:2px solid var(--piedra)}
.hecho.ya::before{background:var(--oro);border-color:var(--oro)}
.hecho b{font-family:Cinzel,serif;color:var(--oro);font-size:15px}
.hecho p{font-size:15px}
.hecho small{font-size:13px;color:var(--piedra)}
.suc{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--linea)}
.suc .i{color:var(--oro);margin-top:2px}
.suc p{font-size:15px}.suc small{font-size:13px;color:var(--piedra)}
/* informe */
.inf{display:flex;gap:12px;align-items:center;min-height:52px}
.inf .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:rgba(233,192,99,.14);color:var(--oro)}
.inf .ic.al{background:rgba(217,118,74,.2);color:var(--terra)}
.inf h3{font-size:15px;font-weight:700}.inf p{font-size:14px;color:#cfc8b6;line-height:1.3}
.tareas{display:grid;gap:6px;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.06)}
.tareas div{display:flex;gap:10px;align-items:center;font-size:14px}
.tareas .i{width:18px;height:18px;color:var(--oliva)}
.opc{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:20px;background:rgba(255,255,255,.06);border:1.5px solid transparent;text-align:left;width:100%}
.opc.on{border-color:var(--oro);background:rgba(233,192,99,.12)}
.opc .ic{width:44px;height:44px;border-radius:14px;background:rgba(233,192,99,.14);color:var(--oro);display:grid;place-items:center;flex:none}
.opc b{display:block;font-size:16px}.opc small{font-size:13px;color:var(--piedra)}
input.nom{width:100%;height:52px;border-radius:18px;border:1px solid var(--linea);background:rgba(255,255,255,.07);color:var(--m);font:inherit;font-size:16px;padding:0 16px}
#toast{position:absolute;left:50%;bottom:86px;transform:translate(-50%,20px);background:#e9c063;color:#241a05;font-weight:600;font-size:14px;padding:10px 18px;border-radius:22px;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<div id="app">
 <svg id="fondo" viewBox="0 0 390 844" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <defs><linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101a28"/><stop offset=".55" stop-color="#352b3a"/><stop offset=".75" stop-color="#8a4a33"/><stop offset="1" stop-color="#2a1a18"/></linearGradient></defs>
  <rect width="390" height="844" fill="url(#cielo)"/>
  <circle cx="300" cy="470" r="50" fill="#e9c063" opacity=".14"/>
  <path d="M0 640q80-50 170-15t220-15v234H0z" fill="#2a2630"/>
  <g fill="#1a1a22">
   <path d="M30 612l60-30 60 30z"/><rect x="38" y="614" width="104" height="6"/>
   <rect x="44" y="620" width="9" height="46"/><rect x="62" y="620" width="9" height="46"/><rect x="80" y="620" width="9" height="46"/><rect x="98" y="620" width="9" height="46"/><rect x="116" y="620" width="9" height="46"/><rect x="134" y="620" width="9" height="46"/>
   <rect x="30" y="666" width="120" height="10"/>
   <rect x="176" y="574" width="26" height="102"/><path d="M172 574h34l-17-18z"/>
   <rect x="214" y="610" width="64" height="66"/><path d="M214 610a32 24 0 0164 0z"/>
   <path d="M290 640h100v10H290zM296 650h12v26h-12zM322 650h12v26h-12zM348 650h12v26h-12zM374 650h12v26h-12z"/>
  </g>
  <rect y="676" width="390" height="168" fill="#10131a"/>
  <g fill="#e9c063" opacity=".75"><rect x="186" y="596" width="5" height="9"/><rect x="236" y="640" width="6" height="10"/><rect x="250" y="640" width="6" height="10"/><rect x="60" y="700" width="6" height="8"/><rect x="300" y="710" width="6" height="8"/></g>
  <g fill="#1d2029"><rect x="20" y="690" width="70" height="60"/><rect x="110" y="700" width="90" height="70"/><rect x="230" y="690" width="60" height="70"/><rect x="310" y="700" width="70" height="60"/></g>
 </svg>
 <div id="velo"></div>
 <header id="hud"></header>
 <main id="pantalla"></main>
 <nav id="tabs"></nav>
 <div id="scrim"><section id="sheet" aria-live="polite"></section></div>
 <div id="toast"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const ic=(n,c)=>`<svg class="i ${c||''}"><use href="#i-${n}"/></svg>`;
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const SNAP=[420,600,770];
const R=[{id:'wood',n:'Madera',v:1240},{id:'stone',n:'Piedra',v:860},{id:'iron',n:'Hierro',v:410},{id:'grain',n:'Grano',v:1520},{id:'coin',n:'Oro',v:930}];
const CANT=[[100,50],[500,250],[2000,1000]];
const S={aj:{dif:'Normal',cons:true,crecida:true,incendios:true,hambre:false,sonido:true,pausas:'Solo graves',fluidez:'Normal'},
 m:{doy:0,rec:3,c:0},cron:0,filtro:'Todas',nombre:'Lucio Cornelio Escipión',modo:0,
 rutas:[{a:'Roma',b:'Capua',m:'Vino',g:38,on:true},{a:'Roma',b:'Tarento',m:'Hierro',g:24,on:true},{a:'Capua',b:'Siracusa',m:'Grano',g:52,on:false}]};
const CIUDADES=[
 {n:'Roma',p:8420,t:10000,m:'😊',obra:'Foro · nivel 3',pr:64,av:[['am','Almacén lleno']]},
 {n:'Capua',p:5310,t:7000,m:'😐',obra:'Granero · nivel 2',pr:30,av:[['ro','Inquietud']]},
 {n:'Tarento',p:3890,t:6000,m:'😠',obra:null,pr:0,av:[['ro','Inquietud'],['am','Sin obra · hay recursos']]},
 {n:'Siracusa',p:4960,t:6500,m:'😊',obra:'Muralla · nivel 1',pr:80,av:[]}];
const FILTROS={'Todas':c=>1,'Urgentes':c=>c.av.some(a=>a[1]==='Inquietud'),'Sin obra':c=>!c.obra,'En obras':c=>!!c.obra,'Ánimo bajo':c=>c.m!=='😊'};

/* ---------- pantallas ---------- */
function hud(){return `<div class="fila1"><button class="pill" data-a="toast:Cambiar de ciudad: Roma"><b>Roma</b>${ic('down')}</button>
 <div class="fecha"><b>280 a.C.</b>Invierno · ×1</div>
 <button class="cir" data-a="go:modal" aria-label="Informe">${ic('bell')}<span class="pt"></span></button>
 <button class="cir" data-a="go:menu" aria-label="Menú">${ic('menu')}</button></div>
 <div class="recs">${R.map(r=>`<div class="rec">${ic(r.id)}${fmt(r.v)}</div>`).join('')}</div>`}
function tabs(sel){const t=[['ciudad','city','Ciudad'],['gobierno','gov','Gobierno'],['imperio','globe','Imperio']];
 return t.map(x=>`<button class="${x[0]===sel?'on':''}" data-a="${x[0]==='ciudad'?'toast:Vista de ciudad: no está en la maqueta':'go:'+x[0]}">${ic(x[1])}${x[2]}</button>`).join('')}
function pGobierno(){
 const hu=S.rutas.filter(r=>r.on).length;
 return `<div class="heroe"><div><h1>Roma</h1><p class="sub">Capital · 8.420 habitantes</p></div>
 <div class="anillo"><svg viewBox="0 0 176 176"><circle cx="88" cy="88" r="76" fill="rgba(11,16,22,.45)" stroke="rgba(255,255,255,.1)" stroke-width="12"/><circle cx="88" cy="88" r="76" fill="none" stroke="#8fae5a" stroke-width="12" stroke-linecap="round" stroke-dasharray="${.72*477.5} 477.5"/></svg>
 <div class="c"><span>😊</span><b>72 %</b><small>Felicidad</small></div></div>
 <div class="faltas"><span>Falta:</span><span class="chip">${ic('warn')}Sal</span><span class="chip">${ic('warn')}Caballos</span><span class="chip">${ic('warn')}Vino</span></div></div>
 <div class="tiles">
  <button class="tile" data-a="go:gobierno-mercado">${ic('market')}Mercado</button>
  <button class="tile" data-a="go:gobierno-rutas">${ic('route')}Rutas<small>${hu}/4</small></button>
  <button class="tile" data-a="go:gobierno-ajustes">${ic('sliders')}Ajustes</button>
  <button class="tile" data-a="go:gobierno-cronica">${ic('scroll')}Crónica</button></div>
 <button class="btn" data-a="turno" style="margin-bottom:0">${ic('play')}Pasar turno</button>
 <div style="height:12px;flex:none"></div>`}
function pImperio(){
 const f=FILTROS[S.filtro],ls=CIUDADES.filter(f);
 return `<div class="resu"><div><b>4</b><small>ciudades</small></div><div><b>22.580</b><small>habitantes</small></div><div><b>+86</b><small>oro por turno</small></div></div>
 <div class="filtros">${Object.keys(FILTROS).map(k=>`<button class="fil ${k===S.filtro?'on':''}" data-a="filtro:${k}">${k}<em>${CIUDADES.filter(FILTROS[k]).length}</em></button>`).join('')}</div>
 <div class="lista">${ls.length?ls.map(c=>`<button class="fcard" data-a="ciudad:${c.n}">
  <div class="t"><h3>${c.n}</h3><span class="pob"><b>${fmt(c.p)}</b> / ${fmt(c.t)}</span><span class="mood">${c.m}</span></div>
  <div class="obra">${c.obra?`${ic('hammer','')}<span>${c.obra}</span><div class="barra"><i style="width:${c.pr}%"></i></div><span>${c.pr}%</span>`:`${ic('hammer')}<span>Sin obra</span>`}</div>
  <div class="avs">${c.av.map(a=>`<span class="chip ${a[0]==='ro'?'ro':''}">${ic('warn')}${a[1]}</span>`).join('')||'<span class="chip ok">'+ic('check')+'Todo en orden</span>'}</div></button>`).join(''):'<p class="vacio">Ninguna ciudad con este filtro.</p>'}</div>
 <div class="tiles accesos">
  <button class="tile" data-a="acc:Senado">${ic('senate')}Senado</button>
  <button class="tile" data-a="acc:Saber">${ic('book')}Saber</button>
  <button class="tile" data-a="acc:General">${ic('sword')}General</button>
  <button class="tile" data-a="go:gobierno-cronica">${ic('scroll')}Crónica</button></div>`}
function pMenu(){return `<div class="menu"><button class="cir cerrar" data-a="go:gobierno" aria-label="Volver">${ic('close')}</button>
 <div class="cab">${ic('eagle')}<h1>AQVILA</h1><p>EL ASCENSO DE ROMA</p></div>
 <div class="abajo">
  <button class="btn cont" data-a="go:gobierno">Continuar campaña<small>Roma · Invierno 280 a.C. · turno 1</small></button>
  <button class="btn sec" data-a="sh:nueva">Nueva campaña</button>
  <div class="trio"><button class="tile" data-a="toast:Región de Italia: empieza">${ic('globe')}Región de Italia</button>
   <button class="tile" data-a="sh:corta">${ic('shield')}Partida corta</button>
   <button class="tile" data-a="sh:sonido">${ic('sliders')}Sonido y fluidez</button></div>
  <p class="cred">Modelos y animaciones: 0 A.D. © Wildfire Games, CC BY-SA 3.0.<br>Letra Cinzel © The Cinzel Project Authors, SIL OFL 1.1.</p></div></div>`}

/* ---------- hojas ---------- */
const seg=(k,opts,cur)=>`<div class="seg">${opts.map(o=>`<button class="${o===cur?'on':''}" data-a="aj:${k}:${o}">${o}</button>`).join('')}</div>`;
const tog=(k,t,s)=>`<div class="fila"><div>${t}${s?`<small>${s}</small>`:''}</div><button class="tg" data-a="tg:${k}" aria-label="${t}"><span class="int ${S.aj[k]?'on':''}"></span></button></div>`;
const monedas=(sel,k)=>`<div class="mon">${R.map((r,i)=>`<button class="${i===sel?'on':''}" data-a="mon:${k}:${i}">${ic(r.id)}${r.n}</button>`).join('')}</div>`;
const SH={
 mercado(){const m=S.m,[d,g]=CANT[m.c];const ok=R[m.doy].v>=d;return{t:'Mercado',s:'Cambio 50 %',h:SNAP[1],b:`
  <div class="et">Doy</div>${monedas(m.doy,'doy')}
  <div class="et">Recibo</div>${monedas(m.rec,'rec')}
  <div class="cants">${CANT.map((c,i)=>`<button class="${i===m.c?'on':''}" data-a="cant:${i}" ${R[m.doy].v<c[0]?'disabled':''}>${fmt(c[0])}→${fmt(c[1])}</button>`).join('')}</div>
  <div class="resm">Das <b>${fmt(d)} ${R[m.doy].n}</b> y recibes <b>${fmt(g)} ${R[m.rec].n}</b><small>Tienes ${fmt(R[m.doy].v)} de ${R[m.doy].n}</small></div>`,
  f:`<button class="btn" data-a="cambiar" ${ok?'':'disabled'}>${ic('market')}Hacer el cambio</button>`}},
 rutas(){const hu=S.rutas.filter(r=>r.on).length;return{t:'Rutas comerciales',s:'',h:SNAP[1],b:`
  <div class="huecos">${[0,1,2,3].map(i=>`<i class="${i<hu?'on':''}"></i>`).join('')}<span style="font-size:14px;margin-left:4px"><b>${hu}/4</b> huecos en uso</span></div>
  ${S.rutas.map((r,i)=>`<div class="ruta ${r.on?'':'off'}"><span class="ic">${ic('route')}</span><div class="tx"><h3>${r.a} → ${r.b}</h3><p>${r.m} · cada turno</p></div>
   ${r.on?`<span class="gan">+${r.g} oro</span>`:`<button class="mini" data-a="ruta:${i}" ${hu>=4?'disabled':''}>Abrir (+${r.g})</button>`}</div>`).join('')}
  <p style="font-size:13px;color:var(--piedra)">Cada ruta abierta usa un hueco. Tienes 4.</p>`,
  f:`<button class="btn sec" data-a="toast:Elige una ciudad en el mapa">${ic('route')}Nueva ruta</button>`}},
 ajustes(){const a=S.aj;return{t:'Ajustes',s:'',h:SNAP[2],b:`
  <div class="et">Dificultad</div>${seg('dif',['Tranquila','Normal','Dura'],a.dif)}
  <div class="et">Pausas del reloj</div>${seg('pausas',['Todas','Solo graves','Ninguna'],a.pausas)}
  <div class="sep"></div>
  ${tog('cons','Consejos del asesor','')}
  <button class="btn sec ch" data-a="toast:Los consejos se repetirán">Repetir los consejos</button>
  <div class="sep"></div><div class="et">Sucesos</div>
  ${tog('crecida','Crecida del río')}${tog('incendios','Incendios')}${tog('hambre','Hambre de invierno')}
  <div class="sep"></div>${tog('sonido','Sonido')}`}},
 cronica(){const c=S.cron;return{t:'Crónica',s:'',h:SNAP[2],b:`
  <div class="seg"><button class="${c==0?'on':''}" data-a="cron:0">Línea del tiempo</button><button class="${c==1?'on':''}" data-a="cron:1">Sucesos del año</button></div>
  ${c==0?`<div class="lt">${[['280 a.C.','Heraclea','Pirro vence a Roma con sus elefantes.',1],['279 a.C.','Ausculum','Otra victoria cara para Pirro.',0],['275 a.C.','Benevento','Pirro se retira de Italia.',0],['272 a.C.','Tarento','La ciudad se rinde a Roma.',0],['264 a.C.','Mesina','Empieza la guerra contra Cartago.',0]].map(h=>`<div class="hecho ${h[3]?'ya':''}"><b>${h[0]}</b> · ${h[1]}<p>${h[2]}</p></div>`).join('')}</div>`
  :[['wave','Invierno','Aviso: el Tíber crecerá pronto.'],['grain','Otoño','Buena cosecha: +120 de grano.'],['fire','Verano','Incendio en el Aventino. Apagado.'],['eagle','Primavera','La legión de Capua llega a Roma.']].map(s=>`<div class="suc">${ic(s[0])}<div><small>${s[1]}</small><p>${s[2]}</p></div></div>`).join('')}`}},
 informe(){return{t:'Invierno del 280 a.C.',s:'Turno 1 · Informe del asesor',h:SNAP[0],b:`
  <div class="inf"><span class="ic al">${ic('wave')}</span><div><h3>Crecida del río</h3><p>El Tíber subirá. Guarda grano.</p></div></div>
  <div class="inf"><span class="ic">${ic('hammer')}</span><div><h3>Obras sin cola</h3><p>Hay recursos. Pon una obra.</p></div></div>
  <div class="inf"><span class="ic">${ic('senate')}</span><div><h3>Senado</h3><p>Espera tu decisión.</p></div></div>
  ${S.mas?`<div class="inf"><span class="ic">${ic('shield')}</span><div><h3>Hombres en armas</h3><p>120 hombres listos en Roma.</p></div></div>
  <div class="tareas"><h3 style="font-size:15px">Tareas</h3><div>${ic('check')}Construir un molino</div><div>${ic('check')}Abrir una ruta de comercio</div></div>`:''}`,
  f:`<button class="btn sec" data-a="mas">${S.mas?'Ver menos':'Ver más'}</button><button class="btn" data-a="go:gobierno">Seguir</button>`}},
 nueva(){return{t:'Nueva campaña',s:'',h:SNAP[1],b:`
  <div class="et">Nombre del general</div><input class="nom" value="${S.nombre}" oninput="S.nombre=this.value">
  <div class="et">Dificultad</div>${seg('dif',['Tranquila','Normal','Dura'],S.aj.dif)}
  ${tog('cons','Consejos del asesor','')}`,f:`<button class="btn" data-a="go:gobierno">${ic('play')}Empezar campaña</button>`}},
 corta(){const o=[['Roma y Capua en pie','Empiezas con dos ciudades hechas.','city'],['Fundar de la nada','Una aldea y mucho por hacer.','hammer']];return{t:'Partida corta',s:'Elige cómo empezar',h:SNAP[0],b:o.map((x,i)=>`<button class="opc ${S.modo===i?'on':''}" data-a="modo:${i}"><span class="ic">${ic(x[2])}</span><span><b>${x[0]}</b><small>${x[1]}</small></span></button>`).join(''),f:`<button class="btn" data-a="go:gobierno">Jugar partida corta</button>`}},
 sonido(){return{t:'Sonido y fluidez',s:'',h:SNAP[0],b:`${tog('sonido','Sonido')}<div class="et">Fluidez</div>${seg('fluidez',['Ahorro','Normal','Máxima'],S.aj.fluidez)}`,f:`<button class="btn sec" data-a="toast:Midiendo fluidez…">Medir fluidez</button>`}},
 acc(){return{t:S.acc,s:'',h:SNAP[0],b:`<p style="font-size:16px">${{Senado:'El Senado te espera. Hay 1 decisión pendiente.',Saber:'Elige qué estudiar. Hay 3 saberes a tu alcance.',General:'Tu general y sus legiones. 120 hombres en armas.'}[S.acc]}</p>`,f:`<button class="btn" data-a="toast:Abre ${S.acc}">Abrir ${S.acc}</button>`}},
 ciudad(){const c=CIUDADES.find(x=>x.n===S.cid);return{t:c.n,s:`${fmt(c.p)} de ${fmt(c.t)} habitantes · ánimo ${c.m}`,h:SNAP[0],b:`<div class="avs" style="flex-wrap:wrap">${c.av.map(a=>`<span class="chip ${a[0]==='ro'?'ro':''}">${ic('warn')}${a[1]}</span>`).join('')||'<span class="chip ok">'+ic('check')+'Todo en orden</span>'}</div><p style="font-size:15px">${c.obra?'Obra en curso: '+c.obra+' ('+c.pr+' %).':'No hay obra en curso.'}</p>`,f:`<button class="btn sec" data-a="close">Cerrar</button><button class="btn" data-a="toast:Entrando en ${c.n}">Ir a ${c.n}</button>`}}};

/* ---------- motor ---------- */
let cur='',curH=0,openName=null;
const sheet=$('#sheet'),scrim=$('#scrim');
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}
function fillSheet(){const d=SH[openName]();
 sheet.innerHTML=`<div class="top" id="top"><div id="grab"><i></i></div><div class="cabh"><div><h2>${d.t}</h2>${d.s?`<p>${d.s}</p>`:''}</div><button class="x" data-a="close" aria-label="Cerrar">${ic('close')}</button></div></div><div class="cuerpo">${d.b}</div>${d.f?`<div class="pie">${d.f}</div>`:''}`;
 return d}
function showSheet(name,h){const first=openName!==name;openName=name;const d=fillSheet();if(first||!curH)curH=h||d.h;if(h)curH=h;sheet.style.height=curH+'px';scrim.classList.add('on')}
function hideSheet(){openName=null;scrim.classList.remove('on');sheet.style.height='0';curH=0}
function closeSheet(){hideSheet();if(/^#(gobierno-|modal)/.test(location.hash))location.hash='#gobierno'}
function go(h){if(location.hash==='#'+h)route();else location.hash='#'+h}
function paint(){const s=cur;document.body.classList.toggle('sinhud',s==='menu');
 $('#hud').innerHTML=s==='menu'?'':hud();$('#tabs').innerHTML=tabs(s);
 $('#pantalla').innerHTML={gobierno:pGobierno,imperio:pImperio,menu:pMenu}[s]()}
function route(){const h=(location.hash||'#gobierno').slice(1);let pant='gobierno',sh=null;
 if(h==='menu')pant='menu';else if(h==='imperio')pant='imperio';else if(h==='modal')sh='informe';else if(h.startsWith('gobierno-'))sh=h.slice(9);
 if(sh&&!SH[sh])sh=null;cur=pant;S.mas=false;paint();
 if(sh){curH=0;openName=null;showSheet(sh)}else hideSheet()}
window.addEventListener('hashchange',route);

document.addEventListener('click',e=>{
 if(e.target===scrim){closeSheet();return}
 const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
 const [a,x,y]=b.dataset.a.split(':');
 const refresh=()=>{paint();if(openName)showSheet(openName)};
 switch(a){
  case 'go':go(x);break;
  case 'toast':toast(b.dataset.a.slice(6));break;
  case 'close':closeSheet();break;
  case 'sh':showSheet(x);break;
  case 'turno':toast('Turno 2 · Primavera del 279 a.C.');break;
  case 'filtro':S.filtro=x;refresh();break;
  case 'ciudad':S.cid=x;showSheet('ciudad');break;
  case 'acc':S.acc=x;showSheet('acc');break;
  case 'aj':S.aj[x]=y;refresh();break;
  case 'tg':S.aj[x]=!S.aj[x];refresh();break;
  case 'mon':S.m[x]=+y;if(S.m.doy===S.m.rec)S.m[x==='doy'?'rec':'doy']=(+y+1)%5;
    while(R[S.m.doy].v<CANT[S.m.c][0]&&S.m.c>0)S.m.c--;refresh();break;
  case 'cant':S.m.c=+x;refresh();break;
  case 'cambiar':{const [d,g]=CANT[S.m.c];R[S.m.doy].v-=d;R[S.m.rec].v+=g;toast(`Hecho: +${fmt(g)} ${R[S.m.rec].n}`);refresh();break}
  case 'ruta':S.rutas[+x].on=true;refresh();break;
  case 'cron':S.cron=+x;refresh();break;
  case 'mas':S.mas=!S.mas;showSheet('informe',S.mas?SNAP[1]:SNAP[0]);break;
  case 'modo':S.modo=+x;refresh();break}
});
/* arrastrar la hoja: 3 alturas, bajar del todo la cierra */
let dr=null;
sheet.addEventListener('pointerdown',e=>{const t=e.target.closest('#top');if(!t||e.target.closest('.x'))return;dr={y:e.clientY,h:curH,mv:false,id:e.pointerId}});
sheet.addEventListener('pointermove',e=>{if(!dr)return;const dy=e.clientY-dr.y;
 if(!dr.mv&&Math.abs(dy)>6){dr.mv=true;sheet.setPointerCapture(dr.id);sheet.classList.add('arr')}
 if(dr.mv){curH=Math.max(60,Math.min(770,dr.h-dy));sheet.style.height=curH+'px'}});
sheet.addEventListener('pointerup',e=>{if(!dr)return;const d=dr;dr=null;sheet.classList.remove('arr');
 if(!d.mv){const i=SNAP.findIndex(s=>s>=curH-2);curH=SNAP[(i+1)%3];sheet.style.height=curH+'px';return}
 if(curH<260&&curH<d.h){closeSheet();return}
 curH=SNAP.reduce((p,s)=>Math.abs(s-curH)<Math.abs(p-curH)?s:p);sheet.style.height=curH+'px'});
route();
</script>
</body>
</html>
