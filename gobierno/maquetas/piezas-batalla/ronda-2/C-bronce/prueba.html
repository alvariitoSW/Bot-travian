<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Prueba bronce</title>
<link rel="stylesheet" href="tarjeta.css"><link rel="stylesheet" href="hud.css">
<style>body{margin:0;background:#0b1016;color:#f1ead9;font:12px system-ui}
h2{font:700 13px Cinzel,Georgia,serif;letter-spacing:.12em;text-transform:uppercase;color:#e9c063;margin:10px 8px 4px}
.fila{display:flex;gap:10px;padding:8px;flex-wrap:wrap}.c{width:205px;display:flex;flex-direction:column;gap:3px}.c.x2{width:410px}.c.x2 .z{zoom:2}
.campo{background:#8c8a62 repeating-linear-gradient(95deg,rgba(0,0,0,.05) 0 3px,rgba(255,255,255,.04) 3px 7px);padding:8px}.noche{background:#0b1016;padding:8px}
.pantalla{position:relative;width:844px;height:390px;margin:8px;background-color:#8c8a62;background-image:repeating-linear-gradient(95deg,rgba(0,0,0,.06) 0 3px,rgba(255,255,255,.05) 3px 7px),repeating-linear-gradient(5deg,rgba(0,0,0,.05) 0 2px,transparent 2px 9px);overflow:hidden}
.z{display:flex}.z .tarjeta{flex:1}</style></head><body>
<h2>a) Tarjetas (real y x2) sobre campo y noche</h2><div id="a"></div>
<h2>b) Pantalla 844x390</h2>
<div class="pantalla"><div class="hud">
 <div class="hud-barra"><span class="hud-ronda">Ronda 1 · Plan</span><span class="hud-roma">Roma 700</span><div class="hud-fuerza"><i style="width:52%"></i></div><span class="hud-cart">636 Cartago</span><button class="hud-ala">Ala izq.</button><button class="hud-ala">Centro</button><button class="hud-ala">Ala der.</button></div>
 <div class="hud-objetivo">Cayo Flaminio: Adelantad el centro. Mira el plan sobre el campo y pulsa «Ver la ronda».</div>
 <div class="hud-gesto">La caballería enemiga busca tu flanco izquierdo…</div>
 <button class="hud-seguir">Seguir</button>
 <div class="hud-ordenes"><div class="hud-tarjetas" id="t"></div><button class="hud-btn">A mano</button><button class="hud-btn hud-principal">Ver la ronda</button></div>
</div></div>
<script>
const T=`<button class="tarjeta tarjeta--dud"><span class="tarjeta__placa"><i class="tarjeta__simbolo"></i><span class="tarjeta__caracter">{{caracter}}</span></span><span class="tarjeta__cuerpo"><span class="tarjeta__nombre">{{nombre}}</span><span class="tarjeta__titulo">{{titulo}}</span><span class="tarjeta__motivo">{{motivo}}</span></span><span class="tarjeta__etiqueta">{{etiqueta}}</span></button>`;
const f=(o,m,sel,ex)=>{let h=T.replace('{{nombre}}',o.n).replace('{{caracter}}',o.c).replace('{{titulo}}',o.t).replace('{{motivo}}',o.m).replace('{{etiqueta}}',o.e);
 h=h.replace('tarjeta--dud','tarjeta--'+m+(o.k?' tarjeta--'+o.k:'')+(sel?' sel':''));return h};
const D=[{n:'Quinto Fabio',c:'Prudente',t:'Cerrad filas y aguantad el choque',m:'Que se estrellen contra los escudos.',e:'Dudoso',k:'escudo'},
{n:'Cayo Flaminio',c:'Agresivo',t:'Adelantad el centro',m:'Su centro es lo más cercano.',e:'Arriesgado',k:'lanza'},
{n:'Publio Cornelio',c:'Astuto',t:'La caballería rodea su flanco derecho',m:'Los jinetes pueden rodearles.',e:'Arriesgado',k:'yelmo'}];
const E={fav:'Favorable',dud:'Dudoso',arr:'Arriesgado'};let a='';
for(const bg of ['campo','noche'])for(const sel of [0,1]){a+='<div class="fila '+bg+'">';
 for(const m of ['fav','dud','arr'])for(const [i,o] of D.entries()){if(i!=(m=='fav'?0:m=='dud'?1:2))continue;
  const oo={...o,e:E[m]};a+='<div class="c"><span>'+bg+' · '+m+(sel?' · elegida':'')+' (real)</span>'+f(oo,m,sel)+'</div>'}
 a+='</div>'}
a+='<div class="fila campo">';D.forEach((o,i)=>{const m=['dud','arr','arr'][i];a+='<div class="c x2"><span>x2 '+m+(i==1?' elegida':'')+'</span><div class="z">'+f(o,m,i==1)+'</div></div>'});a+='</div>';
document.getElementById('a').innerHTML=a;
document.getElementById('t').innerHTML=D.map((o,i)=>f(o,['dud','arr','arr'][i],i==1)).join('');
</script></body></html>
