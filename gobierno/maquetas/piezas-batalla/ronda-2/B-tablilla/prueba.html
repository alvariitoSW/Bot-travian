<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablilla de mando · prueba</title>
<link rel="stylesheet" href="tarjeta.css">
<link rel="stylesheet" href="hud.css">
<style>
  body { margin: 0; background: #0b1016; color: #f1ead9; font: 12px/1.4 system-ui, sans-serif; }
  h1, h2 { font-family: 'Cinzel', 'Palatino Linotype', Palatino, Georgia, serif; text-transform: uppercase; letter-spacing: .08em; color: #e9c063; margin: 14px 12px 6px; }
  h1 { font-size: 16px; } h2 { font-size: 13px; }
  .rot { color: #9aa6b4; font-size: 11px; margin: 0 0 4px; }
  .campo {
    background:
      repeating-linear-gradient(115deg, rgba(11,16,22,.06) 0 2px, transparent 2px 9px),
      repeating-linear-gradient(20deg, rgba(241,234,217,.05) 0 1px, transparent 1px 13px),
      #8c8a62;
  }
  .noche { background: #0b1016; }
  .campo .rot { color: #0b1016; font-weight: 600; }
  .panel { padding: 10px 12px; }
  .fila { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .caja { width: 205px; display: flex; }
  .caja2 { width: 205px; display: flex; zoom: 2; }
  .celda { display: flex; flex-direction: column; }
  .pantalla { position: relative; width: 844px; height: 390px; overflow: hidden; margin: 0 auto 20px; }
</style>
</head>
<body>
<template id="molde"><button class="tarjeta tarjeta--dud" type="button"><span class="tarjeta__cabeza"><span class="tarjeta__sello" data-caracter="{{caracter}}" aria-hidden="true"></span><span class="tarjeta__nombre">{{nombre}}</span><span class="tarjeta__caracter">{{caracter}}</span></span><span class="tarjeta__titulo">{{titulo}}</span><span class="tarjeta__motivo">{{motivo}}</span><span class="tarjeta__etiqueta">{{etiqueta}}</span></button></template>

<h1>B · Tablilla de cera — prueba</h1>

<h2>a) Tarjetas a su medida (205 × 78)</h2>
<div id="sueltas"></div>

<h2>a) Tarjetas a ×2</h2>
<div id="dobles"></div>

<h2>b) Pantalla de batalla 844 × 390</h2>
<div class="pantalla campo" id="pantalla">
  <div class="hud">
   <div class="hud-barra"><span class="hud-ronda">Ronda 1 · Plan</span><span class="hud-roma">Roma 700</span><div class="hud-fuerza"><i style="width:52%"></i></div><span class="hud-cart">636 Cartago</span><button class="hud-ala">Ala izq.</button><button class="hud-ala">Centro</button><button class="hud-ala">Ala der.</button></div>
   <div class="hud-objetivo">Cayo Flaminio: Adelantad el centro. Mira el plan sobre el campo y pulsa «Ver la ronda».</div>
   <div class="hud-gesto">La caballería enemiga busca tu flanco izquierdo…</div>
   <button class="hud-seguir">Seguir</button>
   <div class="hud-ordenes"><div class="hud-tarjetas" id="tarjetas-hud"></div><button class="hud-btn">A mano</button><button class="hud-btn hud-principal">Ver la ronda</button></div>
  </div>
</div>

<script>
  // Solo rellena muestras a partir del molde de tarjeta.html.
  const molde = document.getElementById('molde').innerHTML;
  const T = [
    { nombre: 'Quinto Fabio', caracter: 'Prudente', titulo: 'Cerrad filas y aguantad el choque', motivo: 'Que se estrellen contra los escudos.' },
    { nombre: 'Cayo Flaminio', caracter: 'Agresivo', titulo: 'Adelantad el centro', motivo: 'Su centro es lo más cercano.' },
    { nombre: 'Publio Cornelio', caracter: 'Astuto', titulo: 'La caballería rodea su flanco derecho', motivo: 'Los jinetes pueden rodearles.' },
  ];
  const MOD = [['fav', 'Favorable'], ['dud', 'Dudoso'], ['arr', 'Arriesgado']];
  function tarjeta(d, mod, etiqueta, sel) {
    const h = molde.replace(/\{\{(\w+)\}\}/g, (_, k) => k === 'etiqueta' ? etiqueta : d[k]);
    const t = document.createElement('div'); t.innerHTML = h;
    const b = t.firstElementChild;
    b.classList.replace('tarjeta--dud', 'tarjeta--' + mod);
    if (sel) b.classList.add('sel');
    return b;
  }
  function bloque(dest, fondo, clase, todas) {
    for (const sel of [false, true]) {
      const p = document.createElement('div'); p.className = 'panel ' + fondo;
      p.innerHTML = `<p class="rot">Sobre ${fondo === 'campo' ? 'campo' : 'noche'} · ${sel ? 'ELEGIDA (.sel)' : 'normal'}</p>`;
      const f = document.createElement('div'); f.className = 'fila';
      MOD.forEach(([m, e], i) => {
        const lista = todas ? T : [T[i]];
        for (const d of lista) {
          const c = document.createElement('div'); c.className = 'celda';
          c.innerHTML = `<p class="rot">tarjeta--${m}${sel ? ' sel' : ''} · ${d.caracter}</p>`;
          const caja = document.createElement('div'); caja.className = clase;
          caja.appendChild(tarjeta(d, m, e, sel)); c.appendChild(caja); f.appendChild(c);
        }
      });
      p.appendChild(f); dest.appendChild(p);
    }
  }
  const s = document.getElementById('sueltas');
  bloque(s, 'campo', 'caja', true); bloque(s, 'noche', 'caja', true);
  const d2 = document.getElementById('dobles');
  bloque(d2, 'campo', 'caja2', false); bloque(d2, 'noche', 'caja2', false);
  const hud = document.getElementById('tarjetas-hud');
  hud.appendChild(tarjeta(T[0], 'dud', 'Dudoso', false));
  hud.appendChild(tarjeta(T[1], 'arr', 'Arriesgado', true));
  hud.appendChild(tarjeta(T[2], 'arr', 'Arriesgado', false));
</script>
</body>
</html>
