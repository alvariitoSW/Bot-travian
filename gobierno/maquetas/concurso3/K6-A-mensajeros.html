<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Batalla · maqueta K6-A</title>
<style>
@font-face{font-family:"CinzelMq";src:url("../../../assets/fuentes/cinzel-700.woff2") format("woff2");font-weight:700;font-display:swap}
:root{
  --tierra:#d8c39a; --tierra-2:#a88d5c; --ocre:#e0a33a; --oliva:#6b7a3a;
  --rio:#7fa3ad; --rio-2:#4f7c8a; --tinta:#2b2118; --crema:#f4ead2;
  --romano:#9c3b26; --enemigo:#3f5566; --peligro:#c0392b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#15110c;font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif}
#stage{position:absolute;left:50%;top:50%;width:844px;height:390px;margin:-195px 0 0 -422px;overflow:hidden;background:var(--tierra);color:var(--tinta);transform-origin:50% 50%}
.top{position:absolute;left:0;top:0;width:844px;height:36px;background:var(--tinta);color:var(--crema);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:13px;z-index:2}
.top b{font-family:CinzelMq,Georgia,serif;font-size:14px;letter-spacing:.05em;font-weight:700}
.mapa{position:absolute;left:0;top:36px;width:844px;height:284px}
.mapa svg{display:block;width:844px;height:284px}
.pie{position:absolute;left:0;top:320px;width:844px;height:70px;background:var(--tinta);color:var(--crema);display:flex;align-items:center;gap:10px;padding:0 12px;z-index:2}
.btn{flex:none;width:124px;height:48px;border:0;border-radius:10px;background:var(--crema);color:var(--tinta);font:700 14px system-ui,Arial,sans-serif;cursor:pointer}
.btn.fuerte{background:var(--ocre)}
.btn:active{transform:translateY(1px)}
.centro{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.fila{display:flex;gap:6px;align-items:center;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;border:1px solid #6b5a3e;background:#3a2f22;font-size:13px;color:var(--crema)}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%}
.sw.ok{border:2px solid var(--oliva);background:var(--romano)}
.sw.tarda{border:2px dashed var(--ocre);background:var(--romano)}
.sw.peligro{background:var(--peligro)}
.aviso{font-size:14px;line-height:1.25;color:var(--crema)}
.pulso{animation:pulso 1s ease-in-out infinite}
@keyframes pulso{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<div id="stage">
  <div class="top">
    <div><b>AQVILA · Batalla</b> <span id="pant"></span></div>
    <span id="ronda"></span>
    <span id="obj"></span>
  </div>
  <div class="mapa">
    <svg id="mapa" viewBox="0 0 844 284" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9c3b26"/></marker>
        <marker id="fe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3f5566"/></marker>
      </defs>
    </svg>
  </div>
  <div class="pie">
    <button class="btn" id="izq"></button>
    <div class="centro">
      <div class="fila" id="fila"></div>
      <div class="aviso" id="aviso"></div>
    </div>
    <button class="btn" id="der"></button>
  </div>
</div>
<script>
(() => {
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('mapa');
const $ = s => document.querySelector(s);
function mk(tag, a, p) {
  const e = document.createElementNS(NS, tag);
  if (a) for (const k in a) e.setAttribute(k, a[k]);
  (p || svg).appendChild(e);
  return e;
}
const HALO = {fill:'#2b2118', 'paint-order':'stroke', stroke:'#d8c39a', 'stroke-width':4, 'stroke-linejoin':'round'};
function txt(x, y, s, o, p) {
  const e = mk('text', Object.assign({x, y, 'font-size':13, 'font-family':'system-ui,Arial,sans-serif', 'text-anchor':'middle'}, o || {}), p);
  e.textContent = s;
  return e;
}
function estrella(cx, cy, r1, r2, n) {
  let d = '';
  for (let i = 0; i < n * 2; i++) {
    const r = i % 2 ? r2 : r1, a = i * Math.PI / n;
    d += (i ? 'L' : 'M') + (cx + r * Math.cos(a)).toFixed(1) + ',' + (cy + r * Math.sin(a)).toFixed(1);
  }
  return d + 'Z';
}

/* ---------- terreno (fijo) ---------- */
const gT = mk('g'), gM = mk('g'), gR = mk('g'), gF = mk('g'), gJ = mk('g');
mk('rect', {x:0, y:0, width:844, height:284, fill:'#d8c39a'}, gT);
function colina(cx, cy, rx, ry, n) {
  for (let k = n; k >= 1; k--)
    mk('ellipse', {cx, cy, rx: rx * k / n, ry: ry * k / n, fill:'none', stroke:'#a88d5c', 'stroke-width':1.2, opacity:.8}, gT);
}
colina(120, 150, 120, 60, 6);
colina(700, 150, 110, 56, 5);
const RIO = 'M0,146 C150,138 250,178 380,164 S640,140 844,166';
mk('path', {d:RIO, fill:'none', stroke:'#4f7c8a', 'stroke-width':15, 'stroke-linecap':'round'}, gT);
mk('path', {d:RIO, fill:'none', stroke:'#7fa3ad', 'stroke-width':7, 'stroke-linecap':'round'}, gT);
[[170,150,'Vado I'], [430,164,'Vado II'], [700,146,'Vado III']].forEach(([x, y, s]) => {
  mk('rect', {x:x-13, y:y-3.5, width:26, height:7, fill:'#efe3c2', stroke:'#2b2118', 'stroke-width':.8}, gT);
  txt(x, y-12, s, HALO, gT);
});
[[828,92,15],[838,122,12],[824,146,11],[836,214,14]].forEach(([x, y, r]) =>
  mk('circle', {cx:x, cy:y, r, fill:'#6b7a3a', opacity:.9}, gT));
for (let i = 0; i < 4; i++)
  mk('line', {x1:8, y1:6 + i*6, x2:44, y2:6 + i*6, stroke:'#4f7c8a', 'stroke-width':1.5, 'stroke-dasharray':'5 4', opacity:.8}, gT);

/* ---------- datos ---------- */
const FILAS_N = [{y:196, t:'IIIIIIII'}, {y:226, t:'IILLLLCC'}, {y:252, t:'TTTTTC'}];
const FILAS_E = [{y:96, t:'IIIIIII'}, {y:66, t:'LLLIICC'}, {y:38, t:'TTTTTC'}];
function base() {
  const out = [], cnt = {};
  for (const [lado, filas] of [['n', FILAS_N], ['e', FILAS_E]])
    for (const f of filas) {
      const n = f.t.length;
      [...f.t].forEach((t, i) => {
        const k = lado + t;
        cnt[k] = (cnt[k] || 0) + 1;
        out.push({id:k + cnt[k], lab:t + cnt[k], t, lado, x:70 + i * 704 / (n - 1), y:f.y, est:'ok'});
      });
    }
  return out;
}
const LEY = '<span class="chip"><span class="sw ok"></span>obedece</span>' +
            '<span class="chip"><span class="sw tarda"></span>tarda: jinete en camino</span>' +
            '<span class="chip"><span class="sw peligro"></span>en peligro</span>';
const RES = '<span class="chip">En pie: 14 de 22</span><span class="chip">Enemigos: 9 de 20</span>' +
            '<span class="chip">Jinetes a tiempo: 17 de 19</span><span class="chip">Objetivo: no</span>';
const TX = {
  1: {pant:'1/4 · Despliegue', ronda:'Antes de la batalla', izq:'Colocar en fila', der:'Empezar batalla',
      aviso:'Toca un regimiento y luego un punto de tu zona. El enemigo está oculto hasta el choque.'},
  2: {pant:'2/4 · Pleno choque', ronda:'Ronda 3 · 0:42', izq:'Pausa', der:'Ejecutar ronda',
      aviso:'El jinete de I4 va en camino. Toca un regimiento y luego un punto del mapa para mandar otra orden.'},
  3: {pant:'3/4 · Carga por el flanco', ronda:'Ronda 5 · 1:18', izq:'Pausa', der:'Ejecutar ronda',
      aviso:'C1 carga contra los arqueros enemigos. Una carga enemiga llega a I8 por el flanco: en peligro.'},
  4: {pant:'4/4 · Retirada', ronda:'Fin · 2:31', izq:'Repetir batalla', der:'Ver las bajas',
      aviso:'Retirada ordenada: el general sale por el camino del sur con su escolta.'}
};

/* ---------- estado ---------- */
let P = 1, T = 0, vel = 1, sel = null, bajas = false, riders = [], F = [];
const G = {n:{x:422, y:274}, e:{x:422, y:12}};
const f_ = id => F.find(q => q.id === id);
function aviso(s) { $('#aviso').textContent = s; }
function jin(from, to, dur, lado, fin, tok) {
  riders.push({x0:from.x, y0:from.y, x1:to.x, y1:to.y, t0:T, dur, lado, fin, tok, marca:to.marca});
}
function setTexts() {
  const t = TX[P];
  $('#pant').textContent = t.pant;
  $('#ronda').textContent = t.ronda;
  $('#obj').textContent = P === 4 ? 'Objetivo: no logrado' : 'Objetivo: tomar la zona';
  $('#izq').textContent = t.izq;
  $('#der').textContent = P === 4 ? (bajas ? 'Ocultar bajas' : 'Ver las bajas') : t.der;
  $('#der').className = 'btn' + (P === 4 ? '' : ' fuerte');
  $('#fila').innerHTML = P === 4 ? RES : LEY;
  aviso(t.aviso);
}

/* ---------- pantallas ---------- */
function pon(p, guarda) {
  const prev = F;
  F = base();
  if (guarda && prev.length)
    F.forEach(f => { const q = prev.find(z => z.id === f.id); if (q && f.lado === 'n') { f.x = q.x; f.y = q.y; } });
  P = p; T = 0; vel = 1; sel = null; bajas = false; riders = [];
  G.n = {x:422, y:274};
  if (p === 1) F.forEach(f => { if (f.lado === 'e') f.est = 'oculto'; });
  if (p === 2) {
    f_('nI4').est = 'tarda';
    jin(G.n, f_('nI4'), 6000, 'n', () => { f_('nI4').est = 'ok'; aviso('I4 ya obedece. Toca un regimiento y luego un punto para mandar otra orden.'); }, 'nI4');
    f_('nT2').est = 'peligro';
    jin(G.e, f_('eL2'), 7000, 'e', () => {}, 'eL2');
  }
  if (p === 3) {
    f_('nI8').est = 'peligro';
    f_('nT4').est = 'peligro';
    f_('nC1').est = 'carga';
    jin(G.e, f_('eT3'), 5000, 'e', () => {}, 'eT3');
  }
  if (p === 4) {
    G.n = {x:34, y:268};
    ['nI7','nI8','nI9','nI10','nT2','nT4','nL2','nL3',
     'eI1','eI2','eI3','eI4','eI5','eI6','eT1','eT2','eL1','eL2','eC1'].forEach(i => f_(i).est = 'muerto');
  }
  marcas();
  setTexts();
  render();
  try { history.replaceState(null, '', '#' + p); } catch (e) {}
}
function burst(x, y, s) {
  mk('path', {d:estrella(x, y, 13, 6, 8), fill:'#a8432c', opacity:.9}, gM);
  txt(x + 20, y + 5, s, Object.assign({'text-anchor':'start'}, HALO), gM);
}
function marcas() {
  gM.replaceChildren();
  if (P === 1) {
    mk('rect', {x:20, y:150, width:804, height:126, rx:8, fill:'#6b7a3a', 'fill-opacity':.12, stroke:'#2b2118', 'stroke-opacity':.5, 'stroke-width':1.5, 'stroke-dasharray':'6 5'}, gM);
    txt(30, 168, 'Tu zona de despliegue', Object.assign({'text-anchor':'start'}, HALO), gM);
  }
  if (P === 2) { burst(270, 150, 'choque'); burst(572, 150, 'choque'); }
  if (P === 3) {
    mk('path', {d:'M672,212 L648,124', stroke:'#9c3b26', 'stroke-width':5, fill:'none', 'marker-end':'url(#fr)'}, gM);
    mk('path', {d:'M812,34 L812,170', stroke:'#3f5566', 'stroke-width':5, fill:'none', 'marker-end':'url(#fe)'}, gM);
    mk('path', {d:'M351,50 Q330,120 300,178', stroke:'#2b2118', 'stroke-width':2, 'stroke-dasharray':'2 5', fill:'none', 'marker-end':'url(#fe)'}, gM);
  }
  if (P === 4) {
    mk('path', {d:'M422,276 L60,280', stroke:'#2b2118', 'stroke-width':2, 'stroke-dasharray':'8 6', fill:'none'}, gM);
    txt(250, 268, 'Camino de retirada', HALO, gM);
  }
}

/* ---------- dibujo ---------- */
function ficha(f) {
  const ours = f.lado === 'n';
  const col = f.est === 'oculto' ? '#8c8577' : ours ? '#9c3b26' : '#3f5566';
  const W = 34, H = 24;
  const g = mk('g', {'data-id':f.id, opacity: f.est === 'muerto' ? .4 : 1}, gF);
  if (sel === f.id)
    mk('rect', {x:f.x-W/2-7, y:f.y-H/2-7, width:W+14, height:H+14, rx:7, fill:'none', stroke:'#fff', 'stroke-width':2, 'stroke-dasharray':'3 2'}, g);
  mk('rect', {x:f.x-W/2, y:f.y-H/2, width:W, height:H, rx:4, fill:col}, g);
  let st = null, sw = 3, dash = '', cls = '';
  if (f.est === 'ok' && ours) { st = '#6b7a3a'; sw = 1.5; }
  if (f.est === 'tarda') { st = '#e0a33a'; dash = '4 3'; }
  if (f.est === 'peligro') { st = '#c0392b'; cls = 'pulso'; }
  if (f.est === 'carga') { st = '#f4ead2'; }
  if (st) mk('rect', {x:f.x-W/2-3, y:f.y-H/2-3, width:W+6, height:H+6, rx:6, fill:'none', stroke:st, 'stroke-width':sw, 'stroke-dasharray':dash, class:cls}, g);
  txt(f.x, f.y + 5, f.est === 'oculto' ? '?' : f.lab, {fill:'#f4ead2', 'font-weight':700}, g);
  if (f.est === 'tarda' && ours) {
    const r = riders.find(q => q.tok === f.id);
    if (r) txt(f.x + 26, f.y + 5, Math.max(1, Math.ceil((r.t0 + r.dur - T) / 1000)) + ' s', {'text-anchor':'start', fill:'#2b2118', 'font-weight':700}, g);
  }
  mk('rect', {x:f.x-22, y:f.y-H/2-6, width:44, height:H+12, fill:'transparent'}, g);
}
function render() {
  gR.replaceChildren(); gF.replaceChildren(); gJ.replaceChildren();
  for (const r of riders) {
    mk('line', {x1:r.x0, y1:r.y0, x2:r.x1, y2:r.y1, stroke: r.lado === 'n' ? '#2b2118' : '#3f5566', 'stroke-width':1.5, 'stroke-dasharray':'3 4', opacity:.55}, gR);
    if (r.marca) mk('circle', {cx:r.x1, cy:r.y1, r:8, fill:'none', stroke:'#e0a33a', 'stroke-width':2.5, 'stroke-dasharray':'3 2'}, gR);
  }
  for (const f of F) {
    if (f.est === 'muerto' && !bajas) continue;
    ficha(f);
  }
  for (const k of ['n', 'e']) {
    const g = G[k];
    mk('rect', {x:-9, y:-9, width:18, height:18, fill:'#2b2118', stroke:'#f4ead2', 'stroke-width':1.5, transform:`translate(${g.x},${g.y}) rotate(45)`}, gJ);
    txt(g.x, g.y + 5, 'G', {fill:'#f4ead2', 'font-weight':700}, gJ);
  }
  for (const r of riders) {
    const p = Math.min(1, Math.max(0, (T - r.t0) / r.dur));
    mk('circle', {cx:r.x0 + (r.x1 - r.x0) * p, cy:r.y0 + (r.y1 - r.y0) * p, r:5.5,
      fill: r.lado === 'n' ? '#f4ead2' : '#9fb3bd', stroke:'#2b2118', 'stroke-width':1.5}, gJ);
  }
}

/* ---------- toques ---------- */
function pt(e) {
  const p = svg.createSVGPoint();
  p.x = e.clientX; p.y = e.clientY;
  const q = p.matrixTransform(svg.getScreenCTM().inverse());
  return {x:q.x, y:q.y};
}
svg.addEventListener('click', e => {
  const g = e.target.closest('[data-id]');
  if (g) {
    const f = f_(g.dataset.id);
    if (f && f.lado === 'n' && f.est !== 'muerto' && P !== 4) {
      sel = sel === f.id ? null : f.id;
      aviso(sel ? (P === 1 ? 'Toca un punto de tu zona para colocar a ' + f.lab + '.'
                           : 'Toca un punto del mapa para mandar el jinete de ' + f.lab + '.') : TX[P].aviso);
      render();
    }
    return;
  }
  if (!sel || P === 4) return;
  const f = f_(sel), q = pt(e);
  if (P === 1) {
    if (q.y < 150 || q.y > 276 || q.x < 20 || q.x > 824) { aviso('Esa parte no es tu zona. Toca dentro de la franja.'); return; }
    f.x = q.x; f.y = q.y; sel = null;
    aviso('Colocado. Toca otro regimiento o empieza la batalla.');
  } else {
    const m = {x:q.x, y:q.y, marca:true};
    f.est = 'tarda';
    jin(G.n, m, 4500, 'n', () => { f.x = m.x; f.y = m.y; f.est = 'ok'; aviso(f.lab + ' ya obedece en su nuevo sitio.'); }, f.id);
    aviso(f.lab + ': el jinete sale del general. Espera a que llegue.');
    sel = null;
  }
  render();
});
$('#izq').onclick = () => {
  if (P === 1) {
    const b = base();
    F.forEach(f => { if (f.lado === 'n') { const q = b.find(z => z.id === f.id); f.x = q.x; f.y = q.y; } });
    sel = null;
    aviso('Filas de nuevo. Toca un regimiento y luego un punto.');
  } else if (P === 4) {
    pon(1);
    return;
  } else {
    vel = vel ? 0 : 1;
    $('#izq').textContent = vel ? 'Pausa' : 'Seguir';
  }
  render();
};
$('#der').onclick = () => {
  if (P === 1) return pon(2, true);
  if (P === 2) return pon(3, true);
  if (P === 3) return pon(4, true);
  bajas = !bajas;
  $('#der').textContent = bajas ? 'Ocultar bajas' : 'Ver las bajas';
  render();
};

/* ---------- bucle ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(100, now - last);
  last = now;
  T += dt * vel;
  for (let i = riders.length - 1; i >= 0; i--) {
    const r = riders[i];
    if (T - r.t0 >= r.dur) { riders.splice(i, 1); if (r.fin) r.fin(); }
  }
  render();
  requestAnimationFrame(frame);
}
function desdeHash() {
  const n = parseInt(location.hash.slice(1), 10);
  pon(n >= 1 && n <= 4 ? n : 1);
}
function ajusta() {
  const s = Math.min(innerWidth / 844, innerHeight / 390);
  $('#stage').style.transform = `scale(${s})`;
}
addEventListener('hashchange', desdeHash);
addEventListener('resize', ajusta);
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && P < 4) location.hash = P + 1;
  if (e.key === 'ArrowLeft' && P > 1) location.hash = P - 1;
});
F = base();
desdeHash();
ajusta();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
