function montaRoma(z0,o){/* z0 = z de la línea de hastati */
 const R={};R.t=linea('tria',0,z0-24,4,24,o.nt||90,o.mor);R.p=linea('prin',0,z0-12,6,15,o.np||100,o.mor);R.h=linea('hast',0,z0,6,15,o.nh||110,o.mor);

function pt(e){const b=cv.getBoundingClientRect();return{x:(e.clientX-b.left)*W/b.width,y:(e.clientY-b.top)*H/b.height}}
function elige(px,py){let best=null,bz=1e9;
 for(const r of regs){if(r.dead||r.t==='ele'&&r.n<1)continue;const p=proj(r.x,r.z),k=p.k;const hw=Math.max(r.w*k/2,16)+6,top=p.y-(r.cav?3.4:r.t==='ele'?4.6:2.3)*k-(r.alt||0)*k-8,bot=p.y+(Math.ceil(r.d.fig/r.d.cols)*r.d.sp*k)/2+8;
  if(Math.abs(px-p.x)<hw&&py>top&&py<bot&&(r.s===0||true)){const dz=Math.abs(py-p.y);if(dz<bz-.1||dz===bz&&r.z<best.z){bz=dz;best=r}}}
 return best}
let lp=null;
cv.addEventListener('pointerdown',e=>{
 cv.setPointerCapture(e.pointerId);const p=pt(e);const r=elige(p.x,p.y);$('rueda').className='rueda';
 if(!r){drag=null;return}
 if(r.s===1){aviso(r.name+' · '+Math.round(r.n)+' hombres · moral '+Math.round(r.moral));return}
 const ya=sel.includes(r);if(!ya||sel.length<2)if(!ya)sel=[r];
 drag={reg:r,pts:[{x:r.x,z:r.z}],sx:p.x,sy:p.y,mov:0,ya,t:performance.now()};
 lp=setTimeout(()=>{if(drag&&!drag.mov){abreRueda(r);drag=null}},520);actualizaBotones()});
cv.addEventListener('pointermove',e=>{if(!drag)return;const p=pt(e);
 if(!drag.mov&&Math.hypot(p.x-drag.sx,p.y-drag.sy)<10)return;drag.mov=1;clearTimeout(lp);
 const g=unproj(p.x,p.y);if(!g)return;
 if(ESC[escena].deploy){const r=drag.reg;r.x=clamp(Math.round(g.x/2.5)*2.5,-85,85);r.z=clamp(Math.round(g.z/2)*2,-6,46);return}
 const L=drag.pts[drag.pts.length-1];if(Math.hypot(g.x-L.x,g.z-L.z)>2){drag.pts.push({x:g.x,z:g.z});drag.cls=clasifica(drag.reg,drag.pts)}});
cv.addEventListener('pointerup',e=>{clearTimeout(lp);if(!drag)return;const d=drag;drag=null;
 if(ESC[escena].deploy){if(d.mov)aviso(d.reg.name+' desplegado');else if(d.ya)abreRueda(d.reg);return}
 if(d.mov&&d.pts.length>3){const tipo=clasifica(d.reg,d.pts);const L=d.reg;const g=sel.includes(L)?sel:[L];
  ordena(g,tipo,d.pts.slice(1));aviso(NOM[tipo]+(g.length>1?' · '+g.length+' regimientos':''))}
 else if(!d.mov&&d.ya&&sel.length===1)abreRueda(d.reg);
 actualizaBotones()});
cv.addEventListener('pointercancel',()=>{clearTimeout(lp);drag=null});
document.querySelectorAll('.gr').forEach(b=>b.onclick=()=>{sel=grupo(b.dataset.g);$('rueda').className='rueda';if(sel.length){const L=sel[0];sel.sort((a,b)=>a.x-b.x);sel=[sel[Math.floor(sel.length/2)],...sel.filter((x,i)=>i!==Math.floor(sel.length/2))];tcx=sel[0].x*.5;aviso(sel.length+' regimientos: '+b.textContent)}actualizaBotones()});
$('rec').onclick=()=>{if(!sel.length){aviso('Toca un regimiento o un grupo');return}const rc=recomendada(sel[0]);aplica(rc);actualizaBotones()};
$('pau').onclick=()=>{paused=!paused;actualizaBotones()};
$('lis').onclick=abreLista;$('cerrar').onclick=()=>$('lista').className='';
$('ant').onclick=()=>cargaEscena((escena+4)%5);$('sig').onclick=()=>cargaEscena((escena+1)%5);
/* minimapa: tocar o arrastrar mueve la cámara */
const mm=$('mm');let mmd=0;
function mmMueve(e){const b=mm.getBoundingClientRect();const x=(e.clientX-b.left)/b.width,y=(e.clientY-b.top)/b.height;tcx=clamp(x*260-130,-70,90);tCZ=clamp((1-y)*190-40-52,-40,70)}
mm.addEventListener('pointerdown',e=>{mm.setPointerCapture(e.pointerId);mmd=1;mmMueve(e)});mm.addEventListener('pointermove',e=>{if(mmd)mmMueve(e)});mm.addEventListener('pointerup',()=>mmd=0);
/* ---------- bucle ---------- */
let last=0,ult=0;
function bucle(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;now=t/1000;
 if(!paused)paso(dt);
 camx+=(tcx-camx)*Math.min(1,dt*5);CZ+=(tCZ-CZ)*Math.min(1,dt*5);
 dibuja();
 if(t-ult>250){ult=t;let m=[0,0],n=[0,0],w=[0,0];for(const r of regs){if(r.dead)continue;m[r.s]+=r.moral*r.n;w[r.s]+=r.n}
  const mr=w[0]?m[0]/w[0]:0,mc=w[1]?m[1]/w[1]:0;$('mR').style.width=mr+'%';$('mC').style.width=mc+'%';$('nR').textContent=Math.round(mr);$('nC').textContent=Math.round(mc)}
 requestAnimationFrame(bucle)}
function ajusta(){const s=Math.min(innerWidth/W,innerHeight/H);const st=$('stage');st.style.transform='scale('+s+')';st.style.left=(innerWidth-W*s)/2+'px';st.style.top=(innerHeight-H*s)/2+'px'}
addEventListener('resize',ajusta);ajusta();
cargaEscena(+(location.hash.slice(1)||1)-1);requestAnimationFrame(bucle);
window.__esc=cargaEscena;
</script></body></html>
