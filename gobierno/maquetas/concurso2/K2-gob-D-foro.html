<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>El Foro vivo</title>
<style>
@font-face{font-family:Cinzel;font-weight:700;src:url(../../../assets/fuentes/cinzel-700.woff2) format("woff2")}
@font-face{font-family:Cinzel;font-weight:400;src:url(../../../assets/fuentes/cinzel-400.woff2) format("woff2")}
:root{--noche:#0b1016;--panel:#141b24;--rojo:#c0281f;--oro:#e9c063;--bronce:#b8862b;--marmol:#f1ead9;--piedra:#9aa6b4;--oliva:#8fae5a;--terra:#d9764a;--vino:#7a1f6b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#05080c;color:var(--marmol);font:14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{position:relative;width:390px;height:844px;overflow:hidden;background:var(--noche);display:flex;flex-direction:column}
.cz{font-family:Cinzel,Palatino,Georgia,serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
/* barra de recursos */
.hud{flex:none;height:54px;display:flex;align-items:center;gap:2px;padding:0 6px;background:linear-gradient(#1a222d,#0f151d);border-bottom:1px solid var(--bronce);box-shadow:0 1px 0 #000;z-index:5}
.hud .ciu{display:flex;align-items:center;gap:4px;min-width:64px;height:44px;padding:0 8px;border:1px solid var(--bronce);border-radius:6px;color:var(--oro);font-size:13px}
.res{flex:1;text-align:center;font-size:13px;font-weight:600;line-height:1.1}
.res svg{display:block;margin:0 auto 1px;width:18px;height:18px}
.res i{display:block;font-style:normal;font-size:13px;color:var(--oliva)}
.res i.m{color:var(--terra)}
svg.ic{fill:none;stroke:var(--bronce);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.on svg.ic,.oro svg.ic{stroke:var(--oro)}
/* pantallas */
.scr{display:none;flex:1;min-height:0;flex-direction:column;position:relative}
.scr.on{display:flex}
/* ventana de la ciudad real */
.ciudad{position:relative;flex:none;overflow:hidden;background:#cfc79d url(../fondo-ciudad.jpg) 0 -290px/390px auto no-repeat;border-bottom:2px solid var(--bronce)}
.ciudad::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(11,16,22,.55),transparent 22%,transparent 70%,rgba(11,16,22,.85));box-shadow:inset 0 0 40px rgba(11,16,22,.5)}
.ciudad.dia::after{background:linear-gradient(rgba(11,16,22,.45),transparent 25%,transparent 75%,rgba(11,16,22,.8))}
.nombre{position:absolute;left:10px;top:8px;z-index:3;font-size:13px;color:var(--oro);text-shadow:0 1px 3px #000}
.hot{position:absolute;z-index:4;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(11,16,22,.82);border:1.5px solid var(--oro);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px rgba(233,192,99,.18)}
.hot svg{width:24px;height:24px}
.hot.mal{border-color:var(--rojo);box-shadow:0 0 0 4px rgba(192,40,31,.3);animation:pulso 1.6s infinite}
.hot.mal svg.ic{stroke:#ff9a7a}
.hot.sel{background:var(--rojo);border-color:var(--oro)}
.hot.sel svg.ic{stroke:#fff}
@keyframes pulso{50%{box-shadow:0 0 0 9px rgba(192,40,31,0)}}
/* escena del foro */
.foro{position:relative;flex:none;overflow:hidden;background:#6c5c46}
.foro>svg.bg{position:absolute;left:0;top:0;width:390px;height:320px}
.cr{position:absolute;pointer-events:none}
.cr svg{position:absolute;overflow:visible}
.chip{position:absolute;z-index:6;transform:translateX(-50%);min-height:44px;min-width:76px;padding:3px 9px;border-radius:22px;background:rgba(11,16,22,.9);border:1.5px solid var(--bronce);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;white-space:nowrap}
.chip b{font-weight:700;font-size:14px}
.chip .pt{width:11px;height:11px;border-radius:50%;flex:none}
.chip.sel{border-color:var(--oro);background:#2a2110}
.chip.alerta{border-color:var(--rojo);animation:pulso 1.6s infinite}
.mur{position:absolute;z-index:5;transform:translateX(-50%);font-size:13px;color:var(--oro);text-shadow:0 1px 2px #000;white-space:nowrap;pointer-events:none}
/* panel inferior */
.hoja{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:10px 12px;background:linear-gradient(#141b24,#0d131a);position:relative}
.hoja::before{content:"";position:absolute;left:12px;right:12px;top:3px;height:6px;background:repeating-linear-gradient(90deg,var(--bronce) 0 6px,transparent 6px 8px,var(--bronce) 8px 10px,transparent 10px 16px);opacity:.35;-webkit-mask:linear-gradient(#000 0 1px,transparent 1px 2px,#000 2px 3px,transparent 3px);mask:linear-gradient(#000 0 1px,transparent 1px 2px,#000 2px 3px,transparent 3px)}
h2{font-family:Cinzel,Palatino,serif;font-size:15px;color:var(--oro);letter-spacing:.05em;text-transform:uppercase}
.sub{font-size:13px;color:var(--piedra)}
.btn{min-height:48px;padding:0 14px;border-radius:7px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.p{background:linear-gradient(#d3362b,#a31f17);border:1px solid var(--oro);color:#fff;box-shadow:0 2px 0 #000}
.btn.s{border:1px solid var(--bronce);color:var(--marmol);background:rgba(184,134,43,.08)}
.btn[disabled]{opacity:.45}
.fila{display:flex;gap:8px;align-items:center}
.fila>*{min-width:0}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:12px;font-size:13px;font-weight:600;border:1px solid #2c3744;background:#0b1016}
.pill.b{color:var(--oliva)}.pill.m{color:var(--terra)}.pill.r{color:#ff8b78;border-color:var(--rojo)}.pill.o{color:var(--oro)}
/* cenefa de ánimo */
.cenefa{display:flex;height:22px;border-radius:4px;overflow:hidden;border:1px solid var(--bronce)}
.cenefa i{display:block;height:100%;position:relative}
.cenefa i::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 2px,transparent 2px 8px)}
.leyenda{display:flex;justify-content:space-between;font-size:13px;color:var(--piedra)}
/* navegación */
.nav{flex:none;height:64px;display:flex;background:#0a0f15;border-top:1px solid var(--bronce);z-index:7}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;color:var(--piedra);position:relative;min-height:44px}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--oro);background:linear-gradient(rgba(233,192,99,.14),transparent)}
.nav button.on::before{content:"";position:absolute;top:0;left:20%;right:20%;height:2px;background:var(--oro)}
.nav .bd{position:absolute;top:5px;right:calc(50% - 25px);min-width:18px;height:18px;border-radius:9px;background:var(--rojo);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
/* obras */
.cuidades{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:none}
.cuidades button{flex:none;min-height:44px;padding:0 12px;border:1px solid #2c3744;border-radius:22px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.cuidades button.on{border-color:var(--oro);color:var(--oro);background:#2a2110}
.cats{display:flex;gap:6px;flex:none}
.cats button{flex:1;min-height:44px;border-bottom:2px solid #2c3744;font-size:13px;color:var(--piedra);font-weight:600}
.cats button.on{border-color:var(--oro);color:var(--oro)}
.rejilla{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;flex:none}
.tile{position:relative;height:56px;border:1px solid #2c3744;border-radius:6px;background:#0f161e;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;gap:1px}
.tile svg{width:24px;height:24px}
.tile em{font-style:normal;font-family:Cinzel,serif;font-size:13px;color:var(--oro);line-height:1}
.tile.sel{border-color:var(--oro);background:#2a2110}
.tile.sel svg.ic{stroke:var(--oro)}
.tile.cola::after{content:"";position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--oliva)}
.costes{display:flex;justify-content:space-between;gap:4px;flex:none}
.costes div{flex:1;text-align:center;font-size:13px;padding:5px 0;border:1px solid #2c3744;border-radius:6px;background:#0b1016}
.costes div svg{display:block;margin:0 auto 1px;width:18px;height:18px}
.costes .f{border-color:var(--terra);color:var(--terra)}
.efecto{display:flex;gap:6px;flex-wrap:wrap}
/* intriga */
.votos{display:flex;flex-wrap:wrap;gap:3px;flex:none}
.votos i{width:11px;height:11px;border-radius:50%;display:block}
.gestos{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}
.gesto{min-height:78px;border:1px solid #2c3744;border-radius:8px;padding:8px;text-align:left;background:#0f161e;display:flex;flex-direction:column;gap:3px;font-size:13px}
.gesto b{font-size:14px;display:flex;align-items:center;gap:6px}
.gesto svg{width:22px;height:22px;flex:none}
.gesto.sel{border-color:var(--oro);background:#2a2110}
.gesto.sel svg.ic{stroke:var(--oro)}
/* crisis */
.crisis{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:none}
.crisis button{flex:none;min-height:44px;padding:0 12px;border-radius:8px;border:1px solid #2c3744;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;background:#0f161e}
.crisis button.on{border-color:var(--rojo);background:#2a1210}
.crisis button.on svg.ic{stroke:#ff9a7a}
.llama{position:absolute;z-index:3;transform-origin:50% 100%;animation:llama .7s infinite alternate ease-in-out}
@keyframes llama{from{transform:scale(1,.9) rotate(-3deg)}to{transform:scale(.92,1.08) rotate(3deg)}}
.humo{position:absolute;z-index:2;width:90px;height:110px;border-radius:50%;background:radial-gradient(rgba(60,50,50,.7),transparent 70%);filter:blur(6px)}
/* provincias */
.seg{display:flex;flex:none;border:1px solid var(--bronce);border-radius:8px;overflow:hidden}
.seg button{flex:1;min-height:44px;font-size:14px;font-weight:700;color:var(--piedra)}
.seg button.on{background:rgba(233,192,99,.16);color:var(--oro)}
.mosaico{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;overflow-y:auto;padding-bottom:6px;align-content:start;flex:1;min-height:0}
.ficha{position:relative;border:1px solid #2c3744;border-radius:8px;padding:6px 6px 7px;background:linear-gradient(#18202a,#0f151c);display:flex;flex-direction:column;gap:3px;text-align:left;min-height:104px}
.ficha b{font-family:Cinzel,serif;font-size:13px;color:var(--marmol);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ficha .mini{display:flex;align-items:flex-end;justify-content:space-around;height:42px;border-radius:4px;background:linear-gradient(#3a3040,#6f5a45);padding:0 2px 2px}
.ficha .mini i{display:block;width:12px;border-radius:2px 2px 0 0}
.ficha .est{display:flex;gap:4px;font-size:13px;min-height:20px;align-items:center}
.ficha.rojo{border-color:var(--rojo)}
.ficha.oro{border-color:var(--oro)}
.ficha .ban{position:absolute;top:-1px;right:6px;width:14px;height:20px;border-radius:0 0 3px 3px}
.lista{display:flex;flex-direction:column;gap:5px;overflow-y:auto;flex:1;min-height:0}
.obra{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 8px;border:1px solid #2c3744;border-radius:6px;background:#0f161e;font-size:13px}
.obra svg{width:22px;height:22px;flex:none}
.obra .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obra .t b{font-weight:600}
.obra .bar{width:56px;height:6px;border-radius:3px;background:#27313d;overflow:hidden;flex:none}
.obra .bar i{display:block;height:100%;background:var(--oro)}
.obra.w .bar i{background:var(--piedra)}
.regla{font-size:13px;color:var(--piedra);border-left:2px solid var(--bronce);padding-left:8px;flex:none}
/* tribuna */
.vel{position:absolute;inset:0;background:rgba(5,8,12,.6);z-index:20;display:none}
.vel.on{display:block}
.tri{position:absolute;left:0;right:0;bottom:0;z-index:21;background:#141b24;border-top:2px solid var(--oro);padding:12px;display:none;flex-direction:column;gap:8px;border-radius:12px 12px 0 0}
.tri.on{display:flex}
.disc{display:flex;gap:10px;align-items:center;min-height:56px;padding:6px 10px;border:1px solid #2c3744;border-radius:8px;background:#0f161e;text-align:left;width:100%}
.disc svg{width:26px;height:26px;flex:none}
.disc b{display:block;font-size:14px}
.disc span{font-size:13px;color:var(--piedra)}
.disc .efecto{margin-top:3px}
.nota{position:absolute;left:0;right:0;top:54px;z-index:8;padding:8px 12px;font-size:13px;background:rgba(11,16,22,.9);border-bottom:1px solid var(--oro);color:var(--marmol);display:none}
.nota.on{display:block}
</style></head><body>
<div class="app" id="app">
  <div class="hud" id="hud"></div>
  <!-- 1 FORO -->
  <section class="scr" id="s1">
    <div class="ciudad" id="c1" style="height:196px"></div>
    <div class="foro" id="f1" style="height:300px"></div>
    <div class="hoja" id="h1"></div>
  </section>
  <!-- 2 OBRAS -->
  <section class="scr" id="s2">
    <div class="ciudad" id="c2" style="height:196px"></div>
    <div class="hoja" id="h2"></div>
  </section>
  <!-- 3 CORRILLO -->
  <section class="scr" id="s3">
    <div class="foro" id="f3" style="height:290px"></div>
    <div class="hoja" id="h3"></div>
  </section>
  <!-- 4 CRISIS -->
  <section class="scr" id="s4">
    <div class="foro" id="f4" style="height:250px"></div>
    <div class="hoja" id="h4"></div>
  </section>
  <!-- 5 PROVINCIAS -->
  <section class="scr" id="s5"><div class="hoja" id="h5" style="padding-top:12px"></div></section>
  <div class="nota" id="nota"></div>
  <div class="vel" id="vel"></div>
  <div class="tri" id="tri"></div>
  <nav class="nav" id="nav"></nav>
</div>
<script>
/* ============ DATOS (inspirados en js/data.js) ============ */
const IC={
madera:'<path d="M3 8c0-1.7 4-3 9-3s9 1.3 9 3-4 3-9 3-9-1.3-9-3zM3 8v8c0 1.7 4 3 9 3s9-1.3 9-3V8M12 8.2a1.2 .8 0 1 0 .01 0"/>',
piedra:'<path d="M3 9l4-4h10l4 4v9H3zM3 13h18M9 13v5M15 13v5M7 9h10"/>',
hierro:'<path d="M3 17l3-9h12l3 9zM8 12h8"/>',
grano:'<path d="M12 21V8M12 8c-2-1-3-3-3-5 2 0 3 2 3 5zm0 0c2-1 3-3 3-5-2 0-3 2-3 5zM12 14c-2-1-4-3-4-5 2 0 4 2 4 5zm0 0c2-1 4-3 4-5-2 0-4 2-4 5z"/>',
oro:'<circle cx="12" cy="12" r="9"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7"/>',
gente:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-4 2.5-6 6-6s6 2 6 6M16 5.5a3 3 0 0 1 0 5.5M18 14c2 .7 3 2.6 3 6"/>',
foro:'<path d="M3 9l9-5 9 5zM5 9v9M9.5 9v9M14.5 9v9M19 9v9M3 20h18"/>',
obra:'<path d="M14 6l4 4-9 9-4-4zM14 6l2-2 4 4-2 2M5 19l-2 2"/>',
corrillo:'<circle cx="7" cy="8" r="2.4"/><circle cx="17" cy="8" r="2.4"/><path d="M3 19c0-3 1.7-5 4-5s4 2 4 5M13 19c0-3 1.7-5 4-5s4 2 4 5M10 5l4 0"/>',
fuego:'<path d="M12 3c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z"/>',
mapa:'<path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14"/>',
templo:'<path d="M3 10l9-6 9 6zM5 10v8M9 10v8M15 10v8M19 10v8M3 20h18"/>',
arco:'<path d="M4 20V9a8 8 0 0 1 16 0v11M9 20v-7a3 3 0 0 1 6 0v7M2 20h20"/>',
acue:'<path d="M2 8h20M4 8v12M10 8v12M16 8v12M22 8v12M4 14a3 3 0 0 1 6 0M10 14a3 3 0 0 1 6 0M16 14a3 3 0 0 1 6 0"/>',
yunque:'<path d="M3 8h13c0 3-2 4-5 4v3h4v3H8v-3h2v-3C7 12 5 11 3 8zM16 8h5"/>',
casa:'<path d="M3 11l9-7 9 7M5 10v10h14V10M10 20v-5h4v5"/>',
anfora:'<path d="M9 3h6M10 3v3c-4 1-5 4-5 7 0 4 3 7 7 7s7-3 7-7c0-3-1-6-5-7V3M5 12H3M21 12h-2"/>',
balanza:'<path d="M12 4v16M6 20h12M4 8h16M4 8l-2 6a3 3 0 0 0 6 0zM20 8l-2 6a3 3 0 0 0 6 0z"/>',
caballo:'<path d="M5 20l2-6-3-3 5-5 3 1 4-3 1 4-3 3 2 9M9 12l4 1"/>',
espada:'<path d="M4 20l9-9M13 11l7-7v5l-4 4M6 18l-2 2M8 16l-3-3"/>',
muro:'<path d="M3 20V8h3v2h3V8h3v2h3V8h3v2h3V8h-0v12zM3 14h18"/>',
ancla:'<circle cx="12" cy="5" r="2"/><path d="M12 7v14M5 13c0 4 3 7 7 7s7-3 7-7M3 13h4M17 13h4M8 10h8"/>',
manos:'<path d="M3 13l5-5 4 2 4-3 5 5-6 6-3-1-3 1zM8 8l-3 3M16 7l3 3"/>',
voz:'<path d="M3 10v4h4l6 4V6L7 10zM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>',
bolsa:'<path d="M8 6h8l2 4c2 3 2 10-6 10S4 13 6 10zM10 6l-1-3h6l-1 3M12 11v6M10 13h3M10 16h3"/>',
ojo:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
espiga:'<path d="M12 21V6M12 6l-3-3M12 6l3-3M12 11l-4-3M12 11l4-3M12 16l-4-3M12 16l4-3"/>',
plaga:'<circle cx="12" cy="12" r="5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l3 3M16 16l3 3M19 5l-3 3M8 16l-3 3"/>',
agua:'<path d="M12 3c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11zM2 21c3-2 5 2 8 0s5 2 8 0 4-1 4-1"/>',
reloj:'<circle cx="12" cy="13" r="8"/><path d="M12 8v5l3 2M9 2h6"/>',
cola:'<path d="M4 6h16M4 12h16M4 18h10"/>',
ciudad:'<path d="M3 21V10l5-3v14M8 21V5l6-2v18M14 21v-9l7 2v7M3 21h18"/>'
};
const ico=(n,s=24,c='')=>`<svg class="ic ${c}" width="${s}" height="${s}" viewBox="0 0 24 24">${IC[n]||''}</svg>`;
const CL={
 pat:{n:'Patricios',c:'#efe6d2',t:'#7a1f6b',sk:'#e4b98f'},
 ple:{n:'Plebeyos',c:'#9a7650',t:'#5d4630',sk:'#d9a77c'},
 eq:{n:'Équites',c:'#e6dcc4',t:'#c0281f',sk:'#e0b088'},
 esc:{n:'Esclavos',c:'#80878d',t:'#5a6168',sk:'#c99a74'},
 sol:{n:'Soldados',c:'#b3342a',t:'#7b1d17',sk:'#dcaa80'}
};
const mCol=m=>m>=65?'#8fae5a':m>=40?'#e9c063':m>=20?'#d9764a':'#d22a1f';
const mTxt=m=>m>=65?'Contento':m>=40?'Inquieto':m>=20?'Enfadado':'Furioso';
/* figura humana de línea y color plano, con aura de ánimo */
function fig(c,m,s=1){
 const k=CL[c],up=m<40,a=mCol(m);
 let ex='',body=`<path d="M4 34L6 15Q10 12 14 15L16 34Z" fill="${k.c}" stroke="#0007" stroke-width=".7"/><path d="M7 15L13 34" stroke="${k.t}" stroke-width="${c=='pat'?2.4:1.4}"/>`;
