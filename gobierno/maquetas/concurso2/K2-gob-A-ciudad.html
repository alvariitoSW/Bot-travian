<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>AQVILA · Ciudad ilustrada</title>
<style>
@font-face{font-family:Cinzel;font-weight:700;src:url("../../../assets/fuentes/cinzel-700.woff2") format("woff2")}
@font-face{font-family:Cinzel;font-weight:400;src:url("../../../assets/fuentes/cinzel-400.woff2") format("woff2")}
:root{--noche:#17110d;--bronz:#3a2a1a;--rojo:#a8321f;--rojo2:#c0281f;--oro:#e9c063;--bronce:#b8862b;--marmol:#f1ead9;--papiro:#efe3c2;--papiro2:#e3d3a8;--tinta:#2b1d16;--tinta2:#6b5440;--oliva:#5f7d2e;--terra:#c4572b;--piedra:#9aa6b4;
--greca:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='8'><path d='M0 7.2h4.5V2.8h6.5v4.4h5' fill='none' stroke='%23b8862b' stroke-width='1.4'/></svg>");
--grano:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .2 0 0 0 0 .1 0 0 0 .16 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#0d0a08;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tinta)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cz{font-family:Cinzel,"Trajan Pro",Georgia,serif;font-weight:700;letter-spacing:.06em}
#app{position:relative;width:390px;height:844px;margin:0 auto;overflow:clip;background:#2a1f16;transform-origin:top center}
/* cielo y escena */
#cielo{position:absolute;inset:0 0 auto 0;height:260px;background:linear-gradient(#6d8197 0,#c8b78e 55%,#e6cf94 100%)}
#stage{position:absolute;left:0;top:66px;width:390px;height:460px;transition:transform .45s cubic-bezier(.3,.8,.3,1);-webkit-mask-image:linear-gradient(transparent 0,#000 16%,#000 90%,transparent);mask-image:linear-gradient(transparent 0,#000 16%,#000 90%,transparent)}
#stage.sube{transform:translateY(-58px)}
#stage img{width:390px;height:460px;display:block;filter:saturate(1.18) contrast(1.06) sepia(.12)}
#luz{position:absolute;inset:0;pointer-events:none;background:radial-gradient(90% 55% at 70% 20%,rgba(255,226,150,.34),transparent 70%),linear-gradient(transparent 60%,rgba(40,24,10,.3))}
#suelo{position:absolute;left:0;right:0;top:440px;bottom:0;background:linear-gradient(#7f783f,#6b6a36 25%,#3b4222 70%,#1c140d)}
#grano{position:absolute;inset:0;pointer-events:none;background:var(--grano);opacity:.5;mix-blend-mode:multiply;z-index:4}
#vig{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity .6s;background:radial-gradient(85% 60% at 50% 40%,transparent 45%,rgba(168,50,31,.6) 100%);animation:fl 1.3s infinite alternate}
#app.crisis #vig{opacity:1}
@keyframes fl{from{filter:brightness(.8)}to{filter:brightness(1.25)}}
/* HUD */
#hud{position:absolute;left:0;right:0;top:0;z-index:6;padding:8px 10px 0;background:linear-gradient(rgba(20,13,8,.92),rgba(20,13,8,.78) 70%,transparent)}
.h1{display:flex;align-items:center;justify-content:space-between;height:44px}
.ciu{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px 0 8px;border-radius:22px;background:linear-gradient(#5a3f22,#3a2a1a);border:1px solid var(--bronce);color:var(--oro);font-size:15px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.ciu small{font:400 13px system-ui;color:#d9c79c;letter-spacing:0}
.avs{position:relative;display:flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:22px;background:linear-gradient(#5a3f22,#3a2a1a);border:1px solid var(--bronce);color:var(--marmol);font-size:14px;font-weight:600}
.avs b{min-width:22px;height:22px;border-radius:11px;background:var(--terra);color:#fff;display:grid;place-items:center;font-size:13px}
#app.crisis .avs b{background:var(--rojo2);animation:pu 1s infinite alternate}
@keyframes pu{to{transform:scale(1.18)}}
.rec{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;height:34px;margin-top:2px}
.rec div{display:flex;align-items:center;justify-content:center;gap:3px;border-radius:17px;background:rgba(15,10,6,.55);color:var(--marmol);font-size:13px;font-weight:600;border:1px solid rgba(184,134,43,.35)}
.rec svg{width:18px;height:18px;color:var(--oro);stroke-width:2.1}
.rec .bajo{color:#f2a07a;border-color:var(--terra)}
.rec small{font-size:13px}
/* hotspots */
.hs{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;z-index:2;display:grid;place-items:center}
.hs .m{position:relative;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 28%,#fbf3da,#d9c38c 80%);border:2px solid var(--bronce);color:var(--tinta);box-shadow:0 3px 6px rgba(0,0,0,.5),inset 0 -2px 0 rgba(120,80,20,.25);transition:transform .2s}
.hs.sel .m{transform:scale(1.18);border-color:var(--oro);box-shadow:0 0 0 3px rgba(233,192,99,.55),0 4px 10px rgba(0,0,0,.6)}
.hs .m svg{width:22px;height:22px}
.hs .nv{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);min-width:24px;height:17px;padding:0 4px;border-radius:9px;background:var(--noche);color:var(--oro);font:700 13px/17px system-ui;text-align:center;border:1px solid var(--bronce)}
.hs .fl{position:absolute;right:-6px;top:-8px;width:21px;height:21px;border-radius:50%;display:grid;place-items:center;color:#fff;border:1.5px solid #fff3;background:var(--terra)}
.hs .fl svg{width:13px;height:13px;stroke-width:2.2}
.hs .fl.r{background:var(--rojo2);animation:pu .9s infinite alternate}
.hs .fl.o{background:var(--oliva)}
.hs.vacio .m{background:rgba(20,13,8,.45);border:2px dashed var(--oro);color:var(--oro);box-shadow:none}
.nombre{position:absolute;z-index:5;transform:translate(-50%,0);padding:3px 10px;border-radius:12px;background:var(--noche);color:var(--oro);font:700 13px Cinzel,serif;letter-spacing:.06em;white-space:nowrap;pointer-events:none;border:1px solid var(--bronce)}
.fuego{position:absolute;z-index:1;width:60px;height:70px;margin:-60px 0 0 -30px;pointer-events:none;display:none}
#app.crisis .fuego{display:block}
.fuego svg{width:100%;height:100%;overflow:visible}
.fuego .f{transform-origin:50% 100%;animation:fy .5s infinite alternate ease-in-out}
.fuego .f:nth-child(2){animation-delay:.18s}.fuego .f:nth-child(3){animation-delay:.3s}
@keyframes fy{from{transform:scale(.85,.9)}to{transform:scale(1.1,1.15) rotate(3deg)}}
.humo{position:absolute;z-index:1;width:44px;height:44px;border-radius:50%;background:radial-gradient(rgba(60,50,45,.7),transparent 70%);display:none;animation:hm 3s infinite}
#app.crisis .humo{display:block}
@keyframes hm{from{transform:translate(0,0) scale(.6);opacity:.9}to{transform:translate(12px,-50px) scale(1.6);opacity:0}}
/* consejo */
#estado{position:absolute;left:8px;right:8px;bottom:136px;z-index:7;display:none;gap:6px}#estado.on{display:flex}#estado button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:22px;background:rgba(20,13,8,.78);border:1px solid var(--bronce);color:var(--marmol);font-size:14px;font-weight:600}#estado svg{color:var(--oro);width:20px;height:20px}#estado small{font-size:13px;color:#d9c79c;font-weight:400}
#consejo{position:absolute;left:8px;right:8px;bottom:70px;z-index:7;display:none;align-items:center;gap:10px;min-height:56px;padding:6px 8px 6px 12px;border-radius:14px;background:linear-gradient(#f4ecd3,#e3d3a8);border:1.5px solid var(--bronce);box-shadow:0 6px 14px rgba(0,0,0,.45)}
#consejo.on{display:flex}
#consejo .t{flex:1;font-size:14px;line-height:1.25}
#consejo .t b{display:block;font:700 13px Cinzel,serif;letter-spacing:.06em;color:var(--rojo)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;font-size:15px;font-weight:700;background:linear-gradient(#c13c27,#8f2415);color:#fff4e0;border:1px solid #5a130a;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 4px rgba(0,0,0,.35)}
.btn.sec{background:linear-gradient(#f4ecd3,#d9c78f);color:var(--tinta);border:1px solid var(--bronce)}
.btn.off{filter:grayscale(.7);opacity:.6}
.btn svg{width:20px;height:20px}
/* tabs */
#tabs{position:absolute;left:0;right:0;bottom:0;height:64px;z-index:9;display:grid;grid-template-columns:repeat(3,1fr);background:linear-gradient(#3a2a1a,#17110d);border-top:2px solid var(--bronce);box-shadow:0 -6px 14px rgba(0,0,0,.4)}
#tabs button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#b9a67e;font:700 13px Cinzel,serif;letter-spacing:.06em}
#tabs button.on{color:var(--oro)}
#tabs button.on::before{content:"";position:absolute;top:-2px;left:22%;right:22%;height:3px;background:var(--oro);border-radius:0 0 3px 3px}
#tabs svg{width:26px;height:26px}
#tabs .pt{position:absolute;top:6px;left:calc(50% + 12px);min-width:20px;height:20px;border-radius:10px;background:var(--rojo2);color:#fff;font:700 13px/20px system-ui;text-align:center}
/* ficha inferior */
#sheet{position:absolute;left:6px;right:6px;bottom:70px;z-index:8;max-height:456px;overflow:auto;border-radius:16px 16px 12px 12px;background:var(--grano),linear-gradient(#f6eed6,#e9dab0);background-blend-mode:multiply;border:2px solid var(--bronce);box-shadow:0 -4px 22px rgba(0,0,0,.55),inset 0 0 0 1px #fff8;transform:translateY(120%);transition:transform .4s cubic-bezier(.3,.8,.3,1)}
#sheet.on{transform:none}
#sheet::-webkit-scrollbar{display:none}
.greca{height:8px;background:var(--greca) repeat-x;margin:0 14px}
.cab{display:flex;align-items:center;gap:10px;padding:10px 10px 6px 14px}
.cab .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 28%,#fff6dc,#d6bd80);border:2px solid var(--bronce);color:var(--rojo)}
.cab .ic svg{width:26px;height:26px}
.cab h2{margin:0;font:700 17px Cinzel,serif;letter-spacing:.05em;color:var(--tinta)}
.cab p{margin:1px 0 0;font-size:13px;color:var(--tinta2)}
.cab .x{margin-left:auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--tinta2)}
.cuerpo{padding:2px 14px 12px}
.efecto{display:flex;align-items:center;gap:10px;padding:8px 12px;margin:4px 0 8px;border-radius:10px;background:rgba(95,125,46,.14);border:1px solid rgba(95,125,46,.4);font-size:14px}
.efecto b{color:var(--oliva)}
.efecto .nv{font:700 15px Cinzel,serif;letter-spacing:.04em;white-space:nowrap}
.costes{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:10px}
.cos{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;border-radius:10px;background:#fff7;border:1px solid #b8862b88;font-size:13px;font-weight:700;line-height:1.15}
.cos svg{width:20px;height:20px;color:var(--bronce)}
.cos small{font-size:13px;font-weight:400;color:var(--tinta2)}
.cos.falta{background:rgba(196,87,43,.16);border-color:var(--terra);color:#8f2f0c}
.cos.falta svg{color:var(--terra)}
.fila{display:flex;gap:8px}
.fila .btn{flex:1}
.mismo{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;color:var(--tinta2)}
.chip{display:inline-flex;align-items:center;gap:5px;height:44px;padding:0 12px;border-radius:22px;border:1.5px solid var(--bronce);background:#fff8;font-size:14px;font-weight:600;color:var(--tinta);white-space:nowrap}
.chip.on{background:var(--noche);color:var(--oro);border-color:var(--noche)}
.chip.no{opacity:.5;border-style:dashed}
.chip svg{width:16px;height:16px}
.scrollx{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}
/* política */
.grupos{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:4px 0 8px}
.gr{padding:3px 3px 5px;border-radius:10px;background:#fff7;border:1px solid #b8862b66;text-align:center;font-size:13px;line-height:1.2}
.gr b{display:block;font:700 13px Cinzel,serif;letter-spacing:.03em}
.bar{height:7px;border-radius:4px;background:#0002;margin:4px 4px 0;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--oliva)}
.bar i.m{background:var(--terra)}.bar i.r{background:var(--rojo2)}
.carta{margin:2px 0 6px;padding:7px 12px;border-radius:10px;background:var(--tinta);color:var(--papiro);font-size:14px;line-height:1.35;border-left:4px solid var(--oro)}
.carta b{color:var(--oro)}
.op{position:relative;display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:6px 10px;margin-bottom:5px;border-radius:12px;background:#fff8;border:1.5px solid #b8862b99;text-align:left}
.op .sl{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--papiro2);border:1.5px solid var(--bronce);color:var(--rojo)}
.op .tx{flex:1;font-size:14px;line-height:1.25}.op .tx b{display:block;font-size:15px}
.op.rec2{border-color:var(--oro);box-shadow:0 0 0 2px var(--oro)}
.op.sel{background:var(--noche);color:var(--papiro);border-color:var(--noche)}
.op.sel .sl{background:var(--oro);color:var(--noche)}
.ds{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.d{display:inline-flex;align-items:center;gap:2px;padding:1px 7px 1px 4px;border-radius:9px;font-size:13px;font-weight:700;background:#0001}
.d svg{width:13px;height:13px;stroke-width:2.4}
.d.up{color:#3f6a12}.d.dn{color:#a3300f}
.op.sel .d.up{color:#b5dc7d}.op.sel .d.dn{color:#ffa98a}
.reco{position:absolute;right:10px;top:-10px;padding:1px 8px;border-radius:9px;background:var(--oro);color:var(--noche);font:700 13px Cinzel,serif;letter-spacing:.04em;vertical-align:1px}
/* crisis */
.gravedad{display:flex;align-items:center;gap:10px;margin:2px 0 8px}
.gravedad .bar{flex:1;height:12px;margin:0}
.gravedad span{font-size:13px;font-weight:700;white-space:nowrap}
.otros{display:flex;align-items:center;gap:8px;margin-top:6px;min-height:44px;padding:0 10px;border-radius:10px;background:rgba(0,0,0,.07);font-size:14px;width:100%}
.otros .pt{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--terra);color:#fff}
.otros .pt svg{width:16px;height:16px}
.otros .pt.r{background:var(--rojo2)}
/* panel imperio */
#imp{position:absolute;inset:0;z-index:5;background:var(--grano),linear-gradient(#e9dab0,#d8c48f);background-blend-mode:multiply;display:none;padding-top:92px;padding-bottom:64px;flex-direction:column}

.banda::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(20,13,8,.0),rgba(20,13,8,.45))}
.banda span{position:absolute;left:14px;bottom:8px;z-index:2;color:var(--marmol);font:700 13px Cinzel,serif;letter-spacing:.3em;text-shadow:0 1px 3px #000}
.banda em{position:absolute;right:12px;bottom:8px;z-index:2;color:var(--oro);font:700 14px Cinzel,serif;font-style:normal;text-shadow:0 1px 3px #000}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:8px 10px 4px;border:1.5px solid var(--bronce);border-radius:12px;overflow:hidden;flex:none}
.seg button{height:44px;font:700 13px Cinzel,serif;letter-spacing:.05em;background:#fff6;color:var(--tinta)}
.seg button.on{background:var(--noche);color:var(--oro)}
.filtros{padding:2px 10px 4px;flex:none}
.lista{flex:1;overflow:auto;padding:4px 10px 12px;scrollbar-width:none}
.lista::-webkit-scrollbar{display:none}
.cuad{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cd{position:relative;min-height:112px;border-radius:12px;overflow:hidden;background:#fff8;border:1.5px solid #b8862b99;text-align:left;display:flex;flex-direction:column;box-shadow:0 2px 5px rgba(60,40,10,.25)}

.cd .ban{position:absolute;top:0;left:10px;width:14px;height:30px;background:var(--c);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);z-index:2;box-shadow:0 2px 3px rgba(0,0,0,.4)}
.cd .in{padding:4px 8px 6px;flex:1;display:flex;flex-direction:column;gap:2px}
.cd h3{margin:0;font:700 14px Cinzel,serif;letter-spacing:.04em;color:var(--tinta)}
.cd .l2{display:flex;gap:8px;font-size:13px;color:var(--tinta2);align-items:center}
.cd .l2 span{display:flex;align-items:center;gap:2px}.cd .l2 svg{width:14px;height:14px}
.cd .av{display:flex;gap:4px;margin-top:auto;min-height:22px;align-items:center}
.cd .av i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--terra);color:#fff;font-style:normal}
.cd .av i.r{background:var(--rojo2)}.cd .av i.o{background:var(--oliva)}.cd .av i.g{background:var(--noche);color:var(--oro)}
.cd .av svg{width:13px;height:13px;stroke-width:2.2}
.cd .av em{font-size:13px;color:var(--oliva);font-style:normal;font-weight:700}
.cd.hot{border-color:var(--rojo2);box-shadow:0 0 0 2px rgba(192,40,31,.4)}
.cd.hot .vista{filter:sepia(.6) saturate(2) hue-rotate(-25deg) brightness(.85)}
.cd.fantasma{border-style:dashed;background:transparent;align-items:center;justify-content:center;color:var(--tinta2);font-size:14px;text-align:center;box-shadow:none}
.resumen{display:flex;justify-content:space-between;gap:6px;padding:6px 12px;margin:0 0 8px;border-radius:10px;background:var(--noche);color:var(--marmol);font-size:13px}
.resumen b{color:var(--oro)}
.leyenda{margin-top:8px;font-size:13px;color:var(--tinta2);text-align:center}
.gh{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 10px;margin-top:6px;border-radius:10px 10px 0 0;background:var(--bronz);color:var(--oro);font:700 14px Cinzel,serif;letter-spacing:.05em;width:100%}
.gh small{font:400 13px system-ui;color:#d9c79c}
.ob{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 10px;background:#fff8;border:1px solid #b8862b66;border-top:0;width:100%;text-align:left}
.ob .sl{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;background:var(--papiro2);border:1px solid var(--bronce);color:var(--rojo);flex:none}
.ob .tx{flex:1;font-size:14px;line-height:1.2}.ob .tx b{display:block}
.ob .pr{height:6px;border-radius:3px;background:#0002;margin-top:5px;overflow:hidden}.ob .pr i{display:block;height:100%;background:var(--bronce)}
.ob .tm{font-size:13px;font-weight:700;color:var(--tinta2);white-space:nowrap}
.ob.cola .sl{color:var(--tinta2);opacity:.7}
.ob:last-child{border-radius:0 0 10px 10px}
.fin{padding:12px;text-align:center;font-size:13px;color:var(--tinta2)}
.menu{position:absolute;left:10px;top:64px;z-index:20;width:230px;border-radius:12px;background:var(--noche);border:1.5px solid var(--bronce);padding:6px;display:none;box-shadow:0 10px 24px #000a}
.menu.on{display:block}
.menu button{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:0 10px;border-radius:8px;color:var(--marmol);font-size:15px;text-align:left}
.menu button.on{background:#ffffff14;color:var(--oro)}
.menu button small{margin-left:auto;font-size:13px;color:#b9a67e}
.sol{position:absolute;left:0;right:0;bottom:0}

function pintaHS(){$('#hs').innerHTML=Object.entries(BARRIOS).map(([k,b])=>{const fl=b.al==='o'?`<span class="fl o">${ic('martillo')}</span>`:b.al==='f'?`<span class="fl">${ic('alerta')}</span>`:'';
 const fu=(k==='insulas'&&ST.crisis&&ST.ciudad==='Roma')?`<span class="fl r">${ic('fuego')}</span>`:'';
 return `<button class="hs ${b.vacio?'vacio':''} ${ST.sel===k?'sel':''}" style="left:${b.x}px;top:${b.y}px" data-b="${k}" aria-label="${b.n}"><span class="m">${ic(b.vacio?'mas':b.i)}${b.vacio?'':`<span class="nv">${b.nv}</span>`}${fu||fl}</span></button>`}).join('')
 +`<div class="fuego" style="left:216px;top:236px"><svg viewBox="0 0 40 60"><use class="f" href="#llama"/><use class="f" href="#llama" x="-9" y="14" width="26" height="40"/><use class="f" href="#llama" x="20" y="16" width="24" height="38"/></svg></div><div class="humo" style="left:196px;top:170px"></div><div class="humo" style="left:222px;top:176px;animation-delay:1.4s"></div>`
 +(ST.sel&&!(ST.crisis&&ST.sel==='insulas')?`<div class="nombre" style="left:${BARRIOS[ST.sel].x}px;top:${BARRIOS[ST.sel].y-48}px">${BARRIOS[ST.sel].n.toUpperCase()}</div>`:'');}
/* ---- fichas ---- */
function cosCh(c,mult=1){return `<div class="costes" style="grid-template-columns:repeat(${Object.values(c).filter(v=>v).length},1fr)">`+Object.entries(c).filter(([r,v])=>v).map(([r,v])=>{v=Math.round(v*mult);const falta=HAVE[r]<v;return `<div class="cos ${falta?'falta':''}">${ic(r)}<span>${v}</span><small>de ${HAVE[r]}</small></div>`}).join('')+`</div>`}
function fichaBarrio(k){const b=BARRIOS[k],m=b.nv+1>3?1.6:1.3,need=Object.entries(b.c).filter(([r,v])=>HAVE[r]<Math.round(v*m));
 const falta=need.length?need[0]:null,otras=['Capua','Tarentum','Messana'];
 return `<div class="greca"></div><div class="cab"><div class="ic">${ic(b.i)}</div><div><h2>${b.n.toUpperCase()}</h2><p>${ST.ciudad} · ${b.vacio?'solar libre':'nivel '+b.nv}</p></div><button class="x" data-x aria-label="Cerrar">${ic('cruz')}</button></div>
 <div class="cuerpo"><div class="efecto"><span class="nv">${b.vacio?'NUEVO':'NV '+b.nv+' → '+(b.nv+1)}</span><span><b>${b.ef2}</b>${b.vacio?' · <span style="font-size:13px">'+b.ef+'</span>':''}</span></div>
 ${cosCh(b.c,m)}
 <div class="fila">${falta?`<button class="btn sec" data-cambio>${ic('mercado')}Cambiar ${Math.round(falta[1]*m)-HAVE[falta[0]]} de ${falta[0]}</button>`:`<button class="btn" data-obra>${ic('martillo')}${b.vacio?'Construir':'Mejorar'} · ${b.t}</button>`}</div>
 <div class="mismo">${ic('mundo','')}<span>Hacer lo mismo en:</span></div><div class="scrollx" style="margin-top:4px">${otras.map((c,i)=>`<button class="chip ${i<2?'on':'no'}" data-co>${ic(i<2?'ok':'cruz')}${c}</button>`).join('')}<button class="chip">+ 9 más</button></div></div>`}
function fichaIntriga(){return `<div class="greca"></div><div class="cab"><div class="ic">${ic('pergamino')}</div><div><h2>INTRIGA EN EL SENADO</h2><p>Quintilis 215 a.C. · 4 asuntos abiertos</p></div><button class="x" data-x aria-label="Cerrar">${ic('cruz')}</button></div>
 <div class="cuerpo"><div class="grupos">${[['Patricios',64,''],['Plebe',41,'m'],['Équites',55,''],['Senado',72,'']].map(([n,v,c])=>`<div class="gr"><b>${n}</b>${v}<div class="bar"><i class="${c}" style="width:${v}%"></i></div></div>`).join('')}</div>
 <div class="carta"><b>Tribunos:</b> acusan a tu cuestor del botín de Capua.</div>
 ${[['defensa','escudo','Defenderlo en el Senado','',[['up','Équites +8'],['dn','Plebe −6'],['dn','−40 oro']],1],['juicio','foro','Dejar que lo juzguen','',[['up','Plebe +10'],['dn','Équites −8']],0],['soborno','oro','Comprar a un tribuno','',[['up','Senado +6'],['dn','−120 oro'],['dn','Riesgo 35 %']],0]].map(([id,i,t,s,ds,r])=>`<button class="op ${r?'rec2':''} ${ST.op===id?'sel':''}" data-op="${id}"><span class="sl">${ic(i)}</span><span class="tx"><b>${t}</b><span class="ds">${r?'<span class="reco">Aconsejada</span>':''}${ds.map(([u,x])=>`<span class="d ${u}">${ic(u==='up'?'arriba':'abajo')}${x}</span>`).join('')}</span></span></button>`).join('')}
 <div class="fila" style="margin-top:2px"><button class="btn sec" style="flex:0 0 auto">Aplazar</button><button class="btn ${ST.op?'':'off'}" data-dec>${ic('ok')}${ST.op?{defensa:'Defender al cuestor',juicio:'Dejar el juicio',soborno:'Pagar al tribuno'}[ST.op]:'Elige una opción'}</button></div></div>`}
function fichaCrisis(){const a=ST.ac,out=ST.apagado;
 return `<div class="greca"></div><div class="cab"><div class="ic" style="color:var(--rojo2)">${ic('fuego')}</div><div><h2>INCENDIO · ÍNSULAS</h2><p>Roma · se propaga en 2 días</p></div><button class="x" data-x aria-label="Cerrar">${ic('cruz')}</button></div>
 <div class="cuerpo"><div class="gravedad"><span style="color:var(--rojo2)">Fuego ${out?18:62} %</span><div class="bar"><i class="${out?'m':'r'}" style="width:${out?18:62}%"></i></div><span>−40 pob. si no actúas</span></div>
 ${[['vig','escudo','Enviar a los vigiles','Apaga el 70 %',[['dn','−60 oro']],1],['corta','martillo','Abrir cortafuegos','Detiene el fuego',[['dn','−26 población']],0],['rez','templo','Ofrenda a Vulcano','No es seguro',[['dn','−50 oro'],['up','Plebe +4']],0]].map(([id,i,t,s,ds,r])=>`<button class="op ${r?'rec2':''} ${a===id?'sel':''}" data-ac="${id}"><span class="sl">${ic(i)}</span><span class="tx"><b>${t}</b><span class="ds">${r?'<span class="reco">Aconsejada</span>':''}<span class="d up">${s}</span>${ds.map(([u,x])=>`<span class="d ${u}">${ic(u==='up'?'arriba':'abajo')}${x}</span>`).join('')}</span></span></button>`).join('')}
 <button class="btn ${a?'':'off'}" style="width:100%" data-ord>${ic('ok')}${out?'Vigiles en marcha':a?'Ordenar ahora':'Elige una acción'}</button>
 <button class="otros" data-avs><span class="pt r">${ic('plaga')}</span><span class="pt">${ic('hambre')}</span><span class="pt">${ic('ola')}</span><span style="flex:1;text-align:left">Otros 4 avisos en el imperio</span>${ic('der')}</button></div>`}
const AVISOS=[['fuego','Incendio en las Ínsulas','Roma',3],['antorcha','Revuelta: felicidad 22','Syracusae',3],['plaga','Plaga en los barrios bajos','Capua',2],['hambre','Hambruna: grano para 6 días','Tarentum',2],['ola','Inundación del río','Messana',1],['alerta','Falta hierro para la obra','Roma',1],['martillo','Obra terminada: Almacén 2','Roma',0]];
function fichaAvisos(){return `<div class="greca"></div><div class="cab"><div class="ic">${ic('alerta')}</div><div><h2>AVISOS</h2><p>Ordenados por gravedad</p></div><button class="x" data-x aria-label="Cerrar">${ic('cruz')}</button></div><div class="cuerpo">${AVISOS.map(([i,t,c,g])=>`<button class="ob" style="border-top:1px solid #b8862b66;border-radius:8px;margin-bottom:5px" data-av="${c}"><span class="sl" style="${g>=3?'background:var(--rojo2);color:#fff;border-color:#5a130a':g==2?'background:var(--terra);color:#fff':''}">${ic(i)}</span><span class="tx"><b>${t}</b>${c}</span>${ic('der')}</button>`).join('')}</div>`}
function pintaSheet(){const s=ST.sheet,e=$('#sheet');
 e.innerHTML=!s?'':s==='intriga'?fichaIntriga():s==='crisis'?fichaCrisis():s==='avisos'?fichaAvisos():fichaBarrio(s);
 e.classList.toggle('on',!!s);$('#stage').classList.toggle('sube',!!s&&ST.tab!=='imp');
 const c=$('#consejo');c.classList.toggle('on',!s&&ST.tab==='ciudad');const es=$('#estado');es.classList.toggle('on',!s&&ST.tab==='ciudad');es.innerHTML=`<button>${ic('pop')}289<small>/410</small></button><button>${ic('feliz')}${ST.crisis?'54':'60'}<small>ánimo</small></button><button>${ic('oro')}Impuestos<small>normales</small></button>`;
 c.innerHTML=ST.crisis&&ST.ciudad==='Roma'?`<span style="color:var(--rojo2)">${ic('fuego')}</span><div class="t"><b>INCENDIO EN LAS ÍNSULAS</b>Se extiende. Actúa ya.</div><button class="btn" data-crisis>Atender</button>`:`<span style="color:var(--bronce)">${ic('almacen')}</span><div class="t"><b>CONSEJO</b>Tu grano llega al 91 %. Amplía el Almacén.</div><button class="btn" data-b2="almacen">Ver obra</button>`;}
/* ---- imperio ---- */
const CITY=[['Roma','#a8321f',289,60,['fuego','alerta'],2,0],['Capua','#a8321f',174,48,['plaga'],1,0],['Volsinii','#6e5a8a',96,66,[],0,1],['Tarentum','#2f5d8c',138,52,['hambre'],2,0],['Messana','#2f5d8c',88,57,['ola'],1,0],['Syracusae','#2f5d8c',240,22,['antorcha','fuego'],3,0],['Agrigentum','#2f5d8c',120,64,[],1,1],['Panormus','#7b2f6e',105,61,[],1,0],['Lilybaeum','#7b2f6e',160,58,['alerta'],1,0],['Carales','#7b2f6e',70,70,[],0,1],['Emporion','#2f5d8c',64,73,[],1,1],['Saguntum','#b0802a',110,55,[],1,0]];
const OBRAS=[['Roma',[['granja','Granja 3 → 4',72,'1 d 8 h'],['almacen','Almacén 2',35,'1 d 20 h'],['insulas','Ínsulas 2 → 3',10,'2 d 2 h',1]]],['Capua',[['cuartel','Cuartel 1 → 2',88,'8 h'],['granja','Granja 2 → 3',40,'1 d 2 h']]],['Tarentum',[['puerto','Puerto 2',55,'1 d 10 h'],['almacen','Almacén 1',5,'2 d 6 h',1]]],['Syracusae',[['templo','Templo 1 → 2',60,'20 h'],['cuartel','Cuartel 3 → 4',22,'2 d 1 h'],['mercado','Mercado 1 → 2',0,'2 d 8 h',1]]],['Messana',[['insulas','Ínsulas 1 → 2',30,'1 d 15 h']]],['Panormus',[['puerto','Puerto 1 → 2',90,'6 h'],['foro','Foro 2 → 3',48,'1 d 12 h']]]];
function cd(c,i){const [n,col,p,f,av,ob,v]=c;return `<button class="cd ${av.includes('fuego')||av.includes('antorcha')?'hot':''}" data-c="${n}"><span class="ban" style="--c:${col}"></span><div class="vista" style="background-position:${-30-(i*41)%150}px ${-150-(i*29)%80}px"></div><div class="in"><h3>${n}</h3><div class="l2"><span>${ic('pop')}${p}</span><span>${ic('feliz')}${f}</span></div><div class="av">${av.slice(0,2).map((a,j)=>`<i class="${a==='fuego'||a==='antorcha'?'r':''}">${ic(a)}</i>`).join('')}${av.length>2?'<i class="g">+'+(av.length-2)+'</i>':''}${ob?`<i class="g">${ic('martillo')}</i><em>${ob}</em>`:''}${!av.length&&!ob?'<em>En paz</em>':''}</div></div></button>`}
function pintaImp(){const e=$('#imp'),F=ST.filtro,s=ST.imp;
 let h=`<div class="banda"><span>MARE NOSTRVM</span><em>12 ciudades · 18 en total</em></div><div class="seg">${[['ciudades','Ciudades'],['obras','Obras'],['avisos','Avisos']].map(([k,t])=>`<button class="${s===k?'on':''}" data-s="${k}">${t}</button>`).join('')}</div>`;
 if(s==='ciudades'){h+=`<div class="filtros scrollx">${[['todas','Todas 12'],['avisos','Con avisos 8'],['obras','Con obras 9'],['paz','En paz 4']].map(([k,t])=>`<button class="chip ${F===k?'on':''}" data-f="${k}">${t}</button>`).join('')}</div><div class="lista"><div class="resumen"><span>${ic('pop','')}<b> 1.884</b></span><span>${ic('oro')}<b> +318</b>/mes</span><span>${ic('martillo')}<b> 14</b> obras</span></div><div class="cuad">`
  +CITY.map((c,i)=>[c,i]).filter(([c])=>F==='todas'||(F==='avisos'&&c[4].length)||(F==='obras'&&c[5])||(F==='paz'&&!c[4].length)).map(([c,i])=>cd(c,i)).join('')+`<div class="cd fantasma">6 ciudades más<br>por conquistar</div></div><div class="leyenda">Estandarte = cultura de origen</div></div>`;}
 else if(s==='obras'){h+=`<div class="filtros scrollx"><button class="chip on">Por tiempo</button><button class="chip">Por ciudad</button><button class="chip">${ic('almacen')}En cola 4</button></div><div class="lista">`+OBRAS.map(([c,o])=>`<button class="gh" style="margin-top:8px"><span>${c.toUpperCase()}</span><small>${o.length} obras</small></button>`+o.map(([i,t,p,tm,q])=>`<button class="ob ${q?'cola':''}"><span class="sl">${ic(i)}</span><span class="tx"><b>${t}</b>${q?'<span style="color:var(--tinta2);font-size:13px">En cola</span>':'<div class="pr"><i style="width:'+p+'%"></i></div>'}</span><span class="tm">${tm}</span></button>`).join('')).join('')+`<div class="fin">14 obras en 9 ciudades · 3 en cola</div></div>`;}
 else{h+=`<div class="filtros scrollx"><button class="chip on">Gravedad</button><button class="chip">Ciudad</button></div><div class="lista">`+AVISOS.map(([i,t,c,g])=>`<button class="ob" style="border-top:1px solid #b8862b66;border-radius:8px;margin-bottom:5px" data-c="${c}"><span class="sl" style="${g>=3?'background:var(--rojo2);color:#fff;border-color:#5a130a':g==2?'background:var(--terra);color:#fff':''}">${ic(i)}</span><span class="tx"><b>${t}</b>${c}</span>${ic('der')}</button>`).join('')+`</div>`;}
 e.innerHTML=h;}
/* ---- control ---- */
function ir(t){ST.tab=t;ST.sheet=null;ST.sel=null;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
 $('#imp').classList.toggle('on',t==='imp');if(t==='imp')pintaImp();
 if(t==='gob'){ST.tab='ciudad';ST.sheet='intriga';document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==='gob'));}
 todo();}
function todo(){hud();pintaHS();pintaSheet();}
document.addEventListener('click',ev=>{const t=ev.target.closest('button,[data-b]');if(!t)return;
 if(t.id==='bciu'){const m=$('#menu');m.innerHTML=['Roma','Capua','Tarentum','Messana'].map(c=>`<button class="${c===ST.ciudad?'on':''}" data-pick="${c}">${ic('templo')}${c}<small>${c==='Roma'?'289/410':'…'}</small></button>`).join('')+`<button data-imp>${ic('mundo')}Todas las ciudades (12)</button>`;m.classList.toggle('on');return}
 $('#menu').classList.remove('on');
 const d=t.dataset;
 if(d.pick){ST.ciudad=d.pick;todo();return}
 if(d.imp!==undefined){ir('imp');return}
 if(d.t){ir(d.t);return}
 if(d.b||d.b2){const k=d.b||d.b2;ST.sel=k;ST.sheet=k;todo();return}
 if(d.x!==undefined){ST.sheet=null;ST.sel=null;if(ST.tab==='ciudad')document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==='ciudad'));todo();return}
 if(d.op){ST.op=d.op;pintaSheet();return}
 if(d.ac){ST.ac=d.ac;pintaSheet();return}
 if(d.ord!==undefined&&ST.ac){ST.apagado=1;pintaSheet();return}
 if(d.crisis!==undefined){ST.sheet='crisis';ST.sel='insulas';todo();return}
 if(t.id==='bavs'||d.avs!==undefined){ST.sheet='avisos';ST.sel=null;todo();return}
 if(d.av||d.c){ST.ciudad=['Roma','Capua'].includes(d.av||d.c)?(d.av||d.c):'Roma';ST.sheet=null;ir('ciudad');return}
 if(d.s){ST.imp=d.s;pintaImp();return}
 if(d.f){ST.filtro=d.f;pintaImp();return}
 if(d.co!==undefined){t.classList.toggle('on');t.classList.toggle('no');t.querySelector('use').setAttribute('href',t.classList.contains('on')?'#ok':'#cruz');return}
 if(d.obra!==undefined){ST.sheet=null;ST.sel=null;todo();return}
});
window.demo=(n)=>{ST.crisis=false;ST.op=null;ST.ac=null;ST.apagado=0;ST.sel=null;ST.sheet=null;ST.imp='ciudades';ST.filtro='todas';ST.ciudad='Roma';
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==='ciudad'));ST.tab='ciudad';$('#imp').classList.remove('on');
 if(n==='obra'){ST.sel='granja';ST.sheet='granja'}
 if(n==='falta'){ST.sel='mercado';ST.sheet='mercado'}
 if(n==='intriga'){ST.op='defensa';ST.sheet='intriga';document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==='gob'))}
 if(n==='crisis'){ST.crisis=true;ST.sel='insulas';ST.sheet='crisis';ST.ac='vig'}
 if(n==='crisis0'){ST.crisis=true}
 if(n==='imperio'||n==='obras'||n==='avisos'){ST.tab='imp';ST.imp=n==='imperio'?'ciudades':n;$('#imp').classList.add('on');pintaImp();document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==='imp'))}
 todo();};
function ajusta(){const s=Math.min(innerWidth/390,innerHeight/844);if(innerWidth<=390&&innerHeight>=844)return;const a=$('#app');a.style.transform='scale('+Math.min(1,s)+')'}
addEventListener('resize',ajusta);ajusta();
todo();
</script></body></html>
