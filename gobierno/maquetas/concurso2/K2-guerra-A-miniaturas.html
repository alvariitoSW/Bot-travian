/* ======== utilidades y proyección de la mesa (cámara cenital inclinada) ======== */
const NS='http://www.w3.org/2000/svg',$=s=>document.querySelector(s);
const E=(t,a,p,x)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(x!=null)e.textContent=x;p&&p.appendChild(e);return e};
const KY=.647,W=900,H=460,SV=n=>n.replace?n:n;
const Sc=t=>.8+.35*t;
let hills=[];
const elev=(x,y)=>{let e=0;for(const h of hills){const dx=(x-h.x)/h.rx,dy=(y-h.y)/h.ry,d=dx*dx+dy*dy;if(d<1){const w=1-d;e+=h.h*w*(2-w)}}return e};
const G=(wx,wy)=>{const t=Math.max(0,Math.min(1.2,wy/H));return[422+(wx-450)*Sc(t),52+290*(.8*t+.175*t*t)/.975,Sc(t)]};
const P=(wx,wy,l=0)=>{const g=G(wx,wy);return[g[0],g[1]-(elev(wx,wy)+l)*g[2],g[2]]};
const inv=(x,y)=>{let yy=y,r;for(let k=0;k<3;k++){const u=(yy-52)/290*.975,t=(-.8+Math.sqrt(Math.max(0,.64+.7*u)))/.35,s=Sc(t);r=[450+(x-422)/s,t*H];yy=y+elev(r[0],r[1])*s}return r};
const rnd=(()=>{let a=11;return()=>(a=(a*16807)%2147483647)/2147483647})();
