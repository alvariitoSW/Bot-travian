<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tus ministros (maqueta)</title>
<link rel="stylesheet" href="../../../css/style.css">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1a130a url(../fondo-ciudad.jpg) center/cover no-repeat}
#barra{position:fixed;left:0;right:0;bottom:0;height:76px;box-sizing:border-box;display:flex;gap:8px;padding:10px 12px;background:linear-gradient(#2a1e10,#150e06);border-top:2px solid #7a5a1f;z-index:70}
#barra button{flex:1;min-width:0;border-radius:10px;border:1px solid #7a5a1f;color:#ecd9a8;font:700 16px Georgia,serif;background:linear-gradient(#3e2e16,#1f160a)}
#barra button.on{color:#2b1c0a;background:linear-gradient(#f3e2b4,#d8bb80);box-shadow:inset 0 0 0 2px #9b2a1a}
</style></head><body>
<div id="barra"><button>Construir</button><button class="on">Ministros</button><button>Senado</button></div>
<script src="../../../js/data.js"></script>
<script src="../../../js/ministros.js"></script>
<script src="../../../js/ministros-ui.js"></script>
<script>
(function () {
  var D = window.DATA, M = window.MINISTROS;
  /* En esta maqueta se finge que existe el edificio «termas», para comprobar que siempre se ve como «Baños». */
  if (!D.BUILD.termas) D.BUILD.termas = { n: 'Termas', i: '♨️', solar: 1, cost: { materiales: 280, denarios: 110 }, time: 2.5, d: 'Maqueta.' };
  var s = { t: 30, res: { grano: 1240, denarios: 860, materiales: 530, hierro: 210 },
    cities: {
      roma: { owner: 'roma', pop: 4870, b: { foro: 3, cuartel: 2, herreria: 1, templo: 1, granja: 3, mercado: 2, cantera: 2, mina: 1, fuente: 1 }, units: { hastati: 120 }, imp: 'normal', obras: [] },
      capua: { owner: 'roma', pop: 1200, b: { foro: 1 }, units: {}, imp: 'normal', obras: [] } },
    inv: { edad: 1, hechas: {} }, senado: { bandos: ['ter', 'mer', 'mil', 'sac', 'pue'] } };
  window.S = s;
  M.migrar(s); M.propuestas(s, 30);
  ['ejercito', 'agricultura', 'hacienda'].forEach(function (id) { if (s.ministros.propuestas[id]) M.aceptar(s, id, 30); });
  if (!s.ministros.encargos.infra) M.encargar(s, 'infra', { tipo: 'nivel', ciudad: 'roma', b: 'termas', objetivo: 1 }, 30);
  s.ministros.avisos.mineria = 'Faltan 40 de hierro';
  if (!s.ministros.propuestas.mineria && !s.ministros.encargos.mineria) s.ministros.propuestas.mineria = M.proponer(s, 'mineria', 30);
  var q = new URLSearchParams(location.search);
  window.MINISTROS_UI.abrir(s, { mes: 30, alCambiar: function () { window.CAMBIOS = (window.CAMBIOS || 0) + 1; } });
  if (q.get('lista')) window.MINISTROS_UI.lista(q.get('lista')); else if (q.get('abre')) window.MINISTROS_UI.abre(q.get('abre'));
  if (q.get('abajo')) { var l = document.querySelector('.mn-lista'); l.scrollTop = l.scrollHeight; }
})();
</script></body></html>
