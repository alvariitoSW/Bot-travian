<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maqueta Q1b2 aligerada (Q1c) — ciudad itálica</title>
<base href="../../../">
<style>html,body{margin:0;height:100%;background:#1b1a17;overflow:hidden}canvas{display:block;width:100vw;height:100vh}#nota{position:fixed;left:8px;bottom:8px;font:11px system-ui;color:#fff8;pointer-events:none}</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<div id="nota"></div>
<script>
/* El juego publicado guarda en su caché todo lo que pasa por él. Aquí se borra solo lo de las maquetas, en cada visita (con una sola recarga por sesión), para ver siempre la versión nueva. */
(function () { try {
  if (!window.caches) return;
  var primera = !sessionStorage.getItem('q1c-limpio'); sessionStorage.setItem('q1c-limpio', '1');
  caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.open(k).then(function (c) { return c.keys().then(function (rs) {
    var mias = rs.filter(function (r) { return r.url.indexOf('/gobierno/maquetas/') >= 0; });
    return Promise.all(mias.map(function (r) { return c.delete(r); })).then(function (b) { return b.length; }); }); }); })); })
  .then(function (n) { if (primera && n.reduce(function (a, b) { return a + b; }, 0) > 0) location.reload(); }).catch(function () {});
} catch (e) {} })();
</script>
<script type="module" src="gobierno/maquetas/ciudad2/ciudad.js"></script>
<script type="module" src="gobierno/maquetas/ciudad2/prueba.js"></script>
</body>
</html>
