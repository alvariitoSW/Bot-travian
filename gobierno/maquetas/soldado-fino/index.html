<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>AQVILA · soldado fino (maqueta GM44)</title>
<base href="../../../">
<style>
  html,body{margin:0;height:100%;background:#20190f;overflow:hidden;font-family:Georgia,serif;color:#f1e3b5;touch-action:none}
  canvas{position:fixed;inset:0;width:100%;height:100%}
  #arriba{position:fixed;left:0;right:0;top:0;padding:8px 10px;font-size:13px;line-height:1.3;background:linear-gradient(#000a,#0000);pointer-events:none}
  #abajo{position:fixed;left:0;right:0;bottom:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:6px;justify-content:center;background:linear-gradient(#0000,#000a)}
  button{font:inherit;font-size:14px;color:#f1e3b5;background:#3a2c18;border:1px solid #8a6a32;border-radius:8px;padding:9px 11px;min-height:42px}
  button.on{background:#7a2a20;border-color:#d9b25c}
</style></head><body>
<canvas id="c"></canvas>
<div id="arriba"><b>Soldado nuevo (hastatus), hecho por código</b><br><span id="dato">cargando…</span></div>
<div id="abajo">
  <button data-m="quieto" class="on">Quieto</button><button data-m="andar">Andar</button><button data-m="golpe">Lanzar</button>
  <button id="comp">Comparar con el de hoy</button><button id="muchos">Ver 40</button><button id="cara">Ver la cara</button>
</div>
<script type="module" src="gobierno/maquetas/soldado-fino/vista.js"></script>
</body></html>
